# Public site choices only. Replace EVERY example.invalid value before use.
# Merge after context-trial-profile.yaml; see docs/installation/context-trial.md.
# All rootsPEM fields are filled by the guide's --set-file arguments.
# Credentials/private keys never belong in this file.
image:
  repository: registry.example.invalid/asservat
  digest: sha256:REPLACE_WITH_VERIFIED_DIGEST
origin: https://asservat.hub.example.invalid:31450
identity:
  issuer: https://id.example.invalid/realms/homelab
  clientID: asservat-console
  browserAudience: asservat-api
  providerRootsPEM: REPLACE_WITH_ISSUER_CA_PEM
  clientSecret: {existingSecret: operator-oidc-client}
  clients: [ { id: asservat-console, kind: human } ]
  eligibleGroups: [REPLACE_WITH_STABLE_TRIAL_USERS_GROUP_ID]
  processingOperators:
    - clientID: asservat-console
      issuer: https://id.example.invalid/realms/homelab
      kind: Group
      id: REPLACE_WITH_STABLE_TRIAL_USERS_GROUP_ID
exposure:
  # Existing kubernetes.io/tls Secret for the origin.
  tlsSecret: operator-console-tls
fleet:
  issuer: https://id.example.invalid/realms/homelab
  clients: [asservat-console]
  groups: [REPLACE_WITH_STABLE_FLEET_OPERATOR_GROUP_ID]
federation:
  endpoint: https://federation.hub.example.invalid:31446
  serverName: federation.hub.example.invalid
  ownerAddress: owner.hub.example.invalid:31447
  ownerOperationAddress: owner.hub.example.invalid:31449
  keyServiceEndpoint: https://keys.hub.example.invalid:31448
  evidenceStore: { endpoint: "https://s3.example.invalid", region: us-east-1, bucket: asservat-evidence, rootsPEM: "" }
services:
  postgres:
    external: { host: postgres.example.invalid, database: asservat, rootsPEM: "", adminSecret: operator-postgres-admin }
  objectStore:
    external: { endpoint: "https://s3.example.invalid", region: us-east-1, bucket: asservat-audit, rootsPEM: "" }
  keyService:
    external: { endpoint: "https://bao.example.invalid", rootsPEM: "" }
