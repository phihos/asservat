# Configured disposable-trial bounds, NOT measured universal qualification.
# The 1s residual allowance is not a supported backup/restore configuration.
# Keep separate from site-values.yaml; merge profile first, site second.
# Normal/resolution/processing slot counts preserve native journey headroom.
# Two capture accounts, H=1, backend envelopes and connector downsizing are
# proposed trial choices; they have NOT been measured end-to-end.
# 32GiB root WAL is a logical prepaid maximum, NOT immediate disk allocation.
# Dedicated backing and capacityAssurance require actual operator qualification.
# processors: [] is an explicit declaration: no third-party processors.
# An empty capacity.policySpec.scope.clusterID selects this hub's generated cluster ID.
mode: hub
collector: {enabled: false}
identity:
  maxLifetimeSeconds: 3600
  maxLogins: 8
  maxSessions: 8
  maxLogoutEvents: 8
  eligibleSubjects: []
  groupMaxAgeSeconds: 300
processors: []
captureHistory: {perSelector: 16, perInstallation: 32}
exposure:
  service: {type: NodePort, nodePort: 31450}
fleet:
  subjects: []
  deliveryProfiles: [regional-installer]
  maxActiveBootstraps: 1
  maxBootstrapHistory: 4
  maxClusters: 1
capacity:
  pool: trial
  policy: trial-apps
  namespaceKeys: [asservat-trial]
  accounts: 2
  recordsPerAccount: 8
  admissionSeconds: 86400
  lanes:
    captureRetainedSeconds: 10000
    normal: {accounts: 4, recordsPerAccount: 128, retainedSeconds: 10000}
    resolution: {accounts: 4, recordsPerAccount: 8, retainedSeconds: 10000}
    processing: {accounts: 2, recordsPerAccount: 16, retainedSeconds: 10000}
  stopRetainedSeconds: 10000
  backup: {horizonSeconds: 1, cleanupBudgetSeconds: 60, proofWindowSeconds: 60, backupCopies: 1, walCopies: 1}
  footprints:
    capture: {rowBytes: 131072, transitionWALBytes: 262144}
    operation: {rowBytes: 131072, transitionWALBytes: 262144}
    processing: {rowBytes: 131072, transitionWALBytes: 262144}
    native: {rowBytes: 65536, transitionWALBytes: 131072}
    stop: {rowBytes: 131072, transitionWALBytes: 262144}
    processingState: {rowBytes: 16384, transitionWALBytes: 65536}
  purgeLeases: 4
  processing: {maxRules: 2, maxRootTransitions: 512}
  metadata: {fixedRowBytes: 1048576, accountRowBytes: 262144, recordRowBytes: 131072, recordWALBytes: 8388608, recordKeyAttempts: 16,
    transitionWALBytes: 1048576, configurationTransitions: 4096}
  envelope:
    systemObjects: {bytes: 1073741824, objects: 4096}
    sqlBytes: 536870912
    backupBytes: 1073741824
    walBytes: 34359738368
    keyAttempts: 16384
  backends:
  - storageProfile: trial-dedicated
    usable: {bytes: 8589934592, objects: 16000}
  poolSpec:
    storageProfileRef: trial-dedicated
    capacity: {bytes: 8589934592, objects: 16000}
    safetyHeadroom: {bytes: 1073741824, objects: 2000}
    systemReserve: {bytes: 2147483648, objects: 6000}
    sharedBurst: {bytes: 1073741824, objects: 2000}
    protectedAllocations:
    - budgetPolicyRef: trial-apps
      workloadSlots: 2
      protectedPerWorkload: {bytes: 1073741824, objects: 2000}
    upload: {bytesPerSecond: 16777216, burstBytes: 16777216}
    maxUploadRequestsPerSecond: 20
    capacityAssurance: qualifiedReservedBackend
  policySpec:
    poolRef: trial
    scope:
      clusterID: ''
      namespaceSelector:
        matchLabels: {asservat-trial: 'true'}
    namespaceEnvelope: {maxWorkloadAccounts: 2, maxStoredBytes: 3221225472, maxObjects: 6000}
    workload:
      protected: {bytes: 1073741824, objects: 2000}
      hardLimit: {bytes: 1610612736, objects: 3000}
      contextReserve: {bytes: 12353536, objects: 32}
      dump: {burst: 1, minimumIntervalSeconds: 900, maxStartsPerRollingHour: 1, maxInputBytesPerRollingHour: 1048576}
      maxConcurrentExpensive: 1
      maxQueuedExpensive: 1
      maxQueueAgeSeconds: 30
      upload: {bytesPerSecond: 8388608, burstBytes: 8388608}
      maxUploadRequestsPerSecond: 10
      maxSpoolBytes: 16777216
      onFull: RejectNewExpensive
    node:
      maxConcurrentExpensive: 1
      maxQueuedExpensive: 1
      upload: {bytesPerSecond: 8388608, burstBytes: 8388608}
      maxSpoolBytes: 16777216
      impactProfileRef: standard-node
      unhealthySamples: 3
      sampleIntervalSeconds: 5
      recoveryHealthySeconds: 60
retention:
  purposeRef: context-trial
  defaults: {evidenceSeconds: 300, caseMetadataSeconds: 3600, auditMetadataSeconds: 3600}
  maxima: {evidenceSeconds: 3600, caseMetadataSeconds: 3600, auditMetadataSeconds: 3600}
  deletionBudgetSeconds: 300
federation:
  serviceType: NodePort
  nodePort: 31446
  ownerNodePort: 31447
  ownerOperationNodePort: 31449
  keyServiceNodePort: 31448
  connector:
    accounts: 1
    recordsPerAccount: 96
    retainedSeconds: 4000
    profiles: 1
    sourceTransitions: 8
    purgeLeases: 2
    validSeconds: 3600
    footprint: {rowBytes: 1048576, transitionWALBytes: 1048576}
  fleet: {channelMount: fleet-bootstrap, deliveryProfile: regional-installer}
hub:
  hub-api: {connections: 4, concurrency: 2}
