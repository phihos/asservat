# All-four-services overlay; see docs/installation/small-profile.md. Merge AFTER context-trial-profile.yaml.
# Replace site placeholders and use the registry manifest digests of your
# source-built images. Generated Secrets are created by the `secrets` hook.
image:
  repository: registry.example.invalid/asservat
  digest: sha256:REPLACE_PRODUCT_MANIFEST_DIGEST
origin: https://asservat.lab.example.invalid:31450
identity:
  clientID: asservat-console
  browserAudience: asservat-api
  eligibleGroups: [] # Product adds the original generated users-group UUID.
exposure:
  tlsSecret: operator-console-tls
fleet:
  clients: [asservat-console, asservat-mcp]
  groups: [] # Product adds its original generated users-group UUID.
federation:
  endpoint: https://federation.lab.example.invalid:31446
  serverName: federation.lab.example.invalid
  ownerAddress: owner.lab.example.invalid:31447
  ownerOperationAddress: owner.lab.example.invalid:31449
  keyServiceEndpoint: https://keys.lab.example.invalid:31448
  evidenceStore: {} # Same bundled bucket, separate keys.
services:
  postgres:
    provider: bundled
    bundled:
      image: registry.example.invalid/asservat-postgres@sha256:REPLACE_PG_MANIFEST_DIGEST
      storageClass: REPLACE_STORAGE_CLASS
      dataSize: 64Gi
      backupSize: 64Gi
  keyService:
    provider: openbao
    openbao:
      persistence: { storageClass: REPLACE_STORAGE_CLASS, size: 8Gi }
  objectStore:
    provider: seaweedfs
    seaweedfs:
      persistence: { storageClass: REPLACE_STORAGE_CLASS, size: 32Gi }
  identity:
    provider: keycloak
    keycloak:
      hostname: https://login.lab.example.invalid:31451
      realm: asservat
      processingOperators: true
      tlsSecretName: operator-keycloak-tls
      service: { type: NodePort, nodePort: 31451 }
      # The empty host selects the SAME generated PostgreSQL server.
      database: { host: "" }
