apiVersion: asservat.io/v1alpha1
kind: DebugPolicy
metadata:
  name: checkout-restarts
  namespace: payments
spec:
  target:
    workloadRef:
      kind: Deployment
      name: checkout
  detectors:
  - id: crashed
    kind: exit
    options:
      reasons:
      - OOMKilled
      - Error
      - CrashLoopBackOff
  when:
    detector: crashed
  recipeRef:
    name: builtin-pod-status-v1
  budgets:
    cooldown: 5m
    burst: 2
    maxConcurrentActions: 1
  retention: 72h
  evaluation:
    scope: pod
    fireOnActivation: false
    rearmFor: 10s
