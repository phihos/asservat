apiVersion: asservat.io/v1alpha1
kind: DebugPolicy
metadata:
  name: api-failures-shared
  namespace: payments
spec:
  presetRef:
    name: workload-failure
    version: v1
  target:
    workloadRef:
      kind: Deployment
      name: api
  logPattern:
    match: literal
    value: 'panic:'
  sharing:
    recipients:
    - kind: Group
      issuer: https://identity.example.invalid/realms/company
      id: group-incident-reviewers-789
    futureCaptures:
      enabled: true
      maxCaptures: 10
    notAfter: '2026-10-09T18:00:00Z'
