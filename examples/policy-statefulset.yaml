apiVersion: asservat.io/v1alpha1
kind: DebugPolicy
metadata:
  name: ledger-memory
  namespace: payments
spec:
  target:
    workloadRef:
      kind: StatefulSet
      name: ledger
      uid: workload-ledger-uid
    adoption: pinUID
    ordinals:
    - 0
  detectors:
  - id: memory-high
    kind: resource
    options:
      metric: memoryLimitRatio
      operator: gte
      threshold: 0.85
      sampleInterval: 5s
  when:
    for:
      expression:
        detector: memory-high
      duration: 20s
  recipeRef:
    name: bounded-live-diagnostics
  budgets:
    cooldown: 30m
    burst: 1
    maxConcurrentActions: 1
  retention: 72h
  evaluation:
    scope: pod
    fireOnActivation: true
    rearmFor: 10s
