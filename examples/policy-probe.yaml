apiVersion: asservat.io/v1alpha1
kind: DebugPolicy
metadata:
  name: checkout-readiness
  namespace: payments
spec:
  target:
    workloadRef:
      kind: Deployment
      name: checkout
  detectors:
  # ADR-230: kubelet readiness-probe failures from Kubernetes Events. Fires
  # once when a Pod has at least two failures within one minute; re-arms after
  # a minute without failure.
  - id: unready
    kind: probe
    options:
      probeType: Readiness
      minimumFailures: 2
      window: 1m
      source: events
  when:
    detector: unready
  recipeRef:
    name: builtin-pod-status-v1
  budgets:
    cooldown: 5m
    burst: 2
    maxConcurrentActions: 1
  retention: 72h
  evaluation:
    scope: pod
    fireOnActivation: false
    rearmFor: 10s
