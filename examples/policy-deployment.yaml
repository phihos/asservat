apiVersion: asservat.io/v1alpha1
kind: DebugPolicy
metadata:
  name: suspicious-api
  namespace: payments
spec:
  target:
    workloadRef:
      kind: Deployment
      name: api
  detectors:
  - id: panic-log
    kind: log
    options:
      stream: both
      pattern: panic|fatal error|connection reset
      match: regexp
      maxRecordBytes: 65536
  - id: memory-high
    kind: resource
    options:
      metric: memoryLimitRatio
      operator: gte
      threshold: 0.85
      sampleInterval: 30s
  - id: probe-failed
    kind: probe
    options:
      probeType: Liveness
      minimumFailures: 1
      window: 30s
      source: auto
  when:
    any:
    - detector: panic-log
    - for:
        expression:
          detector: memory-high
        duration: 20s
    - detector: probe-failed
  recipeRef:
    name: incident-context
  budgets:
    cooldown: 5m
    burst: 2
    maxConcurrentActions: 3
  retention: 72h
  evaluation:
    scope: pod
    fireOnActivation: true
    rearmFor: 10s
