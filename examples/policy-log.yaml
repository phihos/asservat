apiVersion: asservat.io/v1alpha1
kind: DebugPolicy
metadata:
  name: checkout-panics
  namespace: payments
spec:
  target:
    workloadRef:
      kind: Deployment
      name: checkout
  detectors:
  # ADR-241: container log records of each Pod within eventWindow, read
  # through the Kubernetes log API by the regional connector. Fires once when
  # a matching record appears; re-arms after a window without a match. Only
  # counts and the record time leave the cluster, never the text.
  - id: panics
    kind: log
    eventWindow: 30s
    options:
      stream: both
      match: regexp
      pattern: 'panic: .*(timeout|connection refused)'
      maxRecordBytes: 16384
      overlong: drop
  when:
    detector: panics
  recipeRef:
    name: builtin-pod-status-v1
  budgets:
    cooldown: 5m
    burst: 2
    maxOccurrencesPerHour: 12
    maxConcurrentActions: 1
  retention: 72h
  evaluation:
    scope: pod
    fireOnActivation: false
    rearmFor: 10s
