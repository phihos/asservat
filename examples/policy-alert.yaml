apiVersion: asservat.io/v1alpha1
kind: DebugPolicy
metadata:
  name: checkout-error-rate
  namespace: payments
spec:
  target:
    workloadRef:
      kind: Deployment
      name: checkout
  detectors:
  # Alertmanager delivers webhooks (send_resolved: true) to the connector's
  # receiver. An alert counts when its namespace label is this namespace, its pod label
  # names a Pod of the workload (or a deployment label names the workload)
  # and its other labels match matchLabels. Fires once
  # when such an alert starts; re-arms when Alertmanager reports it resolved.
  - id: errors
    kind: alert
    options:
      receiverRef: alertmanager
      status: firing
      matchLabels:
        alertname: CheckoutHighErrorRate
        severity: critical
  when:
    detector: errors
  recipeRef:
    name: builtin-pod-status-v1
  budgets:
    cooldown: 5m
    burst: 2
    maxConcurrentActions: 1
  retention: 72h
  evaluation:
    scope: pod
    fireOnActivation: false
    rearmFor: 10s
