apiVersion: asservat.io/v1alpha1
kind: EvidenceRecipe
metadata:
  name: go-pprof-incident
  namespace: payments
spec:
  description: Bounded Go pprof CPU, heap and mutex evidence under a reviewed profiling
    grant.
  actions:
  - id: cpu
    kind: profile
    parameters:
      runtime: go
      type: cpu
      source:
        kind: httpEndpoint
        profileRef: api-local-pprof
      duration: 10s
      forceGC: false
      mode: interval
    required: true
    impact: intrusive
    limits:
      maxBytes: 16777216
      timeout: 15s
  - id: heap
    kind: profile
    parameters:
      runtime: go
      type: heap
      source:
        kind: httpEndpoint
        profileRef: api-local-pprof
      forceGC: false
      mode: snapshot
    required: false
    impact: intrusive
    limits:
      maxBytes: 16777216
      timeout: 5s
  - id: mutex
    kind: profile
    parameters:
      runtime: go
      type: mutex
      source:
        kind: httpEndpoint
        profileRef: api-local-pprof
      forceGC: false
      mode: cumulative
    required: false
    impact: intrusive
    limits:
      maxBytes: 16777216
      timeout: 5s
  maxTotalBytes: 50331648
  maxDuration: 30s
