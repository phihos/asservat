apiVersion: asservat.io/v1alpha1
kind: PermissionSource
metadata:
  name: inherit-workload-management
  namespace: asservat-system
spec:
  enabled: false
  cluster: prod
  type: kubernetesAccessReview
  namespaceSelector:
    matchLabels:
      platform.example.invalid/managed: 'true'
  excludedNamespaces:
  - kube-system
  - asservat-system
  role: workload-maintainer
  identityMappingRef: company-oidc-to-cluster
  admissionParity:
    mode: qualifiedAdapter
    adapterRef: workload-change-guard
  accessReview:
    check: workloadPatch
