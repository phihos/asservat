apiVersion: asservat.io/v1alpha1
kind: CaptureProfile
metadata:
  name: ledger-stall.v1
  namespace: payments
spec:
  name: ledger-stall
  version: v1
  definition:
    displayName: Ledger stall evidence
    description: Materialized namespace profile derived from HTTP headers, syscall
      metadata and process context.
    recipe:
      description: Expanded capture profile composition fixture.
      actions:
      - id: a005bdfce57635c5dabddbdd6
        kind: packetCapture
        parameters:
          profile:
            kind: httpHeaders
            protocol: http1
            projectionRef:
              name: http-response-headers
              version: v1
            maxHeaderBytes: 32768
            maxReassemblyBytes: 16777216
          before: 30s
          after: 30s
          ring:
            maxAge: 30s
            maxBytes: 16777216
            segments: 4
          peers:
            entries:
            - cidrs:
              - 0.0.0.0/0
              - ::/0
            protocol: tcp
            resolution: frozen
          filter: tcp port 8080
        required: true
        impact: sensitiveRead
        limits:
          maxBytes: 67108864
          timeout: 90s
        executionMode: ongoing
      - id: a5b186fa2f944fc675c96fcc2
        kind: syscallTrace
        parameters:
          processes: allPodProcesses
          mode: metadata
          before: 30s
          after: 10s
          syscalls:
            mode: all
          result: all
          ring:
            maxAge: 30s
            maxBytes: 8388608
            segments: 4
          maxEventsPerSecond: 10000
          maxTrackedThreads: 4096
        required: true
        impact: observe
        limits:
          maxBytes: 16777216
          timeout: 20s
        executionMode: ongoing
      - id: adf187502ec3e8884310b85cf
        kind: processSnapshot
        parameters:
          include:
          - identity
          - status
          - cgroups
        required: true
        impact: observe
        limits:
          maxBytes: 1048576
          timeout: 5s
        executionMode: onTrigger
      - id: a7e5c90417a8841bef4f7993c
        kind: networkSnapshot
        parameters:
          include:
          - sockets
          - counters
          - socketOwners
        required: false
        impact: observe
        limits:
          maxBytes: 1048576
          timeout: 5s
        executionMode: onTrigger
      maxTotalBytes: 100663296
      maxDuration: 120s
    editableFields:
    - actionID: a005bdfce57635c5dabddbdd6
      field: packetFilter
      label: HTTP pcap filter
    - actionID: a005bdfce57635c5dabddbdd6
      field: actionExecutionMode
      label: When recording starts
    - actionID: a5b186fa2f944fc675c96fcc2
      field: actionExecutionMode
      label: When recording starts
  availability:
    enabled: true
    deprecated: false
