apiVersion: asservat.io/v1alpha1
kind: PermissionSource
metadata:
  name: namespace-maintainers
  namespace: asservat-system
spec:
  enabled: true
  cluster: prod
  type: namespaceMetadata
  namespaceSelector:
    matchLabels:
      platform.example.invalid/managed: 'true'
  excludedNamespaces:
  - kube-system
  - asservat-system
  role: workload-maintainer
  maxNamespaces: 200
  protection:
    mode: administratorManaged
  metadataMapping:
    field: label
    key: platform.example.invalid/owner-group
    mode: groupName
    prefix: /
