apiVersion: asservat.io/v1alpha1
kind: DebugCapture
metadata:
  name: composed-ledger
  namespace: payments
spec:
  target:
    workloadRef:
      kind: StatefulSet
      name: ledger
    selection: lowestOrdinal
    ordinals:
    - 0
  reason: Investigate a synthetic ledger stall.
  profileComposition:
    components:
    - id: http
      profileRef:
        catalog: builtin
        name: http-headers
        version: v1
      overrides:
      - actionID: http
        field: packetFilter
        value: tcp port 8080
    - id: calls
      profileRef:
        catalog: builtin
        name: syscall-activity
        version: v1
    - id: context
      profileRef:
        catalog: builtin
        name: process-context
        version: v1
    maxTotalBytes: 100663296
    maxDuration: 120s
