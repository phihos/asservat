apiVersion: asservat.io/v1alpha1
kind: DebugPolicy
metadata:
  name: api-cpu-profile
  namespace: payments
spec:
  target:
    workloadRef:
      kind: Deployment
      name: api
  detectors:
  - id: cpu-high
    kind: resource
    options:
      metric: cpuQuotaRatio
      operator: gte
      threshold: 0.9
      sampleInterval: 30s
  when:
    for:
      expression:
        detector: cpu-high
      duration: 20s
  recipeRef:
    name: go-pprof-incident
  budgets:
    cooldown: 10m
    burst: 1
    maxOccurrencesPerHour: 6
    maxConcurrentActions: 1
  retention: 72h
  evaluation:
    scope: pod
    fireOnActivation: true
    rearmFor: 10s
