apiVersion: asservat.io/v1alpha1
kind: DebugCapture
metadata:
  name: manual-ledger-shared
  namespace: payments
spec:
  target:
    workloadRef:
      kind: StatefulSet
      name: ledger
    selection: lowestOrdinal
    ordinals:
    - 0
  recipeRef:
    name: bounded-live-diagnostics
  reason: Investigate a synthetic ledger stall.
  sharing:
    recipients:
    - kind: Group
      issuer: https://identity.example.invalid/realms/company
      id: group-incident-reviewers-789
    outputSelection:
      mode: explicit
      outputs:
      - actionID: core
        dataClass: extract
        projectionRef:
          name: backtrace-allowlist
          version: v1
        operations:
        - get_case
        - list_artifacts
        - get_extract
      - actionID: core
        dataClass: raw
        operations:
        - read_memory
    notAfter: '2026-10-09T18:00:00Z'
    management:
      mode: teams
      teams:
      - kind: Group
        issuer: https://identity.example.invalid/realms/company
        id: group-payments-123
      - kind: Group
        issuer: https://identity.example.invalid/realms/company
        id: group-payments-sre-456
