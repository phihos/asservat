apiVersion: asservat.io/v1alpha1
kind: DebugCapture
metadata:
  name: manual-ledger-investigation
  namespace: payments
spec:
  target:
    workloadRef:
      kind: StatefulSet
      name: ledger
    selection: lowestOrdinal
    ordinals:
    - 0
  recipeRef:
    name: bounded-live-diagnostics
  reason: Investigate a synthetic ledger stall.
  resultAccess:
    actionIds:
    - core
    operations:
    - read_memory
    - download_artifact
    maxArtifacts: 2
    maxBytes: 6442450944
    maxOperations: 20
    notAfter: '2026-10-09T12:50:00Z'
