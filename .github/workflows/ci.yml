name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Both jobs run on amd64 and on arm64: the agent reads stacks, cores and
  # the kernel's structures, which differ between the two.
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      # An S3-compatible store for the evidence store test; it starts while Go builds.
      - run: docker run -d -p 127.0.0.1:8333:8333 docker.io/chrislusf/seaweedfs:latest server -s3
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # The tests that describe cores take them with gcore and skip without it,
      # as the test of debug packages does without bsdtar.
      - run: sudo apt-get install -y --no-install-recommends gdb libarchive-tools python3-venv
      # As in the image: the test of a Python core's stacks skips without it.
      - run: sudo python3 -m venv /opt/pystack && sudo /opt/pystack/bin/pip install --no-cache-dir pystack==1.7.2
      - if: matrix.runner == 'ubuntu-24.04-arm'
        run: |
          mkdir /tmp/dbg && cd /tmp/dbg
          cat >block.c <<'EOF'
          #include <unistd.h>
          #include <string.h>
          static int deeper(int depth, volatile char *note) {
          	volatile char local[96];
          	memset((char *)local, depth, sizeof local);
          	if (depth > 0) return deeper(depth - 1, note) + local[1];
          	pause();
          	return note[0] + local[0];
          }
          int block_in_library(int depth) {
          	volatile char note[200];
          	memset((char *)note, 1, sizeof note);
          	return deeper(depth, note) + 1;
          }
          EOF
          cat >main.c <<'EOF'
          #include <stdio.h>
          #include <sys/prctl.h>
          int block_in_library(int depth);
          __attribute__((noinline)) int handle_order(int order) { return block_in_library(2) + order; }
          int main(void) {
          	prctl(0x59616d61, -1UL, 0, 0, 0);
          	puts("ready"); fflush(stdout);
          	return handle_order(7);
          }
          EOF
          gcc -O1 -fPIC -shared -fno-asynchronous-unwind-tables -fno-unwind-tables -fomit-frame-pointer -fno-optimize-sibling-calls -s -Wl,-soname,libblock.so.1 -o libblock.so.1 block.c
          gcc -O1 -g -fno-optimize-sibling-calls -o waiting main.c -L. -l:libblock.so.1 -Wl,-rpath,'$ORIGIN'
          readelf -SW libblock.so.1 | grep -E 'eh_frame|\.text|debug_frame|plt'
          objdump -d libblock.so.1 | sed -n '/<.text>/,$p' | head -70
          ./waiting & sleep 1
          sudo gcore -o core $! >/dev/null
          sudo chmod a+r core.*
          gdb --batch -nx -ex "core-file $(ls core.*)" -ex "file waiting" -ex "core-file $(ls core.*)" -ex bt -ex "frame 1" -ex "info registers pc sp x29 x30" -ex "x/48gx \$sp" -ex "info files" 2>&1 | grep -v '^\[New\|warning' | head -120
          kill %1 || true
      - run: go test -race ./...
        env:
          ASSERVAT_TEST_DSN: postgres://postgres:pw@127.0.0.1:5432/postgres
          ASSERVAT_TEST_S3: 127.0.0.1:8333,test,test-secret
      - run: helm lint charts/asservat
  e2e:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      # The runner is a disposable machine: the test may change its core pattern.
      - run: CORE_HANDLER=1 SAMPLE_CPU=1 test/e2e/run.sh
  # Every commit on main is published as ghcr.io/<owner>/asservat:main and
  # :<commit>, and the agent's image under the same tags with "-agent".
  image:
    if: github.event_name == 'push'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          image=ghcr.io/${{ github.repository }}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          label=org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # The layers are compressed with zstd instead of gzip: measured on
          # the agent's image 106 MiB instead of 125 MiB to pull, and faster
          # to unpack. containerd, CRI-O and Docker from version 23 read it.
          # The level is BuildKit's highest; the base image's layers are
          # compressed again (force-compression) to be zstd as well.
          docker buildx create --use >/dev/null
          publish() { docker buildx build "$@" --label "$label" --output type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=19,force-compression=true .; }
          publish --target agent -t "$image:main-agent" -t "$image:${{ github.sha }}-agent"
          publish -t "$image:main" -t "$image:${{ github.sha }}"
  # The branch ruleset requires this one check.
  ci-ok:
    if: always()
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success -a "${{ needs.e2e.result }}" = success
