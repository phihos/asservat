name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Both jobs run on amd64 and on arm64: the agent reads stacks, cores and
  # the kernel's structures, which differ between the two.
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      # An S3-compatible store for the evidence store test; it starts while Go builds.
      - run: docker run -d -p 127.0.0.1:8333:8333 docker.io/chrislusf/seaweedfs:latest server -s3
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # Known vulnerabilities of Go and of the dependencies that the code reaches.
      # Once is enough: the answer does not depend on the runner's architecture.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
        if: matrix.runner == 'ubuntu-latest'
      # The tests that describe cores take them with gcore and skip without it,
      # as the test of debug packages does without bsdtar.
      - run: sudo apt-get install -y --no-install-recommends gdb libarchive-tools python3-venv
      # As in the image: the test of a Python core's stacks skips without it.
      - run: |
          sudo python3 -m venv /opt/pystack
          sudo /opt/pystack/bin/pip install --no-cache-dir --require-hashes --only-binary=:all: -r internal/coredesc/pystack-requirements.txt
      - run: go test -race ./...
        env:
          ASSERVAT_TEST_DSN: postgres://postgres:pw@127.0.0.1:5432/postgres
          ASSERVAT_TEST_S3: 127.0.0.1:8333,test,test-secret
      - run: helm lint charts/asservat
  e2e:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      # The runner is a disposable machine: the test may change its core pattern.
      # GitHub's amd64 runners have Chrome: there the pages must be looked at. The arm64 runners have no browser.
      - run: CORE_HANDLER=1 SAMPLE_CPU=1 REQUIRE_BROWSER=${{ matrix.runner == 'ubuntu-latest' && '1' || '' }} SHOTS=${{ runner.temp }}/pages test/e2e/run.sh
      # The pages as the run saw them, with the test's synthetic evidence: to look at what a change did to them.
      - if: always() && matrix.runner == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: pages
          path: ${{ runner.temp }}/pages
          if-no-files-found: ignore
          retention-days: 7
  # Every commit on main is published as ghcr.io/<owner>/asservat:main and
  # :<commit>, and the agent's image under the same tags with "-agent".
  # Each architecture's images are built on a runner of that architecture,
  # without emulation, and pushed under a tag of their own; the manifest job
  # then makes the tags that people use point to both.
  image:
    if: github.event_name == 'push'
    needs: [test, e2e]
    strategy:
      matrix:
        include:
          - {runner: ubuntu-latest, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          image=ghcr.io/${{ github.repository }}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          label=org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # The layers are compressed with zstd instead of gzip: measured on
          # the agent's image 106 MiB instead of 125 MiB to pull, and faster
          # to unpack. containerd, CRI-O and Docker from version 23 read it.
          # The level is BuildKit's highest; the base image's layers are
          # compressed again (force-compression) to be zstd as well.
          docker buildx create --use >/dev/null
          publish() { docker buildx build "$@" --label "$label" --provenance=false --output type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=19,force-compression=true .; }
          publish --target agent -t "$image:${{ github.sha }}-agent-${{ matrix.arch }}"
          publish -t "$image:${{ github.sha }}-${{ matrix.arch }}"
  manifest:
    if: github.event_name == 'push'
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - run: |
          image=ghcr.io/${{ github.repository }}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for kind in "" -agent; do
            docker buildx imagetools create -t "$image:main$kind" -t "$image:${{ github.sha }}$kind" \
              "$image:${{ github.sha }}$kind-amd64" "$image:${{ github.sha }}$kind-arm64"
          done
  # What was published is pulled as a node would pull it, on each
  # architecture, and its programs are started once: the tags lead to an
  # image of the machine's own architecture, and the tools in it run there.
  # Then the chart installs it in a cluster of that architecture.
  published:
    if: github.event_name == 'push'
    needs: [manifest]
    strategy:
      matrix:
        include:
          - {runner: ubuntu-latest, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - run: |
          image=ghcr.io/${{ github.repository }}:${{ github.sha }}
          for i in "$image" "$image-agent"; do
            docker pull -q "$i"
            test "$(docker image inspect --format '{{.Architecture}}' "$i")" = "${{ matrix.arch }}"
          done
          tool() { docker run --rm --entrypoint "$2" "$1" "${@:3}" >/dev/null; }
          docker run --rm "$image-agent" agent --help >/dev/null 2>&1
          tool "$image-agent" tcpdump --version
          tool "$image-agent" strace -V
          tool "$image-agent" gdb --version
          docker run --rm "$image" hub --help >/dev/null 2>&1
          tool "$image" sharkd -v
          tool "$image" dot -V
          tool "$image" gdb --version
      # And they are installed as the README says, in a cluster of this
      # architecture, where a capture is recorded with them.
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: test/e2e/published.sh ${{ github.sha }}
  # The branch ruleset requires this one check.
  ci-ok:
    if: always()
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success -a "${{ needs.e2e.result }}" = success
