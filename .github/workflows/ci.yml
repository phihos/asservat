name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      # An S3-compatible store for the evidence store test; it starts while Go builds.
      - run: docker run -d -p 127.0.0.1:8333:8333 docker.io/chrislusf/seaweedfs:latest server -s3
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # The tests that describe cores take them with gcore and skip without it.
      - run: sudo apt-get install -y --no-install-recommends gdb
      - run: go test -race ./...
        env:
          ASSERVAT_TEST_DSN: postgres://postgres:pw@127.0.0.1:5432/postgres
          ASSERVAT_TEST_S3: 127.0.0.1:8333,test,test-secret
      - run: helm lint charts/asservat
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      # The runner is a disposable machine: the test may change its core pattern.
      - run: CORE_HANDLER=1 SAMPLE_CPU=1 test/e2e/run.sh
  # Every commit on main is published as ghcr.io/<owner>/asservat:main and :<commit>.
  image:
    if: github.event_name == 'push'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          image=ghcr.io/${{ github.repository }}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$image:main" -t "$image:${{ github.sha }}" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} .
          docker push --all-tags "$image"
  # The branch ruleset requires this one check.
  ci-ok:
    if: always()
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success -a "${{ needs.e2e.result }}" = success
