name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
        env:
          ASSERVAT_TEST_DSN: postgres://postgres:pw@127.0.0.1:5432/postgres
      - run: helm lint charts/asservat
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: test/e2e/run.sh
  # The branch ruleset requires this one check.
  ci-ok:
    if: always()
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success -a "${{ needs.e2e.result }}" = success
