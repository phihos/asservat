name: Native
# Real Kubernetes/PostgreSQL/OpenBao/S3 suites, one fresh runner per suite.
# Dispatch one suite (optionally with a --run filter) or all of them.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite from scripts/ci-native.sh --list, or all"
        default: all
      run:
        description: "Optional Go test filter (custody, fleet and context only)"
        default: ""
# Dispatch only: parallel variants of one suite never cancel each other.
permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.select.outputs.suites }}
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: scripts, filter: "blob:none" }
      - id: select
        env:
          SUITE: ${{ inputs.suite || 'all' }}
        run: |
          all=$(scripts/ci-native.sh --list)
          if [[ $SUITE == all ]]; then echo "suites=$all" >> "$GITHUB_OUTPUT"; exit; fi
          python3 -c 'import json,sys; assert sys.argv[2] in json.loads(sys.argv[1]) + ["context"], "unknown suite"' "$all" "$SUITE"
          echo "suites=[\"$SUITE\"]" >> "$GITHUB_OUTPUT"

  native:
    needs: select
    runs-on: ubuntu-24.04
    # Maintainer rule (2026-10-25): no test run may take longer than 20 minutes.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.select.outputs.suites) }}
    name: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: "blob:none"
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/test/results/
      # The image's /mnt scratch disk (when present) holds Docker's data, so
      # kind nodes and pinned images do not compete with Go caches on /.
      - name: Docker data on /mnt
        run: |
          if mountpoint -q /mnt; then
            sudo systemctl stop docker docker.socket
            f=/etc/docker/daemon.json; [ -s $f ] || echo '{}' | sudo tee $f >/dev/null
            sudo jq '. + {"data-root": "/mnt/docker"}' $f | sudo tee $f.new >/dev/null && sudo mv $f.new $f
            sudo mkdir -p /mnt/docker && sudo systemctl start docker
          fi
          df -h / /mnt
      # Pull every digest-pinned fixture image in the background; the harness
      # pull of the same reference joins the in-flight one.
      - name: Pull pinned images
        run: |
          grep -ohE '[a-z0-9./-]+@sha256:[0-9a-f]{64}' scripts/test-*.py | sort -u > /tmp/images
          nohup sh -c 'while read -r i; do docker pull -q "$i" & done < /tmp/images; wait' > /tmp/pulls.log 2>&1 &
      - uses: ./.github/actions/setup
        with:
          console: "${{ !startsWith(matrix.suite, 'collector-') }}"
          sql-tools: "${{ !startsWith(matrix.suite, 'collector-') }}"
          kind: "true"
          helm: "${{ startsWith(matrix.suite, 'helm') || startsWith(matrix.suite, 'collector-') }}"
      # ADR-246: collector suites load BPF programs into the runner's kernel.
      # This fresh, disposable VM is the only place that creates the guard
      # file without which the harness and the collector refuse to start.
      - if: startsWith(matrix.suite, 'collector-')
        name: Disposable-host guard
        run: sudo touch /etc/asservat-disposable-host
      - name: Run ${{ matrix.suite }}
        env:
          SUITE: ${{ matrix.suite }}
          RUN: ${{ inputs.run }}
        run: |
          mkdir -p test/results
          set -o pipefail
          scripts/ci-native.sh "$SUITE" "$RUN" 2>&1 | tee test/results/ci-native-$SUITE.log
      - if: always()
        run: |
          cat /tmp/pulls.log || true
          kind get clusters || true
          docker ps -a --format '{{.Names}} {{.Status}}' || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.suite }}-${{ github.run_attempt }}
          path: test/results/
          retention-days: 14
          if-no-files-found: ignore
