name: Toolchain
description: Go, Python, optional console modules and pinned SQL/kind/Helm tools, all cached.
inputs:
  go:
    description: Install Go and restore the shared module/build cache.
    default: "true"
  console:
    description: Restore or install web/node_modules.
    default: "false"
  sql-tools:
    description: Install the pinned sqlc/goose into ~/.cache/asservat-build/bin.
    default: "false"
  kind:
    description: Install the pinned kind binary.
    default: "false"
  helm:
    description: Install the pinned Helm binary.
    default: "false"
  go-cache:
    description: "full: the module/build cache of every unit-test build; native-installed, native-race or native-collector: the smaller one of that kind of native suite (scripts/native-go-cache.sh)."
    default: full
runs:
  using: composite
  steps:
    # setup-go downloads the toolchain into the runner's tool cache on every
    # job unless it is already there; keep that directory in the Actions cache.
    - if: inputs.go == 'true'
      id: go-version
      shell: bash
      run: echo "version=$(sed -n 's/^go //p; s/^toolchain go//p' go.mod | tail -1)" >> "$GITHUB_OUTPUT"
    - if: inputs.go == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/go/${{ steps.go-version.outputs.version }}
        key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-version.outputs.version }}
    - if: inputs.go == 'true'
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: false
    # One shared module/build cache. Only the main-branch build job saves it;
    # Go's content-addressed cache stays useful when restored from an older key.
    - if: inputs.go == 'true' && !startsWith(inputs.go-cache, 'native-')
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
          go-${{ runner.os }}-
    # Saved by ci.yml's native-go-cache job; the full cache is only the
    # fallback before one exists for this go.sum.
    - if: inputs.go == 'true' && startsWith(inputs.go-cache, 'native-')
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ inputs.go-cache }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-${{ inputs.go-cache }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-
          go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
          go-${{ inputs.go-cache }}-${{ runner.os }}-
    - shell: bash
      run: mkdir -p ~/.cache/asservat-build/tmp
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: requirements-spec.txt
    - shell: bash
      run: pip install --disable-pip-version-check -q -r requirements-spec.txt

    # As for Go: a cached Node 26 in the tool cache satisfies setup-node
    # without its download (15-70 s measured on 2026-11-08).
    - if: inputs.console == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/node/26.*
        key: node-toolchain-${{ runner.os }}-${{ runner.arch }}-26-${{ hashFiles('web/package-lock.json') }}
    - if: inputs.console == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: "26"
    - if: inputs.console == 'true'
      id: modules
      uses: actions/cache@v6
      with:
        path: web/node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
    - if: inputs.console == 'true' && steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: make console-install

    # Keyed on the pinned install lines, not on every Makefile edit.
    - if: inputs.sql-tools == 'true'
      id: sqlpins
      shell: bash
      run: echo "pins=$(grep 'go install ' Makefile | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - if: inputs.sql-tools == 'true'
      id: sqltools
      uses: actions/cache@v6
      with:
        path: ~/.cache/asservat-build/bin
        key: sql-tools-${{ runner.os }}-${{ steps.sqlpins.outputs.pins }}
    - if: inputs.sql-tools == 'true' && steps.sqltools.outputs.cache-hit != 'true'
      shell: bash
      run: make sql-tools

    # Pinned downloads, cached so a release-host outage does not fail the job;
    # the checksum is verified on every use. The cache is saved right after
    # the downloads (below), not at job end: a post-job save happens only for
    # a passing job, so failing native jobs on main never left a main-scoped
    # entry and every run hit the release host (504s, native run 42471672035).
    - if: inputs.kind == 'true' || inputs.helm == 'true'
      id: downloads
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/asservat-build/downloads
        key: downloads-${{ runner.os }}-kind-v0.33.0-helm-v4.3.0-${{ inputs.kind }}-${{ inputs.helm }}
    - if: inputs.kind == 'true'
      shell: bash
      run: |
        f=~/.cache/asservat-build/downloads/kind-v0.33.0-linux-amd64
        sum="aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $f"
        mkdir -p "${f%/*}"
        if ! { [[ -s $f ]] && sha256sum -c - <<< "$sum"; }; then
          # kind.sigs.k8s.io/dl redirects to the GitHub release; try it directly
          # when the redirector is down.
          curl -fsSL --retry 5 --retry-all-errors -o "$f" https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 ||
            curl -fsSL --retry 5 --retry-all-errors -o "$f" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          sha256sum -c - <<< "$sum"
        fi
        sudo install -m 0755 "$f" /usr/local/bin/kind
    - if: inputs.helm == 'true'
      shell: bash
      run: |
        f=~/.cache/asservat-build/downloads/helm-v4.3.0-linux-amd64.tar.gz
        sum="86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  $f"
        mkdir -p "${f%/*}"
        if ! { [[ -s $f ]] && sha256sum -c - <<< "$sum"; }; then
          curl -fsSL --retry 5 --retry-all-errors -o "$f" https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          sha256sum -c - <<< "$sum"
        fi
        sudo tar -xzf "$f" -C /usr/local/bin --strip-components=1 linux-amd64/helm
    - if: (inputs.kind == 'true' || inputs.helm == 'true') && steps.downloads.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/asservat-build/downloads
        key: downloads-${{ runner.os }}-kind-v0.33.0-helm-v4.3.0-${{ inputs.kind }}-${{ inputs.helm }}
