listen_addresses = '*'
port = 5432
ssl = on
ssl_min_protocol_version = 'TLSv1.3'
ssl_cert_file = '/run/asservat/postgres/server.crt'
ssl_key_file = '/run/asservat/postgres/server.key'
ssl_ca_file = '/run/asservat/postgres/ca.crt'
password_encryption = 'scram-sha-256'
hba_file = '/etc/asservat/pg_hba.conf'
unix_socket_directories = '/run/asservat/postgres'
superuser_reserved_connections = 3
reserved_connections = 0
shared_preload_libraries = 'pg_stat_statements'
archive_mode = on
archive_command = 'pgbackrest --config=/run/asservat/postgres/pgbackrest.conf --stanza=asservat archive-push %p'
archive_timeout = '60s'
wal_level = replica
log_statement = 'none'
log_min_error_statement = 'panic'
logging_collector = off
log_destination = 'stderr'
timezone = 'UTC'
