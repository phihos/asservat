{{- include "asservat.bootstrap.validate" . -}}
{{- if .Values.bootstrap.enabled }}
{{- $b := .Values.bootstrap }}
{{- if $b.continuation.enabled }}
{{- $legacy := lookup "v1" "Pod" .Release.Namespace (printf "%s-continuation" $b.name) }}
{{- if $legacy }}
{{- $phase := dig "status" "phase" "" $legacy }}
{{- if or (dig "metadata" "deletionTimestamp" "" $legacy) (eq (dig "status" "reason" "" $legacy) "NodeLost") (not (has $phase (list "Succeeded" "Failed"))) }}
{{- fail "the legacy continuation Pod is not positively terminal; finish or resolve it before starting the single installer runner" }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-bootstrap" $b.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: asservat
    asservat.io/private-role: bootstrap-runner
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: hook-succeeded
    asservat.io/bootstrap-runner: {{ if $b.continuation.enabled }}five-command/v1{{ else }}four-command/v1{{ end }}
    asservat.io/bootstrap-input: {{ include "asservat.bootstrap.inputDigest" . | quote }}
spec:
  serviceAccountName: {{ printf "%s-bootstrap-runner" $b.name }}
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  activeDeadlineSeconds: 1800
  terminationGracePeriodSeconds: 15
  {{- if $b.registrySecret }}
  imagePullSecrets:
    - name: {{ $b.registrySecret | quote }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: produce
      image: {{ $b.image | quote }}
      imagePullPolicy: IfNotPresent
      command: [/asservat, initial-bootstrap]
      securityContext: {{ include "asservat.bootstrap.security" . | nindent 8 }}
      resources: {{ include "asservat.bootstrap.resources" . | nindent 8 }}
      volumeMounts:
        - name: scratch
          mountPath: /run/asservat/initial-bootstrap-work
        - name: producer-input
          mountPath: /run/asservat/initial-bootstrap
          readOnly: true
    - name: schema
      image: {{ $b.image | quote }}
      imagePullPolicy: IfNotPresent
      command: [/asservat, initial-bootstrap-schema]
      securityContext: {{ include "asservat.bootstrap.security" . | nindent 8 }}
      resources: {{ include "asservat.bootstrap.resources" . | nindent 8 }}
      volumeMounts:
        - name: scratch
          mountPath: /run/asservat/initial-schema
          subPath: projection/schema
          readOnly: true
        - name: ddl-input
          mountPath: /run/asservat/initial-schema-private
          readOnly: true
    - name: prepare
      image: {{ $b.image | quote }}
      imagePullPolicy: IfNotPresent
      command: [/asservat, initial-bootstrap-prepare]
      securityContext: {{ include "asservat.bootstrap.security" . | nindent 8 }}
      resources: {{ include "asservat.bootstrap.resources" . | nindent 8 }}
      volumeMounts:
        - name: scratch
          mountPath: /run/asservat/initial-preparer
          subPath: projection/preparer
          readOnly: true
  {{- if not $b.continuation.enabled }}
  containers:
  {{- end }}
    - name: retire
      image: {{ $b.image | quote }}
      imagePullPolicy: IfNotPresent
      command: [/asservat, initial-bootstrap-retire]
      securityContext: {{ include "asservat.bootstrap.security" . | nindent 8 }}
      resources: {{ include "asservat.bootstrap.resources" . | nindent 8 }}
      volumeMounts:
        - name: scratch
          mountPath: /run/asservat/initial-bootstrap-work
        - name: retirement-input
          mountPath: /run/asservat/initial-bootstrap
          readOnly: true
  {{- if $b.continuation.enabled }}
  containers:
    - name: continue
      image: {{ $b.image | quote }}
      imagePullPolicy: IfNotPresent
      command: [/asservat, installer-continue]
      securityContext: {{ include "asservat.bootstrap.security" . | nindent 8 }}
      resources: {{ include "asservat.bootstrap.resources" . | nindent 8 }}
      volumeMounts:
        - name: scratch
          mountPath: /run/asservat/initial-preparer
          subPath: projection/preparer
          readOnly: true
        - name: continuation-input
          mountPath: /run/asservat/installer-continue
          readOnly: true
  {{- end }}
  volumes:
    - name: scratch
      emptyDir:
        medium: Memory
        sizeLimit: 8Mi
    - name: producer-input
      projected:
        defaultMode: 0440
        sources: {{ include "asservat.bootstrap.commonProjection" . | nindent 10 }}
          - secret:
              name: {{ $b.secrets.producer | quote }}
              optional: true
              items:
                - key: postgres-administrator.json
                  path: postgres-administrator.json
                - key: provider-material.json
                  path: provider-material.json
          {{- if $b.registrySecret }}
          - secret:
              name: {{ $b.registrySecret | quote }}
              optional: true
              items:
                - key: .dockerconfigjson
                  path: .dockerconfigjson
          {{- end }}
    - name: retirement-input
      projected:
        defaultMode: 0440
        sources: {{ include "asservat.bootstrap.commonProjection" . | nindent 10 }}
          - secret:
              name: {{ $b.secrets.retirement | quote }}
              optional: true
              items:
                - key: postgres-administrator.json
                  path: postgres-administrator.json
    - name: ddl-input
      secret:
        secretName: {{ $b.secrets.schema | quote }}
        defaultMode: 0440
        optional: true
        items:
          - key: postgres-ddl.json
            path: postgres-ddl.json
  {{- if $b.continuation.enabled }}
    - name: continuation-input
      projected:
        defaultMode: 0440
        sources:
          - configMap:
              name: {{ printf "%s-continuation.%s" $b.name (substr 0 32 (include "asservat.bootstrap.continuation" . | sha256sum)) }}
              optional: false
              items:
                - key: continuation.json
                  path: continuation.json
          - serviceAccountToken:
              path: administrator-token
              expirationSeconds: 600
              {{- if $b.probeAudience }}
              audience: {{ $b.probeAudience | quote }}
              {{- end }}
          - secret:
              name: {{ $b.secrets.producer | quote }}
              optional: false
              items:
                - key: postgres-administrator.json
                  path: postgres-administrator.json
  {{- end }}
{{- end }}
