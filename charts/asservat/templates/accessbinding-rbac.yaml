{{- /* ADR-329: AccessBindings live in the application namespace they grant
  and are governed by ordinary Kubernetes RBAC, like RoleBindings. Namespace
  `admin`s may write them (aggregated ClusterRole); `view` may read them.
  Like the RoleBinding `bind` check, writing a binding needs the `bind` verb
  on the virtual resource `accessroles.asservat.io` named after each role it
  grants, and `bind` on `automation` for spec.automation (ADR-059: never an
  ordinary namespace grant). Cluster administrators hold both; the automation
  ClusterRole below is bound per namespace by an administrator. Every mode
  renders them: a mode=cluster connector delivers its cluster's bindings to
  the hub. ClusterAccessBindings (ADR-335 D14) are cluster-scoped like
  ClusterRoleBindings: readable by `view`, written by cluster administrators,
  with the same `bind` check. */}}
{{- $base := printf "%s-%s" .Release.Namespace (include "asservat.fullname" (list . "accessbindings")) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-view" $base }}
  labels:
    {{- include "asservat.labels" (list . "accessbindings") | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: [asservat.io]
    resources: [accessbindings, clusteraccessbindings]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-admin" $base }}
  labels:
    {{- include "asservat.labels" (list . "accessbindings") | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: [asservat.io]
    resources: [accessbindings]
    verbs: [create, update, patch, delete, deletecollection]
  - apiGroups: [asservat.io]
    resources: [accessroles]
    resourceNames: [evidence-reader, workload-maintainer, evidence-owner, action-approver]
    verbs: [bind]
---
# Not aggregated: an administrator binds it in a namespace whose team may
# write automation-bearing AccessBindings (team policy delegation, ADR-059).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-automation" $base }}
  labels: {{- include "asservat.labels" (list . "accessbindings") | nindent 4 }}
rules:
  - apiGroups: [asservat.io]
    resources: [accessroles]
    resourceNames: [automation]
    verbs: [bind]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $base }}
  labels: {{- include "asservat.labels" (list . "accessbindings") | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [asservat.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [accessbindings, clusteraccessbindings]
  variables:
    # ClusterAccessBinding admission requests omit namespace. An empty RBAC
    # namespace asks for a cluster-wide bind, as for a ClusterRoleBinding.
    - name: bindingNamespace
      expression: "has(request.namespace) ? request.namespace : ''"
    - name: unchangedSpec
      expression: "request.operation == 'UPDATE' && object.spec == oldObject.spec"
  validations:
    # Match the permission_assignment byte bounds and verified identity text.
    - expression: >-
        variables.unchangedSpec || object.spec.subjects.all(s,
          size(bytes(s.id)) <= 256 && !s.id.matches(r'\p{Cc}') &&
          (!has(s.issuer) || (size(bytes(s.issuer)) <= 2048 && !s.issuer.matches(r'\p{Cc}'))))
      message: "Subject IDs must fit 256 UTF-8 bytes and issuers 2048 bytes. Both must be free of control characters."
      reason: Invalid
    # Like RoleBinding admission, recheck bind at this scope when a writer
    # changes the grant. Metadata-only updates can finish without it.
    - expression: "variables.unchangedSpec || !has(object.spec.roles) || object.spec.roles.all(r, authorizer.group('asservat.io').resource('accessroles').namespace(variables.bindingNamespace).name(r).check('bind').allowed())"
      messageExpression: "'granting ' + (has(object.spec.roles) ? object.spec.roles.join(', ') : '') + ' needs the bind verb on accessroles.asservat.io with each role name at the binding scope'"
      reason: Forbidden
    - expression: "variables.unchangedSpec || !has(object.spec.automation) || authorizer.group('asservat.io').resource('accessroles').namespace(variables.bindingNamespace).name('automation').check('bind').allowed()"
      messageExpression: "'spec.automation needs the bind verb on accessroles.asservat.io named automation at the binding scope'"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $base }}
  labels: {{- include "asservat.labels" (list . "accessbindings") | nindent 4 }}
spec:
  policyName: {{ $base }}
  validationActions: [Deny]
