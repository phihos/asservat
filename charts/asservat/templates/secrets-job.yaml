{{- include "asservat.validate" . }}
{{- if include "asservat.hub" . }}
{{- $s := .Values.services }}
{{- $pg := eq $s.postgres.provider "bundled" }}
{{- $kc := eq $s.identity.provider "keycloak" }}
{{- $s3 := eq $s.objectStore.provider "seaweedfs" }}
{{- $bao := eq $s.keyService.provider "openbao" }}
{{- $n := include "asservat.name" . }}
{{- $job := printf "%s-secrets" $n }}
{{- $plan := dict "format" "asservat-secrets/v1" "namespace" .Release.Namespace "name" $n "mode" .Values.mode "postgres" $pg }}
{{- $names := list }}
{{- $ids := include "asservat.secretName" (list . "ids") }}
{{- $_ := set $plan "ids" (dict "secret" $ids "generate" (eq (include "asservat.secretGenerated" (list . "ids")) "true")) }}
{{- $names = append $names $ids }}
{{- range $field, $key := dict "auditMAC" "audit-mac" "artifactKey" "artifact-key" }}
{{- if include "asservat.secretGenerated" (list $ $key) }}
{{- $_ := set $plan $field (printf "%s-%s" $n $key) }}
{{- $names = append $names (printf "%s-%s" $n $key) }}
{{- end }}
{{- end }}
{{- $sql := list }}
{{- range $component := list "hub-api" "hub-worker" "federation" "publisher" "key-service" }}
{{- if include "asservat.secretGenerated" (list $ (printf "sql-%s" $component)) }}
{{- $sql = append $sql (dict "component" $component "secret" (printf "%s-sql-%s" $n $component)) }}
{{- $names = append $names (printf "%s-sql-%s" $n $component) }}
{{- end }}
{{- end }}
{{- $_ := set $plan "sql" $sql }}
{{- if $kc }}
{{- $k := $s.identity.keycloak }}
{{- if not .Values.origin }}{{ fail "bundled Keycloak requires origin" }}{{ end }}
{{- $client := default "asservat-console" .Values.identity.clientID }}
{{- $audience := default $client .Values.identity.browserAudience }}
{{- $db := dict "host" (default (printf "%s-postgres.%s.svc" $n .Release.Namespace) $k.database.host) "port" $k.database.port "database" $k.database.name "username" $k.database.user }}
{{- $_ := set $plan "keycloak" (dict "namespace" .Release.Namespace "secretName" (printf "%s-keycloak-state" $n) "hostname" $k.hostname "realm" $k.realm "origin" .Values.origin "consoleClientID" $client "browserAudience" $audience "mcpClientID" "asservat-mcp" "mcpRedirectURIs" $k.mcpRedirectURIs "database" $db) }}
{{- if $k.processingOperators }}{{ $_ := set (get $plan "keycloak") "processingOperators" true }}{{ end }}
{{- if or (not $pg) $k.database.host }}{{ $_ := set $plan "keycloakExternalDatabase" true }}{{ end }}
{{- $names = append $names (printf "%s-keycloak-state" $n) }}
{{- end }}
{{- if $pg }}{{ $names = append $names (printf "%s-postgres-state" $n) }}{{ end }}
{{- if $s3 }}
{{- $_ := set $plan "objectStore" (dict "format" "asservat-small-seaweed/v1" "namespace" .Release.Namespace "name" $n "image" $s.objectStore.seaweedfs.image) }}
{{- $names = concat $names (list (printf "%s-objectstore-state" $n) (printf "%s-objectstore-iam" $n)) }}
{{- $principals := list "configuration-audit" "owner-audit" "federation-audit" "publisher-audit" "publisher-read" "download-read" "evidence-delete" "operation-cleanup" "operation-verify" }}
{{- if eq .Values.mode "combined" }}{{ $principals = concat $principals (list "regional-write" "regional-history") }}{{ end }}
{{- range $principals }}{{ $names = append $names (printf "%s-s3-%s" $n .) }}{{ end }}
{{- end }}
{{- if $bao }}
{{- $_ := set $plan "openBao" (dict "image" $s.keyService.openbao.image) }}
{{- $names = append $names (printf "%s-openbao-state" $n) }}
{{- end }}
{{- $tls := include "asservat.svc.servingTLS" . | fromJsonArray }}
{{- if $tls }}{{ $_ := set $plan "servingTLS" $tls }}{{ end }}
{{- range $tls }}{{ $names = append $names .secret }}{{ end }}
{{- $hook := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $job }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "asservat.labels" (list . "secrets") | nindent 4 }}
  annotations: {{ merge (dict "helm.sh/hook-weight" "-10") $hook | toYaml | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $job }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "asservat.labels" (list . "secrets") | nindent 4 }}
  annotations: {{ merge (dict "helm.sh/hook-weight" "-10") $hook | toYaml | nindent 4 }}
rules:
  # Kubernetes RBAC cannot restrict create by name.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: {{ $names | uniq | toJson }}
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $job }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "asservat.labels" (list . "secrets") | nindent 4 }}
  annotations: {{ merge (dict "helm.sh/hook-weight" "-10") $hook | toYaml | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $job }}}
subjects: [{kind: ServiceAccount, namespace: {{ .Release.Namespace }}, name: {{ $job }}}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $job }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "asservat.labels" (list . "secrets") | nindent 4 }}
  annotations: {{ merge (dict "helm.sh/hook-weight" "-10") $hook | toYaml | nindent 4 }}
data:
  secrets.json: {{ toJson $plan | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $job }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "asservat.labels" (list . "secrets") | nindent 4 }}
  annotations: {{ merge (dict "helm.sh/hook-weight" "0") $hook | toYaml | nindent 4 }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {{ include "asservat.labels" (list . "secrets") | nindent 8 }}
    spec:
      serviceAccountName: {{ $job }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      restartPolicy: Never
      {{- include "asservat.imagePullSecrets" . | nindent 6 }}
      securityContext: {{ include "asservat.podSecurityContext" . | nindent 8 }}
      containers:
        - name: secrets
          image: {{ include "asservat.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/asservat, secrets]
          securityContext: {{ include "asservat.securityContext" . | nindent 12 }}
          resources: {{ include "asservat.jobResources" . | nindent 12 }}
          volumeMounts:
            - {name: plan, mountPath: /run/asservat/secrets, readOnly: true}
      volumes:
        - name: plan
          configMap:
            name: {{ $job }}
            defaultMode: 0440
{{- end }}
