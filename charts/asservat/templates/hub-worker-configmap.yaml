{{- if include "asservat.hubWorker.enabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-config" (include "asservat.hubWorker.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asservat.hubWorker.labels" . | nindent 4 }}
data:
  config.json: {{ include "asservat.hubWorker.config" . | quote }}
  {{- range $name, $pem := fromJson (include "asservat.hubWorker.externalRoots" .) }}
  {{ printf "roots-%s.crt" $name }}: {{ $pem | quote }}
  {{- end }}
{{- end }}
