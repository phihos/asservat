{{- if .Values.hub.hubApi.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-hub-api-config" .Values.installation.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asservat.hubApi.labels" . | nindent 4 }}
data:
  config.json: {{ include "asservat.hubApi.config" . | quote }}
{{- end }}
