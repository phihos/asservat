{{- if and .Values.hub.enabled .Values.hub.alertmanagerConfig.enabled }}
{{- if not .Values.hub.alertToken }}
{{- fail "hub.alertmanagerConfig needs hub.alertToken" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: {{ .Release.Name }}-hub
  labels:
    {{- include "asservat.labels" . | nindent 4 }}
    {{- with .Values.hub.alertmanagerConfig.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # The operator lets the alerts go on to the other routes.
  route:
    receiver: hub
    # A watch records the moment an alert fires: every alert is sent on its
    # own and at once, not after the wait that gathers a group or, as a
    # later alert of a group, after the group's interval.
    groupBy: ["..."]
    groupWait: 0s
  receivers:
    - name: hub
      webhookConfigs:
        - url: http://{{ .Release.Name }}-hub.{{ .Release.Namespace }}.svc:{{ .Values.hub.service.port }}/api/alerts
          sendResolved: false
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: {{ .Release.Name }}-hub
                key: alert-token
{{- end }}
