{{- if include "asservat.hubWorker.enabled" . }}
{{- $name := include "asservat.hubWorker.fullname" . }}
{{- $cluster := printf "%s-%s" .Release.Namespace $name }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asservat.hubWorker.labels" . | nindent 4 }}
rules:
  # Fleet, owner, processing, browser/identity settings, cluster catalog and
  # worker configuration source observers (read by name; UIDs key SQL rows).
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
  # Leader election creates its Lease; create cannot be restricted by name.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  # Leader election renews only its own Lease.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [{{ printf "%s-hub-worker-leader" (include "asservat.hubWorker.prefix" .) | quote }}]
    verbs: [get, update]
  # Capacity source reader (ADR-189): storage pools and budget policies.
  - apiGroups: [asservat.io]
    resources: [evidencestoragepools, evidencebudgetpolicies]
    verbs: [get, list]
  # Permission stream reader: AccessBindings and PermissionSources.
  - apiGroups: [asservat.io]
    resources: [accessbindings, permissionsources]
    verbs: [get, list, watch]
  # Hub retention source reader (ADR-195).
  - apiGroups: [asservat.io]
    resources: [evidenceretentionpolicies]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asservat.hubWorker.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $cluster }}
  labels:
    {{- include "asservat.hubWorker.labels" . | nindent 4 }}
rules:
  # Namespace UID by name (SQL keys) and namespace inheritance (ADR-242),
  # which lists and watches the hub cluster's namespaces.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $cluster }}
  labels:
    {{- include "asservat.hubWorker.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $cluster }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
