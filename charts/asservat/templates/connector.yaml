{{- if .Values.region.enabled }}
{{- $r := .Values.region }}
{{- $n := include "asservat.name" . }}
{{- $ns := .Release.Namespace }}
{{- $mode := .Values.mode }}
{{- if not (has $mode (list "cluster" "combined")) }}{{ fail "region.enabled requires mode=cluster or mode=combined" }}{{ end }}
{{- $image := include "asservat.image" . }}
{{- /* mode=cluster: the copied join Secret supplies the cluster and peer
  IDs, the offer and (by default) the executor's object-store capabilities
  as files. mode=combined: the connector reads clusterID and peerID from the
  `<name>-ids` Secret, the hub's own cluster and local connector peer. The
  connector authenticates to the hub with its ServiceAccount token
  (ADR-334); no credential is copied. */}}
{{- $join := $r.joinSecret }}
{{- if eq $mode "cluster" }}
{{- if not $join }}{{ fail "region.joinSecret names the hub's join Secret <name>-join-<cluster>, copied into this namespace" }}{{ end }}
{{- else }}
{{- if $join }}{{ fail "region.joinSecret is for mode=cluster" }}{{ end }}
{{- end }}
{{- $account := printf "%s-connector" $n }}
{{- $nodes := printf "%s-connector-nodes" $n }}
{{- $collector := .Values.collector.enabled }}
{{- $x := $r.executor }}
{{- $executor := $x.enabled }}
{{- $cfg := dict "format" "asservat-connector-config/v1" "mode" $mode "namespace" $ns "deployment" $account "serviceAccount" $account "imageDigest" (trimPrefix "sha256:" .Values.image.digest) }}
{{- $evidence := $x.evidenceSecret | default $join }}
{{- if ne $mode "cluster" }}
{{- $_ := set $cfg "offerConfigMap" ($r.offerConfigMap | default (printf "%s-regional-offer" $n)) }}
{{- $_ := set $cfg "hub" (dict "federation" ($r.hub.federation | default (printf "https://%s-federation.%s.svc:9446" $n $ns)) "owners" ($r.hub.owners | default (printf "%s-hub-api-native.%s.svc:9444" $n $ns)) "keyService" ($r.hub.keyService | default (printf "https://%s-key-service.%s.svc:9447" $n $ns))) }}
{{- end }}
{{- if $executor }}
{{- $xc := dict "concurrency" (int $x.concurrency) }}
{{- with $x.alertmanager }}{{ $_ := set $xc "alertmanager" . }}{{ end }}
{{- with $x.identityMappings }}{{ $_ := set $xc "identityMappings" . }}{{ end }}
{{- with $x.profileEndpoints }}{{ $_ := set $xc "profileEndpoints" . }}{{ end }}
{{- if $x.profileAuthorization }}{{ if eq $mode "combined" }}{{ fail "region.executor.profileAuthorization needs region.executor.evidenceSecret (mode=cluster)" }}{{ end }}{{ $_ := set $xc "profileAuthorization" true }}{{ end }}
{{- $_ := set $cfg "executor" $xc }}
{{- end }}
{{- if $collector }}
{{- $_ := set $cfg "collector" (dict "namespace" .Values.collector.namespace "serviceAccount" (printf "%s-node" $n) "listenerSecret" $nodes "rootConfigMap" (printf "%s-node-connector-ca" $n) "serverName" (printf "%s.%s.svc" $nodes $ns)) }}
{{- end }}
{{- $json := toJson $cfg }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $account }}
  namespace: {{ $ns }}
  labels: {{- include "asservat.labels" (list $ "connector") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-connector-config" $n }}
  namespace: {{ $ns }}
  labels: {{- include "asservat.labels" (list $ "connector") | nindent 4 }}
data:
  config.json: {{ $json | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $account }}
  namespace: {{ $ns }}
  labels: {{- include "asservat.labels" (list $ "connector") | nindent 4 }}
rules:
  {{- if $collector }}
  # The node listener pair: read and CAS update only.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $nodes }}]
    verbs: [get, update]
  {{- end }}
  # Startup reads its account, Deployment and the Pod → ReplicaSet chain by name.
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [{{ $account }}]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [{{ $account }}]
    verbs: [get]
  {{- if eq $mode "combined" }}
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ get $cfg "offerConfigMap" }}]
    verbs: [get]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $account }}
  namespace: {{ $ns }}
  labels: {{- include "asservat.labels" (list $ "connector") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $account }}
subjects:
  - kind: ServiceAccount
    namespace: {{ $ns }}
    name: {{ $account }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s" $ns $account }}
  labels: {{- include "asservat.labels" (list $ "connector") | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews, selfsubjectreviews]
    verbs: [create]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get{{ if $executor }}, list, watch{{ end }}]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get{{ if $executor }}, list{{ end }}{{ if and $executor (eq $mode "cluster") }}, watch{{ end }}]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get]
  {{- if eq $mode "cluster" }}
  # ADR-329: the connector delivers this cluster's AccessBindings to the hub
  # (with namespaces get above for their namespace UIDs).
  - apiGroups: [asservat.io]
    resources: [accessbindings]
    verbs: [get, list, watch]
  {{- end }}
  {{- if $executor }}
  # ADR-179/230/241/283: target resolution, probe Events, logs, metrics,
  # capture profiles and Kubernetes packet peers in this cluster; in
  # mode=cluster also the capacity delivery's workload watches (ADR-331).
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get{{ if eq $mode "cluster" }}, list, watch{{ end }}]
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [list]
  - apiGroups: [asservat.io]
    resources: [captureprofiles]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [services]
    verbs: [get]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
  {{- if $x.identityMappings }}
  # ADR-245: decision-time SubjectAccessReviews.
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  {{- end }}
  {{- end }}
  {{- if $collector }}
  # ADR-246: node attestation reads the collector's Node.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s" $ns $account }}
  labels: {{- include "asservat.labels" (list $ "connector") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s" $ns $account }}
subjects:
  - kind: ServiceAccount
    namespace: {{ $ns }}
    name: {{ $account }}
{{- if $collector }}
---
# ADR-246: the node listener pair, generated once by the connector.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $nodes }}
  namespace: {{ $ns }}
  labels: {{- include "asservat.labels" (list $ "connector") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $nodes }}
  namespace: {{ $ns }}
  labels: {{- include "asservat.labels" (list $ "connector") | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "asservat.selectorLabels" (list $ "connector") | nindent 4 }}
  ports:
    - name: nodes
      port: 8444
      targetPort: nodes
      protocol: TCP
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $account }}
  namespace: {{ $ns }}
  labels: {{- include "asservat.labels" (list $ "connector") | nindent 4 }}
spec:
  replicas: 1
  # One connector process at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "asservat.selectorLabels" (list $ "connector") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "asservat.selectorLabels" (list $ "connector") | nindent 8 }}
      annotations:
        checksum/config: {{ sha256sum $json }}
    spec:
      serviceAccountName: {{ $account }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      {{- include "asservat.imagePullSecrets" . | nindent 6 }}
      {{- with $r.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $r.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "asservat.podSecurityContext" . | nindent 8 }}
      containers:
        - name: connector
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          command: [/asservat, connector]
          env:
            - name: ASSERVAT_REGIONAL_POD_UID
              valueFrom: { fieldRef: { apiVersion: v1, fieldPath: metadata.uid } }
          {{- if $collector }}
          ports:
            - { name: nodes, containerPort: 8444, protocol: TCP }
          {{- end }}
          securityContext: {{- include "asservat.securityContext" . | nindent 12 }}
          resources: {{- toYaml $r.resources | nindent 12 }}
          volumeMounts:
            - name: inputs
              mountPath: /run/asservat/connector
              readOnly: true
            {{- if eq $mode "combined" }}
            {{- include "asservat.idsMount" . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if eq $mode "combined" }}
        {{- include "asservat.idsVolume" . | nindent 8 }}
        {{- end }}
        - name: inputs
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: {{ printf "%s-connector-config" $n }}
                  items: [{ key: config.json, path: config.json }]
              - configMap:
                  name: kube-root-ca.crt
                  items: [{ key: ca.crt, path: kube-ca.crt }]
              - serviceAccountToken:
                  path: kube.token
                  expirationSeconds: 3600
              # ADR-334: the connector's credential toward the hub.
              - serviceAccountToken:
                  path: hub.token
                  audience: {{ include "asservat.connectorAudience" . | quote }}
                  expirationSeconds: 3600
              {{- if eq $mode "cluster" }}
              # The copied join Secret: the Pod waits until it exists.
              - secret:
                  name: {{ $join }}
                  items:
                    - { key: clusterID, path: clusterID }
                    - { key: peerID, path: peerID }
                    - { key: regional-offer.json, path: regional-offer.json }
              {{- end }}
              {{- if $executor }}
              {{- if eq $mode "cluster" }}
              - secret:
                  name: {{ $evidence }}
                  items:
                    - { key: evidence-storage.json, path: evidence-storage.json }
                    - { key: history-storage.json, path: history-storage.json }
                    {{- if $x.profileAuthorization }}
                    - { key: profile-authorization.json, path: profile-authorization.json }
                    {{- end }}
              {{- else }}
              - secret:
                  name: {{ include "asservat.secretName" (list $ "s3-regional-write") }}
                  items: [{ key: credentials.json, path: evidence-storage.json }]
              - secret:
                  name: {{ include "asservat.secretName" (list $ "s3-regional-history") }}
                  items: [{ key: credentials.json, path: history-storage.json }]
              {{- end }}
              {{- end }}
{{- end }}
