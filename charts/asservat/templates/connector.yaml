{{- if .Values.region.enabled }}
{{- $r := .Values.region }}
{{- $n := include "asservat.name" . }}
{{- $ns := .Release.Namespace }}
{{- $mode := .Values.mode }}
{{- if not (has $mode (list "cluster" "combined")) }}{{ fail "region.enabled requires mode=cluster or mode=combined" }}{{ end }}
{{- $image := include "asservat.image" . }}
{{- /* The connector dials the hub URL (mode=cluster: hub.url; mode=combined:
  the in-cluster federation) with its ServiceAccount token (ADR-334) and
  receives its IDs, the hub's offer and its object-store capabilities on
  connect. Nothing is copied between clusters. */}}
{{- $hub := include "asservat.connectorAudience" . }}
{{- $account := printf "%s-connector" $n }}
{{- $nodes := printf "%s-connector-nodes" $n }}
{{- $collector := .Values.collector.enabled }}
{{- $x := $r.executor }}
{{- $executor := $x.enabled }}
{{- $cfg := dict "format" "asservat-connector-config/v1" "mode" $mode "hub" $hub "namespace" $ns "deployment" $account "serviceAccount" $account "imageDigest" (trimPrefix "sha256:" .Values.image.digest) }}
{{- if $executor }}
{{- $xc := dict "concurrency" (int $x.concurrency) }}
{{- with $x.alertmanager }}{{ $_ := set $xc "alertmanager" . }}{{ end }}
{{- with $x.identityMappings }}{{ $_ := set $xc "identityMappings" . }}{{ end }}
{{- with $x.profileEndpoints }}{{ $_ := set $xc "profileEndpoints" . }}{{ end }}
{{- if $x.profileAuthorization }}{{ $_ := set $xc "profileAuthorization" true }}{{ end }}
{{- $_ := set $cfg "executor" $xc }}
{{- end }}
{{- if $collector }}
{{- $_ := set $cfg "collector" (dict "namespace" .Values.collector.namespace "serviceAccount" (printf "%s-node" $n) "listenerSecret" $nodes "rootConfigMap" (printf "%s-node-connector-ca" $n) "serverName" (printf "%s.%s.svc" $nodes $ns)) }}
{{- end }}
{{- $json := toJson $cfg }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $account }}
  namespace: {{ $ns }}
  labels: {{- include "asservat.labels" (list $ "connector") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-connector-config" $n }}
  namespace: {{ $ns }}
  labels: {{- include "asservat.labels" (list $ "connector") | nindent 4 }}
data:
  config.json: {{ $json | quote }}
  {{- if eq $mode "cluster" }}
  hub-ca.crt: {{ .Values.hub.caBundle | quote }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $account }}
  namespace: {{ $ns }}
  labels: {{- include "asservat.labels" (list $ "connector") | nindent 4 }}
rules:
  {{- if $collector }}
  # The node listener pair: read and CAS update only.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $nodes }}]
    verbs: [get, update]
  {{- end }}
  # Startup reads its account, Deployment and the Pod → ReplicaSet chain by name.
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [{{ $account }}]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [{{ $account }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $account }}
  namespace: {{ $ns }}
  labels: {{- include "asservat.labels" (list $ "connector") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $account }}
subjects:
  - kind: ServiceAccount
    namespace: {{ $ns }}
    name: {{ $account }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s" $ns $account }}
  labels: {{- include "asservat.labels" (list $ "connector") | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews, selfsubjectreviews]
    verbs: [create]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get{{ if $executor }}, list, watch{{ end }}]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get{{ if $executor }}, list{{ end }}{{ if and $executor (eq $mode "cluster") }}, watch{{ end }}]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get]
  {{- if eq $mode "cluster" }}
  # ADR-329: the connector delivers this cluster's AccessBindings to the hub
  # (with namespaces get above for their namespace UIDs).
  - apiGroups: [asservat.io]
    resources: [accessbindings]
    verbs: [get, list, watch]
  {{- end }}
  {{- if $executor }}
  # ADR-179/230/241/283: target resolution, probe Events, logs, metrics,
  # capture profiles and Kubernetes packet peers in this cluster; in
  # mode=cluster also the capacity delivery's workload watches (ADR-334).
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get{{ if eq $mode "cluster" }}, list, watch{{ end }}]
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [list]
  - apiGroups: [asservat.io]
    resources: [captureprofiles]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [services]
    verbs: [get]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
  {{- if $x.identityMappings }}
  # ADR-245: decision-time SubjectAccessReviews.
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  {{- end }}
  {{- end }}
  {{- if $collector }}
  # ADR-246: node attestation reads the collector's Node.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s" $ns $account }}
  labels: {{- include "asservat.labels" (list $ "connector") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s" $ns $account }}
subjects:
  - kind: ServiceAccount
    namespace: {{ $ns }}
    name: {{ $account }}
{{- if $collector }}
---
# ADR-246: the node listener pair, generated once by the connector.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $nodes }}
  namespace: {{ $ns }}
  labels: {{- include "asservat.labels" (list $ "connector") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $nodes }}
  namespace: {{ $ns }}
  labels: {{- include "asservat.labels" (list $ "connector") | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "asservat.selectorLabels" (list $ "connector") | nindent 4 }}
  ports:
    - name: nodes
      port: 8444
      targetPort: nodes
      protocol: TCP
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $account }}
  namespace: {{ $ns }}
  labels: {{- include "asservat.labels" (list $ "connector") | nindent 4 }}
spec:
  replicas: 1
  # One connector process at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "asservat.selectorLabels" (list $ "connector") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "asservat.selectorLabels" (list $ "connector") | nindent 8 }}
      annotations:
        checksum/config: {{ sha256sum (print $json .Values.hub.caBundle) }}
    spec:
      serviceAccountName: {{ $account }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      {{- include "asservat.imagePullSecrets" . | nindent 6 }}
      {{- with $r.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $r.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "asservat.podSecurityContext" . | nindent 8 }}
      containers:
        - name: connector
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          command: [/asservat, connector]
          env:
            - name: ASSERVAT_REGIONAL_POD_UID
              valueFrom: { fieldRef: { apiVersion: v1, fieldPath: metadata.uid } }
          {{- if $collector }}
          ports:
            - { name: nodes, containerPort: 8444, protocol: TCP }
          {{- end }}
          securityContext: {{- include "asservat.securityContext" . | nindent 12 }}
          resources: {{- toYaml $r.resources | nindent 12 }}
          volumeMounts:
            - name: inputs
              mountPath: /run/asservat/connector
              readOnly: true
      volumes:
        - name: inputs
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: {{ printf "%s-connector-config" $n }}
                  items:
                    - { key: config.json, path: config.json }
                    {{- if eq $mode "cluster" }}
                    - { key: hub-ca.crt, path: hub-ca.crt }
                    {{- end }}
              {{- if eq $mode "combined" }}
              - secret:
                  name: {{ include "asservat.svc.tlsSecret" (list . "federation") | quote }}
                  items: [{ key: ca.crt, path: hub-ca.crt }]
              {{- end }}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{ key: ca.crt, path: kube-ca.crt }]
              - serviceAccountToken:
                  path: kube.token
                  expirationSeconds: 3600
              # ADR-334: the connector's credential toward the hub.
              - serviceAccountToken:
                  path: hub.token
                  audience: {{ $hub | quote }}
                  expirationSeconds: 3600
              {{- with $x.profileAuthorization }}
              {{- if $executor }}
              - secret:
                  name: {{ . | quote }}
                  items: [{ key: profile-authorization.json, path: profile-authorization.json }]
              {{- end }}
              {{- end }}
{{- end }}
