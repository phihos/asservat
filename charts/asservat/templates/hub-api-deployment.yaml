{{- if .Values.hub.hubApi.enabled }}
{{- $p := .Values.installation.name }}
{{- $b := .Values.bootstrap.name }}
{{- $name := include "asservat.hubApi.name" . }}
{{- $h := .Values.hub.hubApi }}
{{- $image := include "asservat.hubApi.image" . }}
{{- $sql := printf "%s-sql-hub-api" $p }}
{{- $ca := $h.caSecrets }}
{{- if and .Values.origin (eq .Values.exposure.tls "pod") (not .Values.exposure.tlsSecret) }}
{{- fail "exposure.tlsSecret is required when origin is set and exposure.tls is pod" }}
{{- end }}
{{- if and .Values.origin (not .Values.identity.clientSecret.name) }}
{{- fail "identity.clientSecret.name is required when origin is set" }}
{{- end }}
{{- $security := dict "allowPrivilegeEscalation" false "readOnlyRootFilesystem" true "capabilities" (dict "drop" (list "ALL")) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asservat.hubApi.labels" . | nindent 4 }}
spec:
  replicas: {{ $h.replicas }}
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "asservat.hubApi.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asservat
        {{- include "asservat.hubApi.selector" . | nindent 8 }}
      annotations:
        checksum/config: {{ include "asservat.hubApi.config" . | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      {{- with $h.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $h.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Waits until setup has applied the compiled schema version.
        - name: wait-schema
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/asservat, schema-wait]
          securityContext: {{- toYaml $security | nindent 12 }}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 200m, memory: 128Mi}}
          volumeMounts:
            - {name: config, mountPath: /run/asservat/hub-api, readOnly: true}
            - {name: inputs, mountPath: /run/asservat/hub, readOnly: true}
      containers:
        - name: hub
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/asservat, hub-api]
          env:
            - name: ASSERVAT_HUB_POD_UID
              valueFrom: {fieldRef: {apiVersion: v1, fieldPath: metadata.uid}}
          ports:
            - {name: owner, containerPort: 9443, protocol: TCP}
            - {name: observation, containerPort: 9444, protocol: TCP}
            - {name: public, containerPort: 9445, protocol: TCP}
            - {name: operation, containerPort: 9448, protocol: TCP}
          resources: {{- toYaml $h.resources | nindent 12 }}
          securityContext: {{- toYaml $security | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /run/asservat/hub-api, readOnly: true}
            - {name: ids, mountPath: /run/asservat/ids, readOnly: true}
            - {name: inputs, mountPath: /run/asservat/hub, readOnly: true}
            - {name: observation, mountPath: /run/asservat/owner-observation, readOnly: true}
            {{- if .Values.origin }}
            - {name: public, mountPath: /run/asservat/public, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ printf "%s-hub-api-config" $p }}, defaultMode: 0444}
        - name: ids
          secret: {secretName: {{ printf "%s-ids" $p }}, defaultMode: 0440}
        - name: inputs
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ $sql }}
                  items: [{key: sql-owner-runtime.json, path: sql-owner-runtime.json}]
              - serviceAccountToken: {audience: asservat-hub-owner-enrollment, expirationSeconds: 600, path: owner-pod.token}
              - serviceAccountToken: {expirationSeconds: 600, path: kube-observer.token}
              - serviceAccountToken: {audience: asservat-owner-provider, expirationSeconds: 600, path: provider-auth.token}
              - secret:
                  name: {{ printf "%s-s3-hub-api" $p }}
                  items: [{key: credentials.json, path: provider-audit-storage.json}]
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: kube-ca.crt}]
              - secret:
                  name: {{ $ca.postgres.name | default (printf "%s-postgres-state" $b) }}
                  items: [{key: {{ $ca.postgres.key }}, path: postgres-ca.crt}]
              - secret:
                  name: {{ $ca.auditStore.name | default (printf "%s-objectstore-state" $b) }}
                  items: [{key: {{ $ca.auditStore.key }}, path: audit-store-ca.crt}]
              - secret:
                  name: {{ $ca.keyService.name | default (printf "%s-openbao-state" $b) }}
                  items: [{key: {{ $ca.keyService.key }}, path: key-service-ca.crt}]
              {{- if .Values.origin }}
              {{- if not .Values.identity.providerRootsSecret.name }}{{ fail "origin requires identity.providerRootsSecret (the identity provider's CA bundle)" }}{{ end }}
              - secret:
                  name: {{ .Values.identity.providerRootsSecret.name }}
                  items: [{key: {{ .Values.identity.providerRootsSecret.key }}, path: identity-ca.crt}]
              {{- end }}
        - name: observation
          projected:
            defaultMode: 0440
            sources:
              {{- range (include "asservat.hubApi.workerNamespaces" . | fromJsonArray) }}
              - serviceAccountToken: {expirationSeconds: 600, path: {{ printf "native-kube-%s.token" . }}}
              {{- end }}
        {{- if .Values.origin }}
        - name: public
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ $sql }}
                  items:
                    {{- range list "hub-runtime" "capture-intent-read" "worker-config-read" "capacity-profile-read" "capture-admit" "capture-journal" "capture-ack" }}
                    - {key: {{ printf "sql-public-%s.json" . }}, path: {{ printf "sql-public-%s.json" . }}}
                    {{- end }}
              - secret: {name: {{ printf "%s-audit-mac" $p }}}
              - secret:
                  name: {{ .Values.identity.clientSecret.name }}
                  items: [{key: {{ .Values.identity.clientSecret.key }}, path: oidc-client-secret}]
              {{- if eq .Values.exposure.tls "pod" }}
              - secret:
                  name: {{ .Values.exposure.tlsSecret }}
                  items: [{key: tls.crt, path: public-tls.crt}, {key: tls.key, path: public-tls.key}]
              {{- end }}
        {{- end }}
{{- end }}
