{{- if include "asservat.hub" . }}
{{- $name := include "asservat.fullname" (list . "hub-api") }}
{{- $h := index .Values.hub "hub-api" }}
{{- $bao := fromJson (include "asservat.openBao" .) }}
{{- $sql := include "asservat.secretName" (list . "sql-hub-api") }}
{{- $public := not (empty .Values.origin) }}
{{- $podTLS := eq .Values.exposure.tls.mode "pod" }}
{{- if and $public $podTLS (not .Values.exposure.tlsSecret) }}
{{- fail "exposure.tlsSecret is required when origin is set and exposure.tls.mode is pod" }}
{{- end }}
{{- $keycloak := eq .Values.services.identity.provider "keycloak" }}
{{- if and $public (not .Values.identity.providerRootsPEM) (not $keycloak) }}
{{- fail "identity.providerRootsPEM (the identity provider's CA bundle) is required when origin is set" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "asservat.labels" (list . "hub-api") | nindent 4 }}
spec:
  replicas: {{ int $h.replicas }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {{ include "asservat.selectorLabels" (list . "hub-api") | nindent 6 }}
  template:
    metadata:
      labels: {{ include "asservat.labels" (list . "hub-api") | nindent 8 }}
      annotations:
        {{- include "asservat.checksum" (list . "hub-api-configmap.yaml" "hub-api-sources.yaml") | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 15
      securityContext: {{ include "asservat.podSecurityContext" . | nindent 8 }}
      {{- include "asservat.imagePullSecrets" . | nindent 6 }}
      {{- include "asservat.placement" (list . "hub-api") | nindent 6 }}
      initContainers:
        {{- include "asservat.waitSchema" (dict "root" . "config" "/run/asservat/hub-api/config.json" "credential" "/run/asservat/hub/sql-owner-runtime.json" "ca" "/run/asservat/hub/postgres-ca.crt" "volumeMounts" (list (dict "name" "config" "mountPath" "/run/asservat/hub-api" "readOnly" true) (dict "name" "inputs" "mountPath" "/run/asservat/hub" "readOnly" true))) | nindent 8 }}
      containers:
        - name: hub
          image: {{ include "asservat.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/asservat, hub-api]
          env:
            - name: ASSERVAT_HUB_POD_UID
              valueFrom: {fieldRef: {apiVersion: v1, fieldPath: metadata.uid}}
          ports:
            - {name: owner, containerPort: 9443, protocol: TCP}
            - {name: observation, containerPort: 9444, protocol: TCP}
            - {name: public, containerPort: 9445, protocol: TCP}
            - {name: operation, containerPort: 9448, protocol: TCP}
            - {name: readiness, containerPort: 9449, protocol: TCP}
          # Bound after the full composition started; 200 only while the
          # owner runtime holds activated keys and a current enrollment proof.
          readinessProbe:
            httpGet: {path: /readyz, port: readiness, scheme: HTTP}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext: {{ include "asservat.securityContext" . | nindent 12 }}
          resources: {{ include "asservat.resources" (list . "hub-api") | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /run/asservat/hub-api, readOnly: true}
            {{- include "asservat.idsMount" . | nindent 12 }}
            - {name: inputs, mountPath: /run/asservat/hub, readOnly: true}
            - {name: observation, mountPath: /run/asservat/owner-observation, readOnly: true}
            {{- if $public }}
            - {name: public, mountPath: /run/asservat/public, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ printf "%s-config" $name }}
            items: [{key: config.json, path: config.json}]
            defaultMode: 0444
        {{- include "asservat.idsVolume" . | nindent 8 }}
        # /run/asservat/hub: the owner credential, tokens and provider CAs.
        - name: inputs
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ $sql | quote }}
                  items: [{key: sql-owner-runtime.json, path: sql-owner-runtime.json}]
              - serviceAccountToken: {audience: asservat-hub-owner-enrollment, expirationSeconds: 600, path: owner-pod.token}
              - serviceAccountToken: {expirationSeconds: 600, path: kube-observer.token}
              - serviceAccountToken: {audience: {{ $bao.hubAPIAudience | quote }}, expirationSeconds: 600, path: provider-auth.token}
              - secret:
                  name: {{ include "asservat.secretName" (list . "s3-owner-audit") | quote }}
                  items: [{key: credentials.json, path: provider-audit-storage.json}]
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: kube-ca.crt}]
              {{- include "asservat.providerRoots" (dict "root" . "provider" "postgres" "path" "postgres-ca.crt") | nindent 14 }}
              {{- include "asservat.providerRoots" (dict "root" . "provider" "objectStore" "path" "audit-store-ca.crt") | nindent 14 }}
              {{- include "asservat.providerRoots" (dict "root" . "provider" "openBao" "path" "key-service-ca.crt") | nindent 14 }}
              {{- if and $public (include "asservat.hubApi.combined" .) }}
              - secret:
                  name: {{ include "asservat.svc.tlsSecret" (list . "federation") | quote }}
                  items: [{key: ca.crt, path: federation-ca.crt}]
              {{- end }}
              {{- if and $public (or (include "asservat.hubApi.workerNamespaces" . | fromJsonArray) (include "asservat.hubApi.combined" .)) }}
              # The key service's serving CA for the hub-local download
              # workers' control and the combined-mode regional offer.
              - secret:
                  name: {{ include "asservat.svc.tlsSecret" (list . "key-service") | quote }}
                  items: [{key: ca.crt, path: download-key-service-ca.crt}]
              {{- end }}
              {{- if $public }}
              {{- if .Values.identity.providerRootsPEM }}
              - configMap:
                  name: {{ printf "%s-config" $name }}
                  items: [{key: identity-ca.crt, path: identity-ca.crt}]
              {{- else }}
              - secret:
                  name: {{ required "services.identity.keycloak.tlsSecretName is required" .Values.services.identity.keycloak.tlsSecretName | quote }}
                  items: [{key: ca.crt, path: identity-ca.crt}]
              {{- end }}
              {{- end }}
        # /run/asservat/owner-observation: the worker control catalog and one
        # API token per download-worker namespace.
        - name: observation
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: {{ printf "%s-config" $name }}
                  items: [{key: worker-controls.json, path: worker-controls.json}]
              {{- range (include "asservat.hubApi.workerNamespaces" . | fromJsonArray) }}
              - serviceAccountToken: {expirationSeconds: 600, path: {{ printf "native-kube-%s.token" . | quote }}}
              {{- end }}
        {{- if $public }}
        # /run/asservat/public: the public SQL logins, audit MAC keys, OIDC
        # client secret and, in pod TLS mode, the origin certificate.
        - name: public
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ $sql | quote }}
                  items:
                    {{- range list "hub-runtime" "capture-intent-read" "worker-config-read" "capacity-profile-read" "capture-admit" "capture-journal" "capture-ack" }}
                    - {key: {{ printf "sql-%s.json" . }}, path: {{ printf "sql-public-%s.json" . }}}
                    {{- end }}
              - secret:
                  name: {{ include "asservat.secretName" (list . "audit-mac") | quote }}
                  items: [{key: public-audit-keys.json, path: public-audit-keys.json}]
              {{- $client := fromJson (include "asservat.hubApi.clientSecret" .) }}
              - secret:
                  name: {{ $client.name | quote }}
                  items: [{key: {{ $client.key | quote }}, path: oidc-client-secret}]
              {{- if $podTLS }}
              - secret:
                  name: {{ .Values.exposure.tlsSecret | quote }}
                  items: [{key: tls.crt, path: public-tls.crt}, {key: tls.key, path: public-tls.key}]
              {{- end }}
        {{- end }}
{{- end }}
