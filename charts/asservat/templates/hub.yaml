{{- if .Values.hub.enabled }}
{{- $s3 := .Values.hub.storage.s3 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-hub
  labels: {{- include "asservat.labels" . | nindent 4 }}
spec:
  # One replica: connected agents and event streams are held in memory.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "asservat.labels" . | nindent 6 }}
      app.kubernetes.io/component: hub
  template:
    metadata:
      labels:
        {{- include "asservat.labels" . | nindent 8 }}
        app.kubernetes.io/component: hub
      annotations:
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hub
          image: {{ include "asservat.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - hub
            - --listen=:8080
            - --dsn-file=/secrets/db/dsn
            - --master-key-file=/secrets/hub/master-key
            - --users-file=/secrets/hub/users.yaml
            - --clusters-file=/secrets/hub/clusters.yaml
            - --admin-groups={{ join "," .Values.hub.adminGroups }}
            - --retention={{ .Values.hub.retention }}
            - --work-dir=/work
            {{- if .Values.hub.metrics.enabled }}
            - --metrics-listen=:{{ .Values.hub.metrics.port }}
            {{- end }}
            {{- with .Values.debuginfodURLs }}
            - --debuginfod-urls={{ join " " . }}
            {{- end }}
            - --allow-self-approval={{ .Values.hub.allowSelfApproval }}
            {{- if .Values.hub.requireReason }}
            - --require-reason
            {{- end }}
            {{- if .Values.hub.auditToLog }}
            - --audit-to-log
            {{- end }}
            {{- if $s3.endpoint }}
            - --s3-endpoint={{ $s3.endpoint }}
            - --s3-bucket={{ required "hub.storage.s3.bucket is required" $s3.bucket }}
            - --s3-insecure={{ $s3.insecure }}
            - --s3-access-key-file=/secrets/s3/accessKey
            - --s3-secret-key-file=/secrets/s3/secretKey
            {{- else }}
            - --data-dir=/data
            {{- end }}
            {{- if and .Values.agent.enabled .Values.hub.localCluster }}
            - --local-cluster={{ .Values.hub.localCluster }}
            - --local-token-file=/secrets/agent/token
            {{- end }}
            {{- if .Values.hub.alertToken }}
            - --alert-token-file=/secrets/hub/alert-token
            {{- end }}
            {{- with .Values.hub.oidc }}
            {{- if .issuer }}
            - --oidc-issuer={{ .issuer }}
            - --oidc-client-id={{ required "hub.oidc.clientID is required" .clientID }}
            - --oidc-username-claim={{ .usernameClaim }}
            - --oidc-groups-claim={{ .groupsClaim }}
            {{- $redirect := .redirectURL | default (and $.Values.hub.ingress.enabled (printf "https://%s/auth/callback" $.Values.hub.ingress.host)) }}
            {{- if $redirect }}
            - --oidc-redirect-url={{ $redirect }}
            - --oidc-scopes={{ join "," .scopes }}
            {{- if .clientSecret }}
            - --oidc-client-secret-file=/secrets/hub/oidc-client-secret
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.hub.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.hub.metrics.port }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          # A hub that no longer answers is started anew: captures, approvals
          # and queued tasks are in PostgreSQL, and agents reconnect.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources: {{- toYaml .Values.hub.resources | nindent 12 }}
          volumeMounts:
            - name: work
              mountPath: /work
            - name: hub
              mountPath: /secrets/hub
              readOnly: true
            - name: db
              mountPath: /secrets/db
              readOnly: true
            {{- if and .Values.agent.enabled .Values.hub.localCluster }}
            - name: agent
              mountPath: /secrets/agent
              readOnly: true
            {{- end }}
            {{- if $s3.endpoint }}
            - name: s3
              mountPath: /secrets/s3
              readOnly: true
            {{- else }}
            - name: data
              mountPath: /data
            {{- end }}
      volumes:
        # Files that are open in a viewer, decrypted while they are open.
        - name: work
          emptyDir: {}
        - name: hub
          secret:
            secretName: {{ .Release.Name }}-hub
        - name: db
          secret:
            secretName: {{ .Values.hub.database.existingSecret | default (printf "%s-hub" .Release.Name) }}
        {{- if and .Values.agent.enabled .Values.hub.localCluster }}
        - name: agent
          secret:
            secretName: {{ include "asservat.agentSecret" . }}
        {{- end }}
        {{- if $s3.endpoint }}
        - name: s3
          secret:
            secretName: {{ required "hub.storage.s3.existingSecret is required" $s3.existingSecret }}
        {{- else }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-evidence
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-hub
  labels: {{- include "asservat.labels" . | nindent 4 }}
spec:
  type: {{ .Values.hub.service.type }}
  selector:
    {{- include "asservat.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
  ports:
    - name: http
      port: {{ .Values.hub.service.port }}
      targetPort: http
      {{- with .Values.hub.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
{{- if .Values.hub.metrics.enabled }}
---
# A Service of its own for the metrics: the hub's Service may be reachable
# from outside the cluster, and the metrics ask for no sign-in.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-hub-metrics
  labels:
    {{- include "asservat.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-metrics
spec:
  type: ClusterIP
  selector:
    {{- include "asservat.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
  ports:
    - name: metrics
      port: {{ .Values.hub.metrics.port }}
      targetPort: metrics
{{- if .Values.hub.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-hub
  labels:
    {{- include "asservat.labels" . | nindent 4 }}
    {{- with .Values.hub.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "asservat.labels" . | nindent 6 }}
      app.kubernetes.io/component: hub-metrics
  endpoints:
    - port: metrics
{{- end }}
{{- end }}
{{- if not $s3.endpoint }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-evidence
  labels: {{- include "asservat.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.hub.storage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.hub.storage.size }}
{{- end }}
{{- if .Values.hub.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-hub
  labels: {{- include "asservat.labels" . | nindent 4 }}
  {{- with .Values.hub.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.hub.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.hub.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ $.Values.hub.ingress.host | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "hub.ingress.host is required" .Values.hub.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-hub
                port:
                  name: http
{{- end }}
{{- end }}
