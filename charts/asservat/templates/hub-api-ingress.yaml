{{- $x := .Values.exposure.ingress }}
{{- if and (include "asservat.hub" .) $x.enabled }}
{{- $host := include "asservat.originHost" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "asservat.fullname" (list . "hub-api") }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "asservat.labels" (list . "hub-api") | nindent 4 }}
  {{- with $x.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $x.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with $x.tls }}
  tls: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "asservat.fullname" (list . "hub-api") }}
                port: {number: 9445}
{{- end }}
