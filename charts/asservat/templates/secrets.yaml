{{- if .Values.hub.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-hub
  labels: {{- include "asservat.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
data:
  # Wraps the key of every stored artifact: losing it loses the evidence.
  master-key: {{ include "asservat.kept" (dict "root" . "name" (printf "%s-hub" .Release.Name) "key" "master-key" "value" (randAlphaNum 64 | sha256sum)) }}
  {{- $password := include "asservat.kept" (dict "root" . "name" (printf "%s-hub" .Release.Name) "key" "postgres-password" "value" (randAlphaNum 32)) }}
  postgres-password: {{ $password }}
  {{- if not .Values.hub.database.existingSecret }}
  dsn: {{ printf "postgres://asservat:%s@%s-postgres:5432/asservat" ($password | b64dec) .Release.Name | b64enc }}
  {{- end }}
  users.yaml: {{ .Values.hub.users | toYaml | b64enc }}
  oidc-client-secret: {{ .Values.hub.oidc.clientSecret | b64enc | quote }}
---
{{- end }}
{{- if and .Values.agent.enabled (not .Values.agent.existingSecret) }}
{{- if not (or .Values.agent.token (and .Values.hub.enabled .Values.hub.localCluster)) }}
{{- fail "agent.token or agent.existingSecret is required: create the cluster in the hub to get its join token" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-agent
  labels: {{- include "asservat.labels" . | nindent 4 }}
data:
  {{- if .Values.agent.token }}
  token: {{ .Values.agent.token | b64enc }}
  {{- else }}
  token: {{ include "asservat.kept" (dict "root" . "name" (printf "%s-agent" .Release.Name) "key" "token" "value" (randAlphaNum 48)) }}
  {{- end }}
  {{- if .Values.agent.caCert }}
  ca.crt: {{ .Values.agent.caCert | b64enc }}
  {{- end }}
{{- end }}
