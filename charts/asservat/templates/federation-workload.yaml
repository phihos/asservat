{{- if include "asservat.hub" . }}
{{- $v := .Values.hub.federation }}
{{- $n := include "asservat.name" . }}
{{- $p := include "asservat.providers" . | fromJson }}
{{- $dir := "/run/asservat/federation" }}
{{- $purposes := list "connector-delivery" "connector-owner-read" }}
{{- $config := (dict
  "name" $n
  "namespace" .Release.Namespace
  "port" 9446
  "concurrency" (int (default 4 $v.concurrency))
  "postgres" $p.postgres
  "connectorTokens" (include "asservat.connectorTokens" . | fromJson)) }}
{{- /* Connector settings on connect: the stored offer and each cluster's
  own regional object-store capabilities (REQ-FED-001). */}}
{{- $storage := list }}
{{- if eq .Values.mode "combined" }}
{{- $local := dict "write" (include "asservat.secretName" (list . "s3-regional-write")) "history" (include "asservat.secretName" (list . "s3-regional-history")) }}
{{- $_ := set $config "localStorage" $local }}
{{- $storage = list $local.write $local.history }}
{{- end }}
{{- range (include "asservat.activeClusters" . | fromJsonArray) }}{{ $storage = concat $storage (list (printf "%s-s3-regional-write-%s" $n .name) (printf "%s-s3-regional-history-%s" $n .name)) }}{{ end }}
{{- $rules := list
  (dict "apiGroups" (list "") "resources" (list "configmaps") "resourceNames" (list (printf "%s-owner-source" $n) (printf "%s-regional-offer" $n)) "verbs" (list "get"))
  (dict "apiGroups" (list "") "resources" (list "pods" "services") "verbs" (list "get"))
  (dict "apiGroups" (list "") "resources" (list "serviceaccounts") "resourceNames" (list (printf "%s-hub-api" $n)) "verbs" (list "get"))
  (dict "apiGroups" (list "apps") "resources" (list "replicasets" "deployments") "verbs" (list "get"))
  (dict "apiGroups" (list "discovery.k8s.io") "resources" (list "endpointslices") "verbs" (list "list")) }}
{{- with $storage }}{{ $rules = append $rules (dict "apiGroups" (list "") "resources" (list "secrets") "resourceNames" . "verbs" (list "get")) }}{{ end }}
{{- $tls := include "asservat.svc.tlsSecret" (list . "federation") }}
{{- $sources := list }}
{{- $sources = append $sources (include "asservat.svc.sql" (list . "federation" $purposes)) }}
{{- $sources = append $sources (printf "- secret:\n    name: %s\n    items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]" ($tls | quote)) }}
{{- $sources = append $sources (include "asservat.providerRoots" (dict "root" . "provider" "postgres" "path" "postgres-ca.crt") | trim) }}
{{ include "asservat.svc.account" (list . "federation" $rules) }}
---
{{ include "asservat.svc.service" (list . "federation" 9446) }}
{{- include "asservat.svc.tlsObjects" (list . "federation") }}
---
{{ include "asservat.svc.deployment" (dict "root" . "component" "federation" "command" "hub-federation" "dir" $dir "port" 9446 "grace" 40 "config" (toJson $config) "sqlFile" "sql-connector-delivery.json" "sources" (join "\n" $sources)) }}
{{- end }}
