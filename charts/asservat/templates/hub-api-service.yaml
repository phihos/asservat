{{- if .Values.hub.hubApi.enabled }}
{{- $name := include "asservat.hubApi.name" . }}
{{- $n := .Values.hub.hubApi.nativeService }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asservat.hubApi.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "asservat.hubApi.selector" . | nindent 4 }}
  ports:
    - {name: public, port: 9445, targetPort: public, protocol: TCP}
---
# Headless replica discovery for owner routing between hub-api replicas.
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-owner" $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asservat.hubApi.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "asservat.hubApi.selector" . | nindent 4 }}
  ports:
    - {name: owner, port: 9443, targetPort: owner, protocol: TCP}
    - {name: observation, port: 9444, targetPort: observation, protocol: TCP}
    - {name: public, port: 9445, targetPort: public, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-native" $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asservat.hubApi.labels" . | nindent 4 }}
  {{- with $n.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $n.type }}
  selector:
    {{- include "asservat.hubApi.selector" . | nindent 4 }}
  ports:
    - name: native
      port: 9444
      targetPort: observation
      protocol: TCP
      {{- if and (ne $n.type "ClusterIP") (dig "native" 0 $n.nodePorts) }}
      nodePort: {{ $n.nodePorts.native }}
      {{- end }}
    - name: operation
      port: 9448
      targetPort: operation
      protocol: TCP
      {{- if and (ne $n.type "ClusterIP") (dig "operation" 0 $n.nodePorts) }}
      nodePort: {{ $n.nodePorts.operation }}
      {{- end }}
{{- end }}
