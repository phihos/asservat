{{- $x := .Values.exposure.httpRoute }}
{{- if and (include "asservat.hub" .) $x.enabled }}
{{- $host := include "asservat.originHost" . }}
{{- if not $x.parentRefs }}{{ fail "exposure.httpRoute.parentRefs requires at least one Gateway" }}{{ end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "asservat.fullname" (list . "hub-api") }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "asservat.labels" (list . "hub-api") | nindent 4 }}
  {{- with $x.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs: {{ toYaml $x.parentRefs | nindent 4 }}
  hostnames: [{{ $host | quote }}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs:
        - name: {{ include "asservat.fullname" (list . "hub-api") }}
          port: 9445
{{- end }}
