{{- $v := dig "keyService" dict (default dict .Values.hub) }}
{{- if and (has .Values.mode (list "hub" "combined")) $v.enabled }}
{{- $name := include "asservat.svc.name" . }}
{{- $full := printf "%s-key-service" $name }}
{{- $p := include "asservat.svc.providers" . | fromJson }}
{{- $k := include "asservat.svc.constants" . | fromJson }}
{{- $root := "/run/asservat/key-service" }}
{{- $d := default dict $v.downloads }}
{{- $config := dict
  "port" 9447
  "concurrency" (default 8 $v.concurrency | int)
  "namespace" .Release.Namespace
  "keyID" $k.keyID
  "postgres" (dict "host" $p.postgres.host "port" ($p.postgres.port | int) "database" $p.postgres.database)
  "openBao" $p.openBao.endpoint
  "workerPKIMount" $k.workerPKIMount
  "connectorPKIMount" $k.connectorPKIMount
}}
{{- if $d.enabled }}
{{- $topologies := list }}
{{- range (default list $d.retentionTopologies) }}
{{- $topologies = append $topologies (dict "targetClusterID" .targetClusterID "name" .name) }}
{{- end }}
{{- $_ := set $config "downloads" (dict "workerConfiguration" $k.workerConfiguration "clusterCatalog" $k.clusterCatalog "retentionTopologies" $topologies) }}
{{- end }}
{{- $logins := list "key-configuration" "key-wrap" "key-verify" }}
{{- if $d.enabled }}{{ $logins = append $logins "key-acquisition" }}{{ end }}
{{- $configJSON := toJson $config }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "asservat.svc.labels" (dict "root" . "component" "key-service") | nindent 4 }}
{{- if $d.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $full }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "asservat.svc.labels" (dict "root" . "component" "key-service") | nindent 4 }}
rules:
  # Worker configuration, cluster catalog and topology reads (downloads).
  # Catalog slot topologies are named by the catalog, so ConfigMap reads are
  # not name-restricted; the key service reads no Secret through the API.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $full }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "asservat.svc.labels" (dict "root" . "component" "key-service") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $full }}
subjects:
  - kind: ServiceAccount
    name: {{ $full }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
{{ include "asservat.svc.namespaceReader" (dict "root" . "component" "key-service") }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-config" $full }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "asservat.svc.labels" (dict "root" . "component" "key-service") | nindent 4 }}
data:
  config.json: {{ $configJSON | quote }}
---
{{ include "asservat.svc.service" (dict "root" . "component" "key-service" "key" "keyService" "values" $v "port" 9447) }}
{{- include "asservat.svc.certificate" (dict "root" . "component" "key-service" "values" $v) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "asservat.svc.labels" (dict "root" . "component" "key-service") | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy: {type: Recreate}
  selector:
    matchLabels: {{ include "asservat.svc.selector" (dict "root" . "component" "key-service") | nindent 6 }}
  template:
    metadata:
      labels: {{ include "asservat.svc.labels" (dict "root" . "component" "key-service") | nindent 8 }}
      annotations:
        checksum/config: {{ sha256sum $configJSON }}
    spec:
      serviceAccountName: {{ $full }}
      # The in-cluster API token reads the namespace UID and, with downloads,
      # the worker configuration, catalog and topologies.
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 15
      securityContext: {{ include "asservat.svc.podSecurity" . | nindent 8 }}
      {{- include "asservat.svc.scheduling" $v | nindent 6 }}
      initContainers:
        {{- include "asservat.svc.schemaWait" (dict "root" . "root_dir" $root) | nindent 8 }}
      containers:
        - name: key-service
          image: {{ include "asservat.svc.image" . | quote }}
          imagePullPolicy: {{ dig "pullPolicy" "IfNotPresent" (default dict .Values.image) }}
          command: [/asservat, key-service]
          ports: [{name: key-service, containerPort: 9447, protocol: TCP}]
          securityContext: {{ include "asservat.svc.containerSecurity" . | nindent 12 }}
          resources: {{ toYaml (default (dict "requests" (dict "cpu" "50m" "memory" "64Mi") "limits" (dict "cpu" "500m" "memory" "256Mi")) $v.resources) | nindent 12 }}
          volumeMounts:
            - {name: inputs, mountPath: {{ $root }}, readOnly: true}
            - {name: ids, mountPath: /run/asservat/ids, readOnly: true}
      volumes:
        - name: inputs
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: {{ printf "%s-config" $full }}
                  items: [{key: config.json, path: config.json}]
              - secret:
                  name: {{ include "asservat.svc.secret" (dict "root" . "key" "sqlKeyService" "default" (printf "%s-sql-key-service" $name)) | quote }}
                  optional: false
                  items:
                    {{- range $logins }}
                    - {key: {{ printf "sql-%s.json" . }}, path: {{ printf "sql-%s.json" . }}}
                    {{- end }}
              # The artifact root key: mounted into this Pod only.
              - secret:
                  name: {{ include "asservat.svc.secret" (dict "root" . "key" "artifactKey" "default" (printf "%s-artifact-key" $name)) | quote }}
                  optional: false
                  items: [{key: keys.json, path: artifact-key.json}]
              - secret:
                  name: {{ include "asservat.svc.tlsSecret" (dict "root" . "component" "key-service" "key" "keyService" "values" $v) | quote }}
                  optional: false
                  items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]
              {{- include "asservat.svc.caSource" (dict "secret" $p.postgres.caSecret "path" "postgres-ca.crt") | nindent 14 }}
              {{- include "asservat.svc.caSource" (dict "secret" $p.openBao.caSecret "path" "openbao-ca.crt") | nindent 14 }}
        {{- include "asservat.svc.idsVolume" . | nindent 8 }}
{{- end }}
