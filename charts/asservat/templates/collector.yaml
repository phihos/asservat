{{- if .Values.collector.enabled }}
{{- $c := .Values.collector }}
{{- if eq .Values.mode "hub" }}{{ fail "collector.enabled requires mode=cluster or mode=combined" }}{{ end }}
{{- if or (hasPrefix "kube-" $c.namespace) (eq $c.namespace "default") (eq $c.namespace .Release.Namespace) (eq $c.namespace .Values.cluster.namespace) }}{{ fail "collector.namespace must be a dedicated collector namespace distinct from the release and connector namespaces" }}{{ end }}
{{- if not (regexMatch "^[a-z0-9][a-z0-9./:_-]{0,383}@sha256:[a-f0-9]{64}$" $c.image) }}{{ fail "collector.image requires the exact verified product repository@sha256 digest" }}{{ end }}
{{- range $id := list $c.installationID $c.clusterID }}{{ if not (regexMatch "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $id) }}{{ fail "collector.installationID and collector.clusterID must be the installation's UUIDs" }}{{ end }}{{ end }}
{{- /* ADR-246 decision 9: with cluster.enabled and collector.connector left
  empty, the values come from the connector-nodes ConfigMap that this
  release's cluster installer hook publishes. The hook runs after the first
  render, so the first install creates only the namespace and account (the
  installer needs the namespace); the next helm upgrade renders the
  DaemonSet. helm template never sees the ConfigMap. */}}
{{- $conn := $c.connector }}
{{- $published := and .Values.cluster.enabled (eq $conn.endpoint "") (eq $conn.serverName "") (eq $conn.rootsPEM "") }}
{{- if $published }}
{{- $cm := lookup "v1" "ConfigMap" .Values.cluster.namespace "connector-nodes" }}
{{- $conn = dict "endpoint" (dig "data" "endpoint" "" $cm) "serverName" (dig "data" "serverName" "" $cm) "rootsPEM" (dig "data" "rootsPEM" "" $cm) }}
{{- end }}
{{- $ready := and (hasPrefix "https://" $conn.endpoint) (ne $conn.serverName "") (contains "-----BEGIN CERTIFICATE-----" $conn.rootsPEM) }}
{{- if and (not $ready) (not $published) }}{{ fail "collector.connector requires the connector's https endpoint, certificate server name and issuing roots (or leave all three empty with cluster.enabled)" }}{{ end }}
{{- $name := printf "%s-node" .Release.Name }}
{{- $ceilings := dict "ringBytes" (int64 $c.ceilings.ringBytes) "frozenBytes" (int64 $c.ceilings.frozenBytes) "uploadBytesPerSecond" (int64 $c.ceilings.uploadBytesPerSecond) "uploadBurstBytes" (int64 $c.ceilings.uploadBurstBytes) }}
{{- if gt (int64 $c.ceilings.maxActiveSources) 0 }}
{{- $_ := set $ceilings "maxActiveSources" (int64 $c.ceilings.maxActiveSources) }}
{{- $_ := set $ceilings "inputBytesPerSecond" (int64 $c.ceilings.inputBytesPerSecond) }}
{{- $_ := set $ceilings "inputBurstBytes" (int64 $c.ceilings.inputBurstBytes) }}
{{- end }}
{{- $input := dict "format" "asservat-node-deployment/v1" "installationID" $c.installationID "clusterID" $c.clusterID "connector" (dict "endpoint" $conn.endpoint "serverName" $conn.serverName "rootsPEM" $conn.rootsPEM) "ceilings" $ceilings }}
{{- $json := toJson $input }}
{{- $digest := sha256sum $json }}
# ADR-246: the collector namespace is the only namespace with the privileged
# Pod Security exception. Workload namespaces keep `restricted`.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $c.namespace }}
  labels:
    app.kubernetes.io/part-of: asservat
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# The collector account has no RBAC binding: its only use is the Pod-bound
# projected token the connector reviews.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $c.namespace }}
automountServiceAccountToken: false
{{- if $ready }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-input.%s" $name (trunc 32 $digest) }}
  namespace: {{ $c.namespace }}
immutable: true
data:
  node.json: {{ $json | quote }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  namespace: {{ $c.namespace }}
  labels:
    app.kubernetes.io/name: asservat-node
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: asservat-node
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asservat-node
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
      annotations:
        asservat.io/node-input: {{ $digest }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Host PID: the probe and later recorders must see the runtime and
      # target processes. No host network and no host IPC.
      hostPID: true
      hostNetwork: false
      hostIPC: false
      {{- if $c.registrySecret }}
      imagePullSecrets:
        - name: {{ $c.registrySecret }}
      {{- end }}
      terminationGracePeriodSeconds: 10
      tolerations:
        - operator: Exists
      containers:
        - name: node
          image: {{ $c.image }}
          imagePullPolicy: IfNotPresent
          command: ["/asservat", "node"]
          env:
            - name: ASSERVAT_NODE_POD_UID
              valueFrom: { fieldRef: { fieldPath: metadata.uid } }
            - name: ASSERVAT_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          securityContext:
            # Root with exactly the capabilities the probe and the packet
            # recorder need, not a privileged container, under the runtime's
            # default seccomp profile: BPF loads programs, NET_ADMIN is
            # required for sched_cls programs, tc filters and TCX links,
            # SYS_RESOURCE lifts the memlock limit on kernels before 5.11.
            # ADR-248 (packet recorder, Inspektor Gadget's tcpdump gadget):
            # PERFMON reads the gadget's perf event buffer, SYS_ADMIN lets it
            # enter the target Pod's and the host's network namespace (setns)
            # instead of giving the Pod the host network, SYS_PTRACE opens
            # another user's /proc/<pid>/ns/net.
            privileged: false
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["BPF", "NET_ADMIN", "SYS_RESOURCE", "PERFMON", "SYS_ADMIN", "SYS_PTRACE"]
            # The runtime's default AppArmor profile applies where the node
            # enables AppArmor; requesting it explicitly would refuse the Pod
            # on nodes without AppArmor.
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              # Ring + frozen ceilings plus 128 MiB for the process.
              memory: {{ add (int64 $c.ceilings.ringBytes) (int64 $c.ceilings.frozenBytes) 134217728 | quote }}
          volumeMounts:
            - { name: input, mountPath: /run/asservat/node, readOnly: true }
            - { name: token, mountPath: /run/asservat/node-token, readOnly: true }
            - { name: disposable-host, mountPath: /etc/asservat-disposable-host, readOnly: true }
            - { name: debugfs, mountPath: /sys/kernel/debug, readOnly: true }
            - { name: tracefs, mountPath: /sys/kernel/tracing, readOnly: true }
            - { name: bpffs, mountPath: /sys/fs/bpf, readOnly: true }
      volumes:
        - name: input
          configMap:
            name: {{ printf "%s-input.%s" $name (trunc 32 $digest) }}
            items: [{ key: node.json, path: node.json }]
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ printf "asservat-node:%s" $c.installationID }}
                  expirationSeconds: 600
        # Accidental-use barrier (S-04 plan §5.2): the kubelet refuses to
        # start the Pod unless this host file exists. Only disposable CI
        # runners and VM images create it.
        - name: disposable-host
          hostPath: { path: /etc/asservat-disposable-host, type: File }
        - name: debugfs
          hostPath: { path: /sys/kernel/debug, type: "" }
        - name: tracefs
          hostPath: { path: /sys/kernel/tracing, type: "" }
        - name: bpffs
          hostPath: { path: /sys/fs/bpf, type: "" }
{{- end }}
{{- end }}
