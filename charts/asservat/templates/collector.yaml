{{- if .Values.collector.enabled }}
{{- $c := .Values.collector }}
{{- $n := include "asservat.name" . }}
{{- if not .Values.region.enabled }}{{ fail "collector.enabled requires region.enabled (mode=cluster or mode=combined)" }}{{ end }}
{{- if or (hasPrefix "kube-" $c.namespace) (eq $c.namespace "default") (eq $c.namespace .Release.Namespace) }}{{ fail "collector.namespace must be a dedicated collector namespace distinct from the release namespace" }}{{ end }}
{{- $image := include "asservat.image" . }}
{{- $name := printf "%s-node" $n }}
{{- $root := printf "%s-node-connector-ca" $n }}
{{- $listener := printf "%s-connector-nodes.%s.svc" $n .Release.Namespace }}
{{- $ceilings := dict "ringBytes" (int64 $c.ceilings.ringBytes) "frozenBytes" (int64 $c.ceilings.frozenBytes) "uploadBytesPerSecond" (int64 $c.ceilings.uploadBytesPerSecond) "uploadBurstBytes" (int64 $c.ceilings.uploadBurstBytes) }}
{{- if $c.ringDisk.enabled }}
{{- $_ := set $ceilings "ringDiskBytes" (int64 $c.ringDisk.bytes) }}
{{- end }}
{{- if gt (int64 $c.ceilings.maxActiveSources) 0 }}
{{- $_ := set $ceilings "maxActiveSources" (int64 $c.ceilings.maxActiveSources) }}
{{- $_ := set $ceilings "inputBytesPerSecond" (int64 $c.ceilings.inputBytesPerSecond) }}
{{- $_ := set $ceilings "inputBurstBytes" (int64 $c.ceilings.inputBurstBytes) }}
{{- end }}
{{- /* The connector publishes its node listener root into $root; node.json
  carries no rootsPEM and the collector reads connector-ca.crt beside it. */}}
{{- $input := dict "format" "asservat-node-deployment/v1" "connector" (dict "endpoint" (printf "https://%s:8444" $listener) "serverName" $listener "rootsPEM" "") "ceilings" $ceilings }}
{{- if $c.live }}
{{- $_ := set $input "live" $c.live }}
{{- end }}
{{- $json := toJson $input }}
# ADR-246: the collector namespace is the only namespace with the privileged
# Pod Security exception. Workload namespaces keep `restricted`.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $c.namespace }}
  labels:
    {{- include "asservat.labels" (list $ "node") | nindent 4 }}
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# The collector account has no RBAC binding: its only use is the Pod-bound
# projected token the connector reviews.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $c.namespace }}
  labels: {{- include "asservat.labels" (list $ "node") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-config" $name }}
  namespace: {{ $c.namespace }}
  labels: {{- include "asservat.labels" (list $ "node") | nindent 4 }}
data:
  node.json: {{ $json | quote }}
---
# The connector writes its node listener root here (key connector-ca.crt).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $root }}
  namespace: {{ $c.namespace }}
  labels: {{- include "asservat.labels" (list $ "node") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
---
# The connector's attestation reads of the collector Pods and DaemonSet and
# its publication of the listener root.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-connector" $name }}
  namespace: {{ $c.namespace }}
  labels: {{- include "asservat.labels" (list $ "node") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  - apiGroups: [apps]
    resources: [daemonsets]
    resourceNames: [{{ $name }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ $root }}]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-connector" $name }}
  namespace: {{ $c.namespace }}
  labels: {{- include "asservat.labels" (list $ "node") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-connector" $name }}
subjects:
  - kind: ServiceAccount
    namespace: {{ .Release.Namespace }}
    name: {{ printf "%s-connector" $n }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  namespace: {{ $c.namespace }}
  labels: {{- include "asservat.labels" (list $ "node") | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "asservat.selectorLabels" (list $ "node") | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels: {{- include "asservat.selectorLabels" (list $ "node") | nindent 8 }}
      annotations:
        checksum/config: {{ sha256sum $json }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Host PID: the probe and later recorders must see the runtime and
      # target processes. No host network and no host IPC.
      hostPID: true
      hostNetwork: false
      hostIPC: false
      {{- include "asservat.imagePullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: 10
      tolerations:
        - operator: Exists
      containers:
        - name: node
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          command: ["/asservat", "node"]
          env:
            - name: ASSERVAT_NODE_POD_UID
              valueFrom: { fieldRef: { fieldPath: metadata.uid } }
            - name: ASSERVAT_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          securityContext:
            # Root with exactly the capabilities the probe and the packet
            # recorder need, not a privileged container, under the runtime's
            # default seccomp profile: BPF loads programs, NET_ADMIN is
            # required for sched_cls programs, tc filters and TCX links,
            # SYS_RESOURCE lifts the memlock limit on kernels before 5.11.
            # ADR-248 (packet recorder, Inspektor Gadget's tcpdump gadget):
            # PERFMON reads the gadget's perf event buffer, SYS_ADMIN lets it
            # enter the target Pod's and the host's network namespace (setns)
            # instead of giving the Pod the host network, SYS_PTRACE opens
            # another user's /proc/<pid>/ns/net.
            privileged: false
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["BPF", "NET_ADMIN", "SYS_RESOURCE", "PERFMON", "SYS_ADMIN", "SYS_PTRACE"]
            # The runtime's default AppArmor profile applies where the node
            # enables AppArmor; requesting it explicitly would refuse the Pod
            # on nodes without AppArmor.
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              # Ring + frozen ceilings plus 128 MiB for the process.
              memory: {{ add (int64 $c.ceilings.ringBytes) (int64 $c.ceilings.frozenBytes) 134217728 | quote }}
          volumeMounts:
            - { name: input, mountPath: /run/asservat/node, readOnly: true }
            - { name: token, mountPath: /run/asservat/node-token, readOnly: true }
            - { name: disposable-host, mountPath: /etc/asservat-disposable-host, readOnly: true }
            - { name: debugfs, mountPath: /sys/kernel/debug, readOnly: true }
            - { name: tracefs, mountPath: /sys/kernel/tracing, readOnly: true }
            - { name: bpffs, mountPath: /sys/fs/bpf, readOnly: true }
            {{- if $c.ringDisk.enabled }}
            - { name: ring-disk, mountPath: /var/lib/asservat-ring }
            {{- end }}
      volumes:
        {{- if $c.ringDisk.enabled }}
        # ADR-278: node-local, size-limited; only sealed ring segments.
        - name: ring-disk
          emptyDir: { sizeLimit: {{ int64 $c.ringDisk.bytes | quote }} }
        {{- end }}
        - name: input
          projected:
            sources:
              - configMap:
                  name: {{ printf "%s-config" $name }}
                  items: [{ key: node.json, path: node.json }]
              - configMap:
                  name: {{ $root }}
                  optional: true
                  items: [{ key: connector-ca.crt, path: connector-ca.crt }]
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: asservat-node
                  expirationSeconds: 600
        # Accidental-use barrier (S-04 plan §5.2): the kubelet refuses to
        # start the Pod unless this host file exists. Only disposable CI
        # runners and VM images create it.
        - name: disposable-host
          hostPath: { path: /etc/asservat-disposable-host, type: File }
        - name: debugfs
          hostPath: { path: /sys/kernel/debug, type: "" }
        - name: tracefs
          hostPath: { path: /sys/kernel/tracing, type: "" }
        - name: bpffs
          hostPath: { path: /sys/fs/bpf, type: "" }
{{- end }}
