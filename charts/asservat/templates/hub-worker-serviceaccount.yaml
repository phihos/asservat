{{- if include "asservat.hub" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "asservat.fullname" (list . "hub-worker") }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "asservat.labels" (list . "hub-worker") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
