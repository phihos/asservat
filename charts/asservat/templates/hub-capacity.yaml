{{- if and (include "asservat.hub" .) .Values.capacity .Values.capacity.poolSpec .Values.capacity.policySpec }}
{{- $c := .Values.capacity }}
{{- if ne $c.policySpec.poolRef $c.pool }}{{ fail "capacity.policySpec.poolRef must equal capacity.pool" }}{{ end }}
apiVersion: asservat.io/v1alpha1
kind: EvidenceStoragePool
metadata:
  name: {{ $c.pool }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "asservat.labels" (list . "capacity") | nindent 4 }}
# JSON keeps large integer quantities exact (toYaml would use exponents).
spec: {{ toJson $c.poolSpec }}
---
apiVersion: asservat.io/v1alpha1
kind: EvidenceBudgetPolicy
metadata:
  name: {{ $c.policy }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "asservat.labels" (list . "capacity") | nindent 4 }}
{{- /* An absent scope.clusterID means the hub cluster (its ID is generated). */}}
{{- $policy := deepCopy $c.policySpec }}
{{- if and $policy.scope (not $policy.scope.clusterID) }}{{ $_ := unset $policy.scope "clusterID" }}{{ end }}
spec: {{ toJson $policy }}
{{- end }}
