{{- if and .Values.bootstrap.enabled (eq .Values.services.objectStore.provider "seaweedfs") }}
{{- $b := .Values.bootstrap }}
{{- $name := printf "%s-objectstore-bootstrap" $b.name }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: [{{ printf "%s-objectstore" $b.name | quote }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    resourceNames: [{{ printf "%s-objectstore-data" $b.name | quote }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    resourceNames: [{{ printf "%s-objectstore-0" $b.name | quote }}]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}}
subjects:
  - kind: ServiceAccount
    namespace: {{ .Release.Namespace }}
    name: {{ printf "%s-bootstrap-runner" $b.name }}
{{- end }}
