{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "permissionsources.asservat.io"
  },
  "spec": {
    "group": "asservat.io",
    "scope": "Namespaced",
    "names": {
      "plural": "permissionsources",
      "singular": "permissionsource",
      "kind": "PermissionSource",
      "categories": [
        "asservat"
      ]
    },
    "versions": [
      {
        "name": "v1alpha1",
        "served": true,
        "storage": true,
        "subresources": {
          "status": {}
        },
        "additionalPrinterColumns": [
          {
            "name": "Phase",
            "type": "string",
            "jsonPath": ".status.phase"
          },
          {
            "name": "Observed",
            "type": "integer",
            "jsonPath": ".status.observedGeneration"
          },
          {
            "name": "Age",
            "type": "date",
            "jsonPath": ".metadata.creationTimestamp"
          }
        ],
        "schema": {
          "openAPIV3Schema": {
            "type": "object",
            "required": [
              "spec"
            ],
            "properties": {
              "apiVersion": {
                "type": "string"
              },
              "kind": {
                "type": "string"
              },
              "metadata": {
                "type": "object"
              },
              "spec": {
                "type": "object",
                "properties": {
                  "enabled": {
                    "type": "boolean"
                  },
                  "clusterID": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "type": {
                    "type": "string",
                    "enum": [
                      "namespaceMetadata",
                      "workloadMetadata",
                      "kubernetesExec",
                      "kubernetesAccessReview"
                    ]
                  },
                  "namespaceSelector": {
                    "type": "object",
                    "properties": {
                      "matchLabels": {
                        "type": "object",
                        "additionalProperties": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 63
                        },
                        "maxProperties": 16
                      }
                    },
                    "required": [
                      "matchLabels"
                    ]
                  },
                  "excludedNamespaces": {
                    "type": "array",
                    "items": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 63
                    },
                    "maxItems": 64,
                    "x-kubernetes-list-type": "set"
                  },
                  "role": {
                    "type": "string",
                    "enum": [
                      "evidence-reader",
                      "workload-maintainer",
                      "evidence-owner",
                      "action-approver"
                    ]
                  },
                  "maxDecisionAgeSeconds": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 60
                  },
                  "maxNamespaces": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 1000
                  },
                  "protection": {
                    "type": "object",
                    "properties": {
                      "mode": {
                        "type": "string",
                        "enum": [
                          "administratorManaged",
                          "admissionEnforced"
                        ]
                      },
                      "reviewRef": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 256
                      },
                      "guardRef": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 256
                      }
                    },
                    "required": [
                      "mode",
                      "reviewRef"
                    ],
                    "x-kubernetes-validations": [
                      {
                        "rule": "self.mode != \"admissionEnforced\" || has(self.guardRef)",
                        "message": "An enforcing protection profile requires guardRef."
                      }
                    ]
                  },
                  "metadataMapping": {
                    "type": "object",
                    "properties": {
                      "field": {
                        "type": "string",
                        "enum": [
                          "annotation",
                          "label"
                        ]
                      },
                      "key": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 253
                      },
                      "mode": {
                        "type": "string",
                        "enum": [
                          "groupID",
                          "valueMap"
                        ]
                      },
                      "issuer": {
                        "type": "string",
                        "format": "uri"
                      },
                      "values": {
                        "type": "object",
                        "maxProperties": 128,
                        "additionalProperties": {
                          "type": "array",
                          "items": {
                            "type": "string",
                            "minLength": 1,
                            "maxLength": 256
                          },
                          "minItems": 1,
                          "maxItems": 16,
                          "x-kubernetes-list-type": "set"
                        }
                      }
                    },
                    "required": [
                      "field",
                      "key",
                      "mode",
                      "issuer"
                    ],
                    "x-kubernetes-validations": [
                      {
                        "rule": "self.mode == \"valueMap\" ? (has(self.values) && size(self.values) > 0) : !has(self.values)",
                        "message": "valueMap requires nonempty values; groupID forbids values."
                      }
                    ]
                  },
                  "workloadSelector": {
                    "type": "object",
                    "properties": {
                      "matchLabels": {
                        "type": "object",
                        "additionalProperties": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 63
                        },
                        "maxProperties": 16
                      }
                    },
                    "required": [
                      "matchLabels"
                    ]
                  },
                  "identityMappingRef": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 63
                  },
                  "admissionParity": {
                    "type": "object",
                    "properties": {
                      "mode": {
                        "type": "string",
                        "enum": [
                          "noAdditionalRestrictions",
                          "qualifiedAdapter"
                        ]
                      },
                      "reviewRef": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 256
                      },
                      "adapterRef": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 63
                      }
                    },
                    "required": [
                      "mode",
                      "reviewRef"
                    ],
                    "x-kubernetes-validations": [
                      {
                        "rule": "self.mode == \"qualifiedAdapter\" ? has(self.adapterRef) : !has(self.adapterRef)",
                        "message": "Only qualifiedAdapter requires adapterRef."
                      }
                    ]
                  },
                  "accessReview": {
                    "type": "object",
                    "properties": {
                      "check": {
                        "type": "string",
                        "enum": [
                          "namespaceCaptureCreate",
                          "workloadGet",
                          "workloadPatch",
                          "workloadUpdate"
                        ]
                      }
                    },
                    "required": [
                      "check"
                    ]
                  }
                },
                "required": [
                  "enabled",
                  "clusterID",
                  "type",
                  "namespaceSelector",
                  "excludedNamespaces",
                  "role",
                  "maxDecisionAgeSeconds",
                  "maxNamespaces"
                ],
                "x-kubernetes-validations": [
                  {
                    "rule": "self.type in [\"namespaceMetadata\", \"workloadMetadata\"] ? (has(self.protection) && has(self.metadataMapping) && !has(self.identityMappingRef) && !has(self.admissionParity) && !has(self.accessReview)) : (has(self.identityMappingRef) && has(self.admissionParity) && self.role in [\"evidence-reader\", \"workload-maintainer\"] && !has(self.protection) && !has(self.metadataMapping) && !has(self.workloadSelector))",
                    "message": "Metadata and access-review sources require their own qualification fields."
                  },
                  {
                    "rule": "self.type == \"workloadMetadata\" ? (has(self.workloadSelector) && self.protection.mode == \"admissionEnforced\") : !has(self.workloadSelector)",
                    "message": "Workload metadata requires workloadSelector and admissionEnforced protection."
                  },
                  {
                    "rule": "self.type != \"kubernetesExec\" || self.role == \"workload-maintainer\"",
                    "message": "Exec inheritance provides the maintainer role only."
                  },
                  {
                    "rule": "self.type == \"kubernetesAccessReview\" ? has(self.accessReview) : !has(self.accessReview)",
                    "message": "Only kubernetesAccessReview requires accessReview."
                  }
                ],
                "description": "Desired permission configuration. A successful write does not activate access; inspect current-generation status."
              },
              "status": {
                "type": "object",
                "properties": {
                  "phase": {
                    "type": "string",
                    "enum": [
                      "Pending",
                      "Ready",
                      "Disabled",
                      "Stale",
                      "UnsafeSource",
                      "Rejected"
                    ]
                  },
                  "observedGeneration": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "lastVerifiedAt": {
                    "type": "string",
                    "format": "date-time"
                  },
                  "reasons": {
                    "type": "array",
                    "items": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 256
                    },
                    "maxItems": 16
                  }
                },
                "required": [
                  "phase",
                  "observedGeneration"
                ]
              }
            }
          }
        }
      }
    ]
  }
}
