{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "accessbindings.asservat.io"
  },
  "spec": {
    "group": "asservat.io",
    "scope": "Namespaced",
    "names": {
      "plural": "accessbindings",
      "singular": "accessbinding",
      "kind": "AccessBinding",
      "categories": [
        "asservat"
      ]
    },
    "versions": [
      {
        "name": "v1alpha1",
        "served": true,
        "storage": true,
        "subresources": {
          "status": {}
        },
        "additionalPrinterColumns": [
          {
            "name": "Phase",
            "type": "string",
            "jsonPath": ".status.phase"
          },
          {
            "name": "Observed",
            "type": "integer",
            "jsonPath": ".status.observedGeneration"
          },
          {
            "name": "Age",
            "type": "date",
            "jsonPath": ".metadata.creationTimestamp"
          }
        ],
        "schema": {
          "openAPIV3Schema": {
            "type": "object",
            "required": [
              "spec"
            ],
            "properties": {
              "apiVersion": {
                "type": "string"
              },
              "kind": {
                "type": "string"
              },
              "metadata": {
                "type": "object"
              },
              "spec": {
                "type": "object",
                "properties": {
                  "effect": {
                    "type": "string",
                    "enum": [
                      "Allow",
                      "Deny"
                    ]
                  },
                  "subjects": {
                    "type": "array",
                    "items": {
                      "description": "Authored subject (ADR-335 D4): a user by username, a group by the name the provider emits (for example /payments) or a workload identity. issuer defaults to the installation's issuer.",
                      "type": "object",
                      "properties": {
                        "kind": {
                          "type": "string",
                          "enum": [
                            "User",
                            "Group",
                            "Workload"
                          ]
                        },
                        "issuer": {
                          "type": "string",
                          "format": "uri"
                        },
                        "id": {
                          "type": "string",
                          "minLength": 1
                        }
                      },
                      "required": [
                        "kind",
                        "id"
                      ]
                    },
                    "minItems": 1,
                    "x-kubernetes-list-type": "map",
                    "x-kubernetes-list-map-keys": [
                      "kind",
                      "id"
                    ]
                  },
                  "roles": {
                    "type": "array",
                    "items": {
                      "type": "string",
                      "enum": [
                        "evidence-reader",
                        "workload-maintainer",
                        "evidence-owner",
                        "action-approver"
                      ]
                    },
                    "minItems": 1,
                    "x-kubernetes-list-type": "set"
                  },
                  "workloads": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "kind": {
                          "type": "string",
                          "enum": [
                            "Deployment",
                            "StatefulSet"
                          ]
                        },
                        "name": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 253,
                          "description": "Kubernetes object name (DNS subdomain)."
                        },
                        "uid": {
                          "type": "string",
                          "minLength": 1,
                          "description": "Kubernetes UID (a UUID; 64 characters leaves room for its textual forms)."
                        }
                      },
                      "required": [
                        "kind",
                        "name"
                      ],
                      "description": "Workload by kind and name; a recreated workload of the same name keeps its access. Optional uid pins one instance."
                    },
                    "minItems": 1,
                    "x-kubernetes-list-type": "map",
                    "x-kubernetes-list-map-keys": [
                      "kind",
                      "name"
                    ]
                  },
                  "notAfter": {
                    "type": "string",
                    "format": "date-time"
                  },
                  "reason": {
                    "type": "string",
                    "minLength": 1,
                    "description": "Optional."
                  },
                  "automation": {
                    "type": "object",
                    "properties": {
                      "allowedActions": {
                        "type": "array",
                        "items": {
                          "enum": [
                            "kubernetesSnapshot",
                            "logs",
                            "processSnapshot",
                            "fileRead",
                            "packetCapture",
                            "networkSnapshot",
                            "runtimeDiagnostic",
                            "kernelCore",
                            "liveCore",
                            "command",
                            "httpDiagnostic",
                            "artifactCollect",
                            "profile",
                            "syscallTrace"
                          ],
                          "type": "string"
                        },
                        "minItems": 1,
                        "maxItems": 14,
                        "x-kubernetes-list-type": "set"
                      },
                      "maxLifetimeSeconds": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 31536000
                      },
                      "maxExecutions": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 10000
                      },
                      "maxBytes": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 1099511627776
                      },
                      "maxObservedBytes": {
                        "type": "integer",
                        "minimum": 0,
                        "maximum": 1099511627776
                      },
                      "maxObservedEvents": {
                        "type": "integer",
                        "minimum": 0,
                        "maximum": 1000000000
                      }
                    },
                    "required": [
                      "allowedActions",
                      "maxLifetimeSeconds",
                      "maxExecutions",
                      "maxBytes",
                      "maxObservedBytes"
                    ]
                  }
                },
                "required": [
                  "effect",
                  "subjects",
                  "roles"
                ],
                "x-kubernetes-validations": [
                  {
                    "rule": "!has(self.automation) || (self.effect == \"Allow\" && self.subjects.all(s, s.kind == \"Group\") && \"workload-maintainer\" in self.roles)",
                    "message": "Automation requires an Allow binding for groups with the workload-maintainer role."
                  }
                ],
                "description": "Desired permission configuration. A successful write does not activate access; inspect current-generation status."
              },
              "status": {
                "type": "object",
                "properties": {
                  "phase": {
                    "type": "string",
                    "enum": [
                      "Pending",
                      "Ready",
                      "Disabled",
                      "Stale",
                      "UnsafeSource",
                      "Rejected"
                    ]
                  },
                  "observedGeneration": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "lastVerifiedAt": {
                    "type": "string",
                    "format": "date-time"
                  },
                  "reasons": {
                    "type": "array",
                    "items": {
                      "type": "string",
                      "minLength": 1
                    }
                  }
                },
                "required": [
                  "phase",
                  "observedGeneration"
                ]
              }
            }
          }
        }
      }
    ]
  }
}
