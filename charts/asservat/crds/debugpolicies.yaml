{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "debugpolicies.asservat.io"
  },
  "spec": {
    "group": "asservat.io",
    "scope": "Namespaced",
    "names": {
      "plural": "debugpolicies",
      "singular": "debugpolicy",
      "kind": "DebugPolicy",
      "categories": [
        "asservat"
      ]
    },
    "versions": [
      {
        "name": "v1alpha1",
        "served": true,
        "storage": true,
        "additionalPrinterColumns": [
          {
            "name": "Age",
            "type": "date",
            "jsonPath": ".metadata.creationTimestamp"
          }
        ],
        "schema": {
          "openAPIV3Schema": {
            "type": "object",
            "required": [
              "spec"
            ],
            "properties": {
              "apiVersion": {
                "type": "string"
              },
              "kind": {
                "type": "string"
              },
              "metadata": {
                "type": "object"
              },
              "spec": {
                "type": "object",
                "description": "Hub-held restart-trigger policy (ADR-228). The hub compiles and accepts only a single exit detector firing the pod-status context recipe on the triggering Pod; activation reports any other field with its path. Status is never authority.",
                "required": [
                  "target",
                  "detectors",
                  "when",
                  "recipeRef",
                  "budgets",
                  "retention",
                  "suspended",
                  "observation"
                ],
                "properties": {
                  "target": {
                    "type": "object",
                    "required": [
                      "cluster",
                      "namespace",
                      "workloadRef",
                      "maxPods",
                      "selection",
                      "adoption"
                    ],
                    "properties": {
                      "cluster": {
                        "type": "string",
                        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
                      },
                      "namespace": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 63
                      },
                      "workloadRef": {
                        "type": "object",
                        "required": [
                          "apiVersion",
                          "kind",
                          "name"
                        ],
                        "properties": {
                          "apiVersion": {
                            "type": "string",
                            "enum": [
                              "apps/v1"
                            ]
                          },
                          "kind": {
                            "type": "string",
                            "enum": [
                              "Deployment",
                              "StatefulSet"
                            ]
                          },
                          "name": {
                            "type": "string",
                            "minLength": 1,
                            "maxLength": 253
                          }
                        }
                      },
                      "maxPods": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 100
                      },
                      "selection": {
                        "type": "string",
                        "enum": [
                          "oldestReady",
                          "newest",
                          "allWithinLimit",
                          "lowestOrdinal",
                          "triggeringPod"
                        ]
                      },
                      "adoption": {
                        "type": "string",
                        "enum": [
                          "pinUID",
                          "followApprovedReplacement"
                        ]
                      }
                    }
                  },
                  "detectors": {
                    "type": "array",
                    "minItems": 1,
                    "maxItems": 16,
                    "items": {
                      "type": "object",
                      "required": [
                        "id",
                        "kind",
                        "options"
                      ],
                      "properties": {
                        "id": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 63
                        },
                        "kind": {
                          "type": "string",
                          "enum": [
                            "log",
                            "resource",
                            "probe",
                            "exit",
                            "alert",
                            "crashArtifact",
                            "schedule",
                            "file",
                            "network",
                            "kubernetes"
                          ]
                        },
                        "options": {
                          "type": "object",
                          "x-kubernetes-preserve-unknown-fields": true
                        },
                        "eventWindow": {
                          "type": "string",
                          "maxLength": 16,
                          "pattern": "^[1-9][0-9]*(ms|s|m|h|d)$"
                        }
                      }
                    }
                  },
                  "when": {
                    "type": "object",
                    "x-kubernetes-preserve-unknown-fields": true
                  },
                  "recipeRef": {
                    "type": "object",
                    "required": [
                      "name",
                      "digest"
                    ],
                    "properties": {
                      "name": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 63
                      },
                      "digest": {
                        "type": "string",
                        "pattern": "^[a-f0-9]{64}$"
                      }
                    }
                  },
                  "budgets": {
                    "type": "object",
                    "required": [
                      "cooldown",
                      "burst",
                      "maxOccurrencesPerHour",
                      "maxConcurrentActions"
                    ],
                    "properties": {
                      "cooldown": {
                        "type": "string",
                        "maxLength": 16,
                        "pattern": "^[1-9][0-9]*(ms|s|m|h|d)$"
                      },
                      "burst": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 10
                      },
                      "maxOccurrencesPerHour": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 1000
                      },
                      "maxConcurrentActions": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 10
                      }
                    }
                  },
                  "retention": {
                    "type": "string",
                    "maxLength": 16,
                    "pattern": "^[1-9][0-9]*(ms|s|m|h|d)$"
                  },
                  "suspended": {
                    "type": "boolean"
                  },
                  "observation": {
                    "type": "object",
                    "required": [
                      "mode"
                    ],
                    "properties": {
                      "mode": {
                        "type": "string",
                        "enum": [
                          "allAuthorized"
                        ]
                      },
                      "maxPods": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 1000
                      }
                    }
                  },
                  "evaluation": {
                    "type": "object",
                    "required": [
                      "scope",
                      "fireOnActivation",
                      "rearmFor"
                    ],
                    "properties": {
                      "scope": {
                        "type": "string",
                        "enum": [
                          "pod",
                          "workload"
                        ]
                      },
                      "fireOnActivation": {
                        "type": "boolean"
                      },
                      "rearmFor": {
                        "type": "string",
                        "maxLength": 16,
                        "pattern": "^[1-9][0-9]*(ms|s|m|h|d)$"
                      }
                    }
                  },
                  "recordingSaves": {
                    "type": "object",
                    "x-kubernetes-preserve-unknown-fields": true
                  }
                }
              }
            }
          }
        }
      }
    ]
  }
}
