{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "debugpolicies.asservat.io"
  },
  "spec": {
    "group": "asservat.io",
    "scope": "Namespaced",
    "names": {
      "plural": "debugpolicies",
      "singular": "debugpolicy",
      "kind": "DebugPolicy",
      "categories": [
        "asservat"
      ]
    },
    "versions": [
      {
        "name": "v1alpha1",
        "served": true,
        "storage": true,
        "additionalPrinterColumns": [
          {
            "name": "Age",
            "type": "date",
            "jsonPath": ".metadata.creationTimestamp"
          }
        ],
        "schema": {
          "openAPIV3Schema": {
            "type": "object",
            "required": [
              "spec"
            ],
            "properties": {
              "apiVersion": {
                "type": "string"
              },
              "kind": {
                "type": "string"
              },
              "metadata": {
                "type": "object"
              },
              "spec": {
                "type": "object",
                "description": "Hub-held policy with exactly one recipeRef or bounded profileComposition. The current compiler admits its supported detector/action subset before independently audited acceptance; persisted configuration and status are not execution authority. Composition override values retain their original JSON types for canonical field-specific validation.",
                "required": [
                  "target",
                  "detectors",
                  "when",
                  "budgets",
                  "retention",
                  "suspended",
                  "observation"
                ],
                "properties": {
                  "target": {
                    "type": "object",
                    "required": [
                      "cluster",
                      "namespace",
                      "workloadRef",
                      "maxPods",
                      "selection",
                      "adoption"
                    ],
                    "properties": {
                      "cluster": {
                        "type": "string",
                        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
                      },
                      "namespace": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 63
                      },
                      "workloadRef": {
                        "type": "object",
                        "required": [
                          "apiVersion",
                          "kind",
                          "name"
                        ],
                        "properties": {
                          "apiVersion": {
                            "type": "string",
                            "enum": [
                              "apps/v1"
                            ]
                          },
                          "kind": {
                            "type": "string",
                            "enum": [
                              "Deployment",
                              "StatefulSet"
                            ]
                          },
                          "name": {
                            "type": "string",
                            "minLength": 1,
                            "maxLength": 253
                          }
                        }
                      },
                      "maxPods": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 100
                      },
                      "selection": {
                        "type": "string",
                        "enum": [
                          "oldestReady",
                          "newest",
                          "allWithinLimit",
                          "lowestOrdinal",
                          "triggeringPod"
                        ]
                      },
                      "adoption": {
                        "type": "string",
                        "enum": [
                          "pinUID",
                          "followApprovedReplacement"
                        ]
                      }
                    }
                  },
                  "detectors": {
                    "type": "array",
                    "minItems": 1,
                    "maxItems": 16,
                    "items": {
                      "type": "object",
                      "required": [
                        "id",
                        "kind",
                        "options"
                      ],
                      "properties": {
                        "id": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 63
                        },
                        "kind": {
                          "type": "string",
                          "enum": [
                            "log",
                            "resource",
                            "probe",
                            "exit",
                            "alert",
                            "crashArtifact",
                            "schedule",
                            "file",
                            "network",
                            "kubernetes"
                          ]
                        },
                        "options": {
                          "type": "object",
                          "x-kubernetes-preserve-unknown-fields": true
                        },
                        "eventWindow": {
                          "type": "string",
                          "maxLength": 16,
                          "pattern": "^[1-9][0-9]*(ms|s|m|h|d)$"
                        }
                      }
                    }
                  },
                  "when": {
                    "type": "object",
                    "x-kubernetes-preserve-unknown-fields": true
                  },
                  "recipeRef": {
                    "type": "object",
                    "required": [
                      "name",
                      "digest"
                    ],
                    "properties": {
                      "name": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 63
                      },
                      "digest": {
                        "type": "string",
                        "pattern": "^[a-f0-9]{64}$"
                      }
                    }
                  },
                  "budgets": {
                    "type": "object",
                    "required": [
                      "cooldown",
                      "burst",
                      "maxOccurrencesPerHour",
                      "maxConcurrentActions"
                    ],
                    "properties": {
                      "cooldown": {
                        "type": "string",
                        "maxLength": 16,
                        "pattern": "^[1-9][0-9]*(ms|s|m|h|d)$"
                      },
                      "burst": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 10
                      },
                      "maxOccurrencesPerHour": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 1000
                      },
                      "maxConcurrentActions": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 10
                      }
                    }
                  },
                  "retention": {
                    "type": "string",
                    "maxLength": 16,
                    "pattern": "^[1-9][0-9]*(ms|s|m|h|d)$"
                  },
                  "suspended": {
                    "type": "boolean"
                  },
                  "observation": {
                    "type": "object",
                    "required": [
                      "mode"
                    ],
                    "properties": {
                      "mode": {
                        "type": "string",
                        "enum": [
                          "allAuthorized"
                        ]
                      },
                      "maxPods": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 1000
                      }
                    }
                  },
                  "evaluation": {
                    "type": "object",
                    "required": [
                      "scope",
                      "fireOnActivation",
                      "rearmFor"
                    ],
                    "properties": {
                      "scope": {
                        "type": "string",
                        "enum": [
                          "pod",
                          "workload"
                        ]
                      },
                      "fireOnActivation": {
                        "type": "boolean"
                      },
                      "rearmFor": {
                        "type": "string",
                        "maxLength": 16,
                        "pattern": "^[1-9][0-9]*(ms|s|m|h|d)$"
                      }
                    }
                  },
                  "recordingSaves": {
                    "type": "object",
                    "x-kubernetes-preserve-unknown-fields": true
                  },
                  "sharing": {
                    "type": "object",
                    "description": "Bounded recurring sharing (ADR-239): each of the policy's next maxCaptures captures until notAfter is shared with these recipients. Activation needs evidence:share and an evidence-owner group of the automation AccessBinding. Editing the policy stops sharing until the new revision is activated.",
                    "required": [
                      "recipients",
                      "notAfter",
                      "futureCaptures"
                    ],
                    "properties": {
                      "recipients": {
                        "type": "array",
                        "minItems": 1,
                        "maxItems": 8,
                        "items": {
                          "type": "object",
                          "required": [
                            "kind",
                            "issuer",
                            "id"
                          ],
                          "properties": {
                            "kind": {
                              "type": "string",
                              "enum": [
                                "User",
                                "Group"
                              ]
                            },
                            "issuer": {
                              "type": "string",
                              "maxLength": 2048
                            },
                            "id": {
                              "type": "string",
                              "minLength": 1,
                              "maxLength": 256
                            }
                          }
                        }
                      },
                      "notAfter": {
                        "type": "string",
                        "format": "date-time"
                      },
                      "futureCaptures": {
                        "type": "object",
                        "required": [
                          "enabled",
                          "maxCaptures"
                        ],
                        "properties": {
                          "enabled": {
                            "type": "boolean",
                            "enum": [
                              true
                            ]
                          },
                          "maxCaptures": {
                            "type": "integer",
                            "minimum": 1,
                            "maximum": 100
                          }
                        }
                      },
                      "outputSelection": {
                        "type": "object",
                        "x-kubernetes-preserve-unknown-fields": true
                      },
                      "maxArtifactsPerCapture": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 64
                      },
                      "reason": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 512
                      },
                      "management": {
                        "type": "object",
                        "x-kubernetes-preserve-unknown-fields": true
                      }
                    }
                  },
                  "profileComposition": {
                    "type": "object",
                    "required": [
                      "components",
                      "maxTotalBytes",
                      "maxDuration"
                    ],
                    "properties": {
                      "maxTotalBytes": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 1099511627776
                      },
                      "maxDuration": {
                        "type": "string",
                        "pattern": "^[1-9][0-9]*(ms|s|m|h|d)$",
                        "maxLength": 16
                      },
                      "components": {
                        "type": "array",
                        "items": {
                          "type": "object",
                          "properties": {
                            "id": {
                              "type": "string",
                              "pattern": "^[a-z][a-z0-9-]{0,23}$"
                            },
                            "profileRef": {
                              "type": "object",
                              "properties": {
                                "catalog": {
                                  "enum": [
                                    "builtin",
                                    "organization",
                                    "namespace"
                                  ],
                                  "type": "string"
                                },
                                "name": {
                                  "type": "string",
                                  "pattern": "^[a-z][a-z0-9-]{0,62}$"
                                },
                                "version": {
                                  "type": "string",
                                  "pattern": "^v[1-9][0-9]*$",
                                  "maxLength": 32
                                }
                              },
                              "required": [
                                "catalog",
                                "name",
                                "version"
                              ]
                            },
                            "overrides": {
                              "type": "array",
                              "items": {
                                "type": "object",
                                "required": [
                                  "actionID",
                                  "field",
                                  "value"
                                ],
                                "properties": {
                                  "actionID": {
                                    "type": "string",
                                    "minLength": 1,
                                    "maxLength": 63
                                  },
                                  "field": {
                                    "type": "string",
                                    "enum": [
                                      "packetPeers",
                                      "packetFilter",
                                      "packetBefore",
                                      "packetAfter",
                                      "packetRing",
                                      "processSelector",
                                      "processBatch",
                                      "profileDuration",
                                      "syscallFilter",
                                      "syscallMode",
                                      "syscallBefore",
                                      "syscallAfter",
                                      "syscallRing",
                                      "syscallArguments",
                                      "syscallMaxEvents",
                                      "syscallRate",
                                      "filePath",
                                      "commandArgv",
                                      "actionMaxBytes",
                                      "actionTimeout",
                                      "actionExecutionMode"
                                    ]
                                  },
                                  "value": {
                                    "x-kubernetes-preserve-unknown-fields": true
                                  }
                                }
                              },
                              "minItems": 0,
                              "maxItems": 32
                            }
                          },
                          "required": [
                            "id",
                            "profileRef"
                          ]
                        },
                        "minItems": 1,
                        "maxItems": 8
                      }
                    }
                  },
                  "grantRef": {
                    "type": "string",
                    "format": "uuid"
                  }
                },
                "oneOf": [
                  {
                    "required": [
                      "recipeRef"
                    ]
                  },
                  {
                    "required": [
                      "profileComposition"
                    ]
                  }
                ]
              }
            }
          }
        }
      }
    ]
  }
}
