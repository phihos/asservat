{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "clusteraccessbindings.asservat.io"
  },
  "spec": {
    "group": "asservat.io",
    "scope": "Cluster",
    "names": {
      "plural": "clusteraccessbindings",
      "singular": "clusteraccessbinding",
      "kind": "ClusterAccessBinding",
      "categories": [
        "asservat"
      ]
    },
    "versions": [
      {
        "name": "v1alpha1",
        "served": true,
        "storage": true,
        "subresources": {
          "status": {}
        },
        "additionalPrinterColumns": [
          {
            "name": "Phase",
            "type": "string",
            "jsonPath": ".status.phase"
          },
          {
            "name": "Observed",
            "type": "integer",
            "jsonPath": ".status.observedGeneration"
          },
          {
            "name": "Age",
            "type": "date",
            "jsonPath": ".metadata.creationTimestamp"
          }
        ],
        "schema": {
          "openAPIV3Schema": {
            "type": "object",
            "required": [
              "spec"
            ],
            "properties": {
              "apiVersion": {
                "type": "string"
              },
              "kind": {
                "type": "string"
              },
              "metadata": {
                "type": "object"
              },
              "spec": {
                "type": "object",
                "properties": {
                  "effect": {
                    "type": "string",
                    "enum": [
                      "Allow",
                      "Deny"
                    ]
                  },
                  "subjects": {
                    "type": "array",
                    "items": {
                      "description": "Authored subject (ADR-335 D4): a user by username, a group by the name the provider emits (for example /payments) or a workload identity. issuer defaults to the installation's issuer.",
                      "type": "object",
                      "properties": {
                        "kind": {
                          "type": "string",
                          "enum": [
                            "User",
                            "Group",
                            "Workload"
                          ]
                        },
                        "issuer": {
                          "type": "string",
                          "minLength": 1,
                          "description": "Compared literally with the verified issuer. PostgreSQL permission assignments store up to 2048 UTF-8 bytes."
                        },
                        "id": {
                          "type": "string",
                          "minLength": 1,
                          "description": "PostgreSQL permission assignments store up to 256 UTF-8 bytes."
                        }
                      },
                      "required": [
                        "kind",
                        "id"
                      ]
                    },
                    "minItems": 1,
                    "x-kubernetes-list-type": "map",
                    "x-kubernetes-list-map-keys": [
                      "kind",
                      "id"
                    ]
                  },
                  "roles": {
                    "type": "array",
                    "items": {
                      "type": "string",
                      "enum": [
                        "evidence-reader",
                        "workload-maintainer",
                        "evidence-owner",
                        "action-approver"
                      ]
                    },
                    "minItems": 1,
                    "x-kubernetes-list-type": "set"
                  },
                  "namespaceSelector": {
                    "type": "object",
                    "properties": {
                      "matchLabels": {
                        "type": "object",
                        "additionalProperties": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 63
                        },
                        "description": "Label values are at most 63 characters (Kubernetes label syntax). Not capped: the Kubernetes object size limit (about 1.5 MiB in etcd) bounds this list."
                      }
                    },
                    "required": [
                      "matchLabels"
                    ],
                    "description": "Optional; omitted selects every namespace outside system namespaces."
                  },
                  "clusters": {
                    "description": "Hub cluster only: cluster names or * for every joined cluster. Omitted: the binding's own cluster.",
                    "type": "array",
                    "items": {
                      "type": "string",
                      "pattern": "^(\\*|[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)$"
                    },
                    "minItems": 1,
                    "x-kubernetes-list-type": "set"
                  },
                  "notAfter": {
                    "type": "string",
                    "format": "date-time"
                  },
                  "reason": {
                    "type": "string",
                    "minLength": 1
                  }
                },
                "required": [
                  "effect",
                  "subjects",
                  "roles"
                ],
                "description": "Desired permission configuration. A successful write does not activate access; inspect current-generation status."
              },
              "status": {
                "type": "object",
                "properties": {
                  "phase": {
                    "type": "string",
                    "enum": [
                      "Pending",
                      "Ready",
                      "Disabled",
                      "Stale",
                      "UnsafeSource",
                      "Rejected"
                    ]
                  },
                  "observedGeneration": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "lastVerifiedAt": {
                    "type": "string",
                    "format": "date-time"
                  },
                  "reasons": {
                    "type": "array",
                    "items": {
                      "type": "string",
                      "minLength": 1
                    }
                  }
                },
                "required": [
                  "phase",
                  "observedGeneration"
                ]
              }
            }
          }
        }
      }
    ]
  }
}
