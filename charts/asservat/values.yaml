# One hub release per installation; one cluster release per workload cluster.
# combined is the single-cluster topology (hub and region in one cluster).
mode: hub

# The exact product image. Every product workload and hook Job uses it.
image:
  repository: ""
  # sha256:<64 hex>; the chart references the image only by digest.
  digest: ""
  pullPolicy: IfNotPresent
  # Existing dockerconfigjson Secrets in the release namespace.
  pullSecrets: []

installation:
  # Prefix of every object name; a DNS label of at most 30 characters.
  name: asservat

# The browser origin of the console and API, for example
# https://asservat.example.org. Ingress/HTTPRoute hosts are derived from it.
origin: ""

# Browser/MCP OpenID Connect identity of the hub (ADR-185). Clients, subjects
# and groups are stable issuer IDs. With bundled Keycloak, issuer and the
# console client are derived from services.identity.keycloak.
identity:
  issuer: ""
  clientID: ""
  # Audience of the console's access tokens; empty uses clientID.
  browserAudience: ""
  # Public PEM roots of the issuer (hub-api verifies its TLS and keys with
  # them). Required with an external provider; bundled Keycloak uses the
  # ca.crt of services.identity.keycloak.tlsSecretName.
  providerRootsPEM: ""
  # External identity provider: existing Secret with the console client's
  # OIDC secret. Bundled Keycloak uses `<name>-keycloak-state`.
  clientSecret:
    existingSecret: ""
    key: client-secret
  clients: []
  eligibleSubjects: []
  eligibleGroups: []
  groupMaxAgeSeconds: 300
  maxLifetimeSeconds: 28800
  maxLogins: 64
  maxSessions: 256
  maxLogoutEvents: 256
  # Optional protected manual-collection policy; without stepUp no
  # independent approval can be decided. ACR values are provider-specific.
  # approvals:
  #   stepUp: { acrValues: ["2"], maxAgeSeconds: 300 }
  #   requireRecordingApproval: true
  # Stable identities allowed to run processing initialization.
  # processingOperators:
  #   - { clientID: asservat-console, issuer: https://id.example/realms/org, kind: Group, id: GROUP-ID }

# Optional operator-declared organizations for privacy inventory reports.
# Omitted means undeclared; an explicit empty list declares none.
# processors:
#   - id: evidence-provider
#     name: Example organization
#     activities: ["Evidence storage"]
#     regions: []

# Optional lower history view/cache ceilings. Both values are required.
# captureHistory:
#   perSelector: 200
#   perInstallation: 10000

# How the console/API (hub-api, Service port 9445) is reached.
exposure:
  service:
    type: ClusterIP
    # Only with type NodePort.
    nodePort: null
    annotations: {}
  # ADR-327: pod terminates browser TLS in hub-api with tlsSecret; proxy lets
  # an Ingress/Gateway terminate it and forward to the Service.
  tls:
    mode: pod
  # Existing kubernetes.io/tls Secret for the origin (pod mode), for example
  # issued by cert-manager.
  tlsSecret: ""
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # TLS blocks copied verbatim; hosts default to the origin host.
    tls: []
  httpRoute:
    enabled: false
    # Gateway parentRefs copied verbatim.
    parentRefs: []
    annotations: {}

# Fleet enrollment identity and bounds.
fleet:
  issuer: ""
  clients: []
  subjects: []
  groups: []
  deliveryProfiles: []
  # Raised to the hub-issued slots (the combined-mode connector plus one per
  # clusters[] entry) when lower.
  maxActiveBootstraps: 1
  maxBootstrapHistory: 16
  maxClusters: 1

# Workload clusters joined with `mode: cluster` (hub or combined releases).
# The hub-api issues each one's bootstrap into the join Secret
# `<name>-join-<name>`, which the operator copies to that cluster.
clusters: []
# - name: payments-eu        # DNS label; names the join Secret
#   clusterID: ""            # a lowercase UUID you choose (uuidgen)
#   namespace: ""            # its release namespace; default: this one
#   standby: 2               # context-start standby connections
#   captures: 1              # concurrent captures

# How joined clusters reach this hub. TCP passthrough to the Services
# (LoadBalancer, NodePort or a TLS-passthrough route): connectors verify the
# in-cluster names, so never terminate TLS in front of them.
remote:
  federation: ""   # https://host:port -> <name>-federation:9446
  owners: ""       # host:port         -> <name>-hub-api-native:9444
  keyService: ""   # https://host:port -> <name>-key-service:9447
  objectStore: ""  # https://host:port -> the evidence object store

# Evidence capacity (specs/capacity.md). It is on when any value is set;
# every field is optional and changes apply on helm upgrade. Namespaces labelled asservat.io/evidence: disabled, system
# namespaces and the release namespace take no part.
capacity: {}
#   evidenceStorage: 128Gi     # default: the bundled store's volume size;
#                              # required for an external store
#   storageAssurance: bestEffort   # or qualifiedReservedBackend
#   capturesPerCluster: 8      # concurrent captures per cluster
#   namespaceLimit: 25%        # default: no namespace cap
#   workload:
#     share: 16Gi              # protected per workload; default 1/8 of the rest
#     limit: 10%               # protected share plus burst
#     dump: {burst: 1, minimumIntervalSeconds: 900}
#     maxConcurrentExpensive: 1
#     onFull: RejectNewExpensive   # or DeleteOldestEligibleInAccount

# Deployment/StatefulSet label and annotation keys only administrators may
# set (ADR-247), for workloadMetadata PermissionSources.
workloadKeys: {}
#   labels: []
#   annotations: []

# The hub's baseline retention policy (the former
# bootstrap.continuation.public.retentionBaseline: purposeRef, defaults,
# maxima, deletionBudgetSeconds). Set to render `<name>-baseline`.
retention: {}

# Public context execution also needs federation (former installer DTO
# field names). No credentials belong here.
# federation: {...}

# Regional connector (mode=cluster or mode=combined).
# mode=cluster: register the cluster in the hub's `clusters` values and copy
# the hub's join Secret `<name>-join-<cluster>` unchanged into this release's
# namespace; joinSecret names it. It carries the cluster and peer IDs, the
# hub's regional offer, the executor's object-store capabilities and the
# one-use bootstrap record, valid for five minutes from issuance (delete the
# hub's Secret to get a fresh one). The connector seeds its rotating cluster
# credential from that record once; keep the Secret for the other values.
# mode=combined: the connector uses the generated `<name>-ids` clusterID and
# peerID and reads its bootstrap record from bootstrapSecret (default
# `<name>-region-bootstrap`).
region:
  enabled: false
  # mode=cluster only: the copied join Secret.
  joinSecret: ""
  # mode=combined only.
  bootstrapSecret: ""
  # mode=combined only: the hub's offer ConfigMap in the release namespace
  # and the in-cluster addresses the connector dials. Empty values use the
  # chart's Service names.
  offerConfigMap: ""
  hub:
    federation: ""
    owners: ""
    keyService: ""
  # Regional context start (ADR-171), used when the offer names the
  # regional executor.
  executor:
    enabled: true
    concurrency: 4
    # Empty uses the API server's default token audience.
    capacityAudience: ""
    # mode=cluster: Secret with evidence-storage.json and
    # history-storage.json (and profile-authorization.json with
    # profileAuthorization); default: the join Secret. mode=combined uses
    # `<name>-s3-regional-write` and `<name>-s3-regional-history` (key
    # credentials.json).
    evidenceSecret: ""
    profileAuthorization: false
    # ADR-231: in-cluster Alertmanager base URL for alert policies.
    alertmanager: ""
    # ADR-245: identity mapping records (adds SubjectAccessReview create).
    identityMappings: []
    # ADR-285: administrator Go pprof endpoint templates and profiles.
    profileEndpoints: []
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  nodeSelector: {}
  tolerations: []

# ADR-246: the `asservat node` collector DaemonSet, with mode=cluster or
# mode=combined. Its namespace is the only one with the privileged Pod
# Security exception. Until the collector is qualified, every collector Pod
# mounts the host file /etc/asservat-disposable-host and checks it again.
collector:
  enabled: false
  namespace: asservat-collector
  # Collector-wide ceilings per node (bytes).
  ceilings:
    maxActiveSources: 16
    inputBytesPerSecond: 16777216
    inputBurstBytes: 16777216
    ringBytes: 268435456
    frozenBytes: 268435456
    uploadBytesPerSecond: 33554432
    uploadBurstBytes: 67108864
  # Node live-projection processing ceilings; null disables the mechanism.
  live: null
  # Optional encrypted-disk ring medium (ADR-278).
  ringDisk:
    enabled: false
    bytes: 1073741824

# Hub workloads (mode hub or combined). Every hub component renders in the
# release namespace; replicas: 0 stops one.
hub:
  hub-api:
    replicas: 1
    connections: 4
    concurrency: 2
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
    nodeSelector: {}
    tolerations: []
    # Owner native/operation listener for connectors and download workers.
    # ClusterIP for single-cluster installs; NodePort or LoadBalancer for
    # remote regions.
    nativeService:
      type: ClusterIP
      annotations: {}
      nodePorts: {}
      # nodePorts: {native: 31447, operation: 31449}
    # Download-worker namespaces in the hub cluster; empty uses <name>-downloads.
    workerNamespaces: []
    retentionTopologies: []
    # Remote regions' connector peers: {clusterID, peerID, rootsPEM}.
    peers: []
    public:
      standby: 2
      captures: 1
      previewSeconds: 120
      operationConcurrency: 8
      mcpPerIdentity: 2
      downloadConcurrency: 4
      downloadsPerIdentity: 2
      downloadMaxSeconds: 3600
      # Retention comes from the capacity qualification.
      operationAudit:
        normalConcurrency: 8
        resolutionConcurrency: 2
        perPrincipalConcurrency: 2
        normalPerSecond: 50
        resolutionPerSecond: 10
      downloadPlan:
        outputLimit: 268435456
        readLimit: 311164928
        requestLimit: 4
        durationSeconds: 300
      # Read the capacity processing source <name>-processing-source.
      processing: false
  hub-worker:
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
    nodeSelector: {}
    tolerations: []
    # Audience of the projected cluster-observation token (with capacity).
    clusterObservationAudience: asservat-cluster-observation
    # The permission child always runs: the hub cluster's AccessBindings in
    # every namespace (written by namespace RBAC, ADR-329), PermissionSources
    # of the release namespace, the browser/identity settings projections
    # and, with `retention`, the hub retention source.
    # Capacity, operation audit cleanup and expired context evidence deletion
    # run with `capacity`.
    permission:
      # Accounts that may write PermissionSource/AccessBinding status; empty
      # is the hub-worker's own account.
      statusUsers: []
      # Administrator-created initial review ConfigMap, needed only when
      # bindings exist at the first acceptance.
      review: ""
  federation:
    replicas: 1
    concurrency: 4
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
    nodeSelector: {}
    tolerations: []
    # ClusterIP for single-cluster installs; NodePort or LoadBalancer when
    # remote regions dial the federation directly.
    service:
      type: ClusterIP
      nodePort: null
      annotations: {}
    # Serving certificate (Secret `<name>-federation-tls`, keys tls.crt,
    # tls.key, ca.crt). existingSecret wins; else cert-manager issues it
    # when issuerRef.name is set; else the chart generates a CA and
    # certificate once and keeps them on upgrade.
    tls:
      existingSecret: ""
      # Extra serving names (the external endpoint regions dial).
      dnsNames: []
      issuerRef:
        name: ""
        kind: Issuer
        group: cert-manager.io
  # Artifact key service (9447); the only Pod with `<name>-artifact-key`.
  key-service:
    replicas: 1
    concurrency: 8
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
    nodeSelector: {}
    tolerations: []
    service:
      type: ClusterIP
      nodePort: null
      annotations: {}
    # As hub.federation.tls (Secret `<name>-key-service-tls`).
    tls:
      existingSecret: ""
      dnsNames: []
      issuerRef:
        name: ""
        kind: Issuer
        group: cert-manager.io
    # Acquisition unwraps for native downloads (ADR-204).
    downloads:
      # Native downloads need the key service to unwrap for the hub-local
      # download workers (hub.download-worker, enabled by default).
      enabled: true
      # Retention topology ConfigMaps by target cluster; the cluster catalog
      # adds joined regions.
      retentionTopologies: []
  # Asynchronous publication verifier (no listener).
  publisher:
    replicas: 1
    pollSeconds: 2
    batch: 8
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
    nodeSelector: {}
    tolerations: []
    retentionTopologies: []
  # Download workers (ADR-069) run as Jobs that hub-api dispatches into the
  # dedicated `<name>-downloads` namespace; Helm renders the namespace,
  # account, PriorityClass, the worker configuration and the dispatch Roles.
  # Their store capability is the Secret `<name>-s3-download-read` (key
  # credentials.json) in that namespace: generated with bundled SeaweedFS,
  # created by the operator for an external object store.
  download-worker:
    enabled: true
    cpuMillis: 500
    memoryBytes: 402653184
    maxRuntimeSeconds: 3600

# Generated Secrets (created once by the `secrets` hook, never rotated, kept
# on uninstall). Override one with an existing Secret of the same keys:
#   secrets:
#     ids: { existingSecret: my-ids }
#     sql-hub-api: { existingSecret: my-hub-api-sql }
# Keys: ids, audit-mac, artifact-key, sql-<component>, s3-<principal>.
secrets: {}

# Independently selectable dependencies. External choices are never
# provisioned or adopted by this chart.
services:
  keyService:
    provider: external
    # Used with provider external.
    external:
      endpoint: ""
      rootsPEM: ""
    openbao:
      image: ghcr.io/openbao/openbao@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
      persistence:
        storageClass: ""
        size: 8Gi
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: "2", memory: 512Mi}
  postgres:
    provider: external
    # Used with provider external. adminSecret names an existing Secret with
    # a `credentials.json` administrator login for `asservat setup`.
    external:
      host: ""
      port: 5432
      database: asservat
      rootsPEM: ""
      adminSecret: ""
    bundled:
      image: ""
      storageClass: ""
      dataSize: 64Gi
      backupSize: 64Gi
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: "2", memory: 1Gi}
      backupResources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {cpu: "1", memory: 256Mi}
  objectStore:
    provider: external
    # Used with provider external; the operator creates the s3-* Secrets.
    # bucket holds audit records; evidenceBucket (default: bucket) evidence.
    external:
      endpoint: ""
      region: ""
      bucket: ""
      evidenceBucket: ""
      rootsPEM: ""
    seaweedfs:
      image: chrislusf/seaweedfs@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
      # The S3 Service. NodePort or LoadBalancer when joined clusters
      # (clusters, remote.objectStore) write evidence.
      service:
        type: ClusterIP
        nodePort: null
        annotations: {}
      persistence:
        storageClass: ""
        size: 32Gi
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: "2", memory: 1Gi}
  identity:
    provider: external
    keycloak:
      image: quay.io/keycloak/keycloak@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41
      hostname: ""
      realm: asservat
      # Create an empty dedicated processing-operator group. A human gains no
      # such rights until an administrator deliberately assigns membership.
      processingOperators: false
      tlsSecretName: ""
      mcpRedirectURIs: []
      database:
        host: ""
        port: 5432
        name: keycloak
        user: keycloak
        credentialsSecretName: ""
        rootsSecretName: ""
        maxConnections: 5
      service:
        type: ClusterIP
        nodePort: 31451
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: "2", memory: 1Gi}
