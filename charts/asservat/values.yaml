image:
  repository: ghcr.io/phihos/asservat
  # "main" is the latest commit of the main branch. Every commit is also
  # published under its full commit hash; set that to pin a version. The
  # agents run the image of the same tag with "-agent" appended, which is
  # without the hub's viewers and a third smaller.
  tag: main
  pullPolicy: Always

# The hub: API, console, approvals and evidence storage. Install it in one
# cluster; set hub.enabled=false in the other clusters.
# debuginfod servers from which gdb fetches the debug information of
# stripped programs when a core dump is described, so that stacks show
# functions, files and lines instead of addresses. The default is the
# elfutils project's server, which asks the servers of Debian (and so of
# distroless images), Fedora, Arch and others, and Ubuntu's own, which it
# does not ask. The agents and the hub send these servers the build IDs of
# the programs whose cores they describe and of their libraries: 40
# hexadecimal digits each that name a compiled file, nothing of its
# memory. No public server knows Alpine, Wolfi, RHEL, Rocky, Alma or
# Amazon Linux. While servers are named here, the debug packages of these
# (not of Wolfi) are downloaded instead, from the distributions' own
# package servers (cdn-ubi.redhat.com, dl.rockylinux.org,
# repo.almalinux.org, cdn.amazonlinux.com, dl-cdn.alpinelinux.org), which
# learn the names of the packages asked for. While servers are named
# here, the core of a .NET program is described with its managed stacks:
# the runtime's helper library for that is downloaded from Microsoft's
# symbol server (msdl.microsoft.com, which redirects to
# *.blob.core.windows.net) and never taken from the workload's image;
# Microsoft learns the build ID of the runtime. Set to [] to ask no server
# and download nothing, as in a cluster without a way out; cores are then
# described without.
debuginfodURLs:
  - https://debuginfod.elfutils.org/
  - https://debuginfod.ubuntu.com/

hub:
  enabled: true
  # Members of these groups approve sensitive captures and manage clusters.
  adminGroups: [asservat-admins]
  # How long evidence is kept (Go duration).
  retention: 168h
  # Let an administrator approve their own sensitive capture. Enable it only
  # for installations with a single administrator.
  allowSelfApproval: false
  # What this cluster is called in Asservat: the name under which its own
  # agents join, shown wherever a cluster is chosen or named, as those of
  # hub.clusters are. Lowercase letters, digits, dashes or dots. Captures
  # and watches keep the name they were made under. Empty: the agents of
  # this cluster do not join.
  localCluster: local
  # The other clusters of the installation. The agents of each join with its
  # token: install the chart there with hub.enabled=false, agent.hubURL and
  # the same agent.token. Make one with "openssl rand -hex 32".
  #   - name: prod-eu
  #     token: <at least 32 random characters>
  clusters: []
  # Let watches wait for Prometheus alerts: the secret that Alertmanager
  # presents as bearer token when it notifies https://<hub-host>/api/alerts
  # (a webhook receiver). Empty: the hub accepts no alerts. Make one with
  # "openssl rand -hex 32".
  alertToken: ""
  # With the Prometheus operator: an AlertmanagerConfig that makes
  # Alertmanager send every alert to the hub, so that no receiver has to be
  # written by hand. It needs hub.alertToken. An Alertmanager passes such an
  # object only the alerts of the object's own namespace unless its
  # alertmanagerConfigMatcherStrategy is "None" (kube-prometheus-stack:
  # alertmanager.alertmanagerSpec.alertmanagerConfigMatcherStrategy.type).
  # The labels are those that its alertmanagerConfigSelector asks for.
  alertmanagerConfig:
    enabled: false
    labels: {}
  # Users with fixed bearer tokens. The names and groups are the subjects that
  # each cluster's RBAC is asked about (pods/exec in the namespace).
  #   - name: alice
  #     token: <at least 32 random characters>
  #     groups: [payments-devs]
  users: []
  # Accept ID tokens of an OIDC issuer as bearer tokens. With hub.ingress
  # enabled or a redirectURL, the console also offers to sign in there.
  oidc:
    issuer: ""
    clientID: ""
    # Only for a confidential client. A public client needs none.
    clientSecret: ""
    # Scopes of the console's sign-in. Add the scope your issuer needs to put
    # the groups claim into the ID token, often "groups". Some issuers refuse
    # scopes they do not know.
    scopes: [openid, profile]
    # Register this URL at the issuer. Empty: https://<hub.ingress.host>/auth/callback
    redirectURL: ""
    usernameClaim: preferred_username
    groupsClaim: groups
  database:
    # Secret with the key "dsn" holding a PostgreSQL connection string.
    # Empty: the chart runs its own single PostgreSQL instance.
    existingSecret: ""
  storage:
    # Evidence is encrypted by the hub before it is stored. Either a volume ...
    size: 20Gi
    storageClassName: ""
    # ... or an S3-compatible bucket (then no volume is created).
    s3:
      endpoint: ""          # host[:port]
      bucket: ""
      insecure: false       # plain HTTP
      existingSecret: ""    # keys "accessKey" and "secretKey"
  service:
    type: ClusterIP
    port: 80
    nodePort: null
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    tlsSecretName: ""
  # The hub's own figures for Prometheus, at /metrics on a port of their own
  # that the ingress does not reach: agents connected per cluster, captures
  # by state, stored evidence, open views. They name clusters and states, no
  # workload, namespace or person, and ask for no sign-in.
  metrics:
    enabled: false
    port: 9090
    # A ServiceMonitor for the Prometheus operator, with the labels that
    # your Prometheus selects ServiceMonitors by.
    serviceMonitor:
      enabled: false
      labels: {}
  # What the hub asks its node for. Measured idle: 2 millicores and 36 MiB.
  # No limit is set: a file that is open in a viewer is held by a program in
  # the hub's pod (150 MiB for a packet capture), and a core that is
  # described again takes gdb about as much as the description of one on a
  # node. Set limits that fit the largest files you record.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi

postgres:
  image: docker.io/library/postgres:17-alpine
  size: 2Gi
  storageClassName: ""
  # What the chart's own PostgreSQL asks its node for. Measured with a few
  # hundred captures: 10 millicores and 180 MiB. No limit is set.
  resources:
    requests:
      cpu: 20m
      memory: 256Mi

# The node agent: one pod per node that records evidence from the node's pods
# and uploads it to the hub. It uses the node's PID namespace and the
# capabilities SYS_ADMIN, SYS_PTRACE, NET_ADMIN, NET_RAW, SETUID and SETGID.
agent:
  enabled: true
  # URL of the hub. Empty: the hub of this release.
  hubURL: ""
  # Join token of this cluster, as the hub's values list it under
  # hub.clusters. Empty with hub.enabled: the local cluster's token.
  token: ""
  # Secret with the key "token", instead of agent.token.
  existingSecret: ""
  # PEM CA certificate of the hub, if its certificate is not publicly trusted.
  caCert: ""
  # Core dumps of crashed processes, for core dump watches. The agent then
  # replaces the node's kernel.core_pattern while it runs and restores it
  # when it stops. The cores of other crashes on the node go on to the
  # handler that the node had before (apport, systemd-coredump); a node that
  # wrote cores to files writes none of them meanwhile.
  coreHandler:
    enabled: false
    # Directory on the node for the handler and for cores until their upload.
    hostPath: /var/lib/asservat
  tolerations:
    - operator: Exists
  # What every node gives the agent. Measured idle: 1 millicore and 10 MiB.
  # No limit is set: while it records, the agent runs tcpdump, strace or gdb
  # and the sampling profiler (some 100 MiB), and a limit that is met ends
  # the recording, not only the agent. Set one that fits what you record.
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
