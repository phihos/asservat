# One hub release per installation; one cluster release per workload cluster.
# combined is the single-cluster topology (hub and region in one cluster).
mode: hub

# The exact product image. Every product workload and hook Job uses it.
image:
  repository: ""
  # sha256:<64 hex>; the chart references the image only by digest.
  digest: ""
  pullPolicy: IfNotPresent
  # Existing dockerconfigjson Secrets in the release namespace.
  pullSecrets: []

installation:
  # Prefix of every object name; a DNS label of at most 30 characters.
  name: asservat

# The browser origin of the console and API, for example
# https://asservat.example.org. Ingress/HTTPRoute hosts are derived from it.
origin: ""

# Browser/MCP OpenID Connect identity of the hub (ADR-185). Clients, subjects
# and groups are stable issuer IDs. With bundled Keycloak, issuer and the
# console client are derived from services.identity.keycloak.
identity:
  issuer: ""
  clientID: ""
  # Audience of the console's access tokens; empty uses clientID.
  browserAudience: ""
  # Public PEM roots of the issuer; empty uses the system roots.
  providerRootsPEM: ""
  # External identity provider: existing Secret with the console client's
  # OIDC secret. Bundled Keycloak uses `<name>-keycloak-state`.
  clientSecret:
    existingSecret: ""
    key: client-secret
  clients: []
  eligibleSubjects: []
  eligibleGroups: []
  groupMaxAgeSeconds: 300
  maxLifetimeSeconds: 28800
  maxLogins: 64
  maxSessions: 256
  maxLogoutEvents: 256
  # Optional protected manual-collection policy; without stepUp no
  # independent approval can be decided. ACR values are provider-specific.
  # approvals:
  #   stepUp: { acrValues: ["2"], maxAgeSeconds: 300 }
  #   requireRecordingApproval: true
  # Stable identities allowed to run processing initialization.
  # processingOperators:
  #   - { clientID: asservat-console, issuer: https://id.example/realms/org, kind: Group, id: GROUP-ID }
  # Trusted initial AccessBinding writer envelopes and their browser
  # permission previewers (stable issuer subject/group IDs).
  permissionDelegations: []

# Optional operator-declared organizations for privacy inventory reports.
# Omitted means undeclared; an explicit empty list declares none.
# processors:
#   - id: evidence-provider
#     name: Example organization
#     activities: ["Evidence storage"]
#     regions: []

# Optional lower history view/cache ceilings. Both values are required.
# captureHistory:
#   perSelector: 200
#   perInstallation: 10000

# How the console/API (hub-api, Service port 9445) is reached.
exposure:
  service:
    type: ClusterIP
    # Only with type NodePort.
    nodePort: null
    annotations: {}
  # ADR-327: pod terminates browser TLS in hub-api with tlsSecret; proxy lets
  # an Ingress/Gateway terminate it and forward to the Service.
  tls:
    mode: pod
  # Existing kubernetes.io/tls Secret for the origin (pod mode), for example
  # issued by cert-manager.
  tlsSecret: ""
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # TLS blocks copied verbatim; hosts default to the origin host.
    tls: []
  httpRoute:
    enabled: false
    # Gateway parentRefs copied verbatim.
    parentRefs: []
    annotations: {}

# Fleet enrollment identity and bounds.
fleet:
  issuer: ""
  clients: []
  subjects: []
  groups: []
  deliveryProfiles: []
  maxActiveBootstraps: 1
  maxBootstrapHistory: 16
  maxClusters: 1

# Initial capacity sources (the former bootstrap.continuation.public.capacity,
# same field names). Set to enable capacity; poolSpec and policySpec render
# the EvidenceStoragePool `pool` and EvidenceBudgetPolicy `policy`.
capacity: {}

# The hub's baseline retention policy (the former
# bootstrap.continuation.public.retentionBaseline: purposeRef, defaults,
# maxima, deletionBudgetSeconds). Set to render `<name>-baseline`.
retention: {}

# Public context execution also needs federation (former installer DTO
# field names). No credentials belong here.
# federation: {...}

# Regional connector (mode=cluster or mode=combined). Issue a cluster
# bootstrap in the console (Fleet), then set clusterID and peerID from the
# receipt and store the bootstrap record as `bootstrap.json` in an existing
# Secret named by bootstrapSecret. The connector seeds its rotating cluster
# credential from that record once, within the record's five minutes; after
# enrollment the record Secret may be deleted.
region:
  enabled: false
  clusterID: ""
  peerID: ""
  bootstrapSecret: ""
  # mode=cluster only: the hub's public regional-offer.json
  # (`--set-file region.offer=regional-offer.json`).
  offer: ""
  # mode=combined only: the hub's offer ConfigMap in the release namespace
  # and the in-cluster addresses the connector dials. Empty values use the
  # chart's Service names.
  offerConfigMap: ""
  hub:
    federation: ""
    owners: ""
    keyService: ""
  # Regional context start (ADR-171), used when the offer names the
  # regional executor.
  executor:
    enabled: true
    concurrency: 4
    # Empty uses the API server's default token audience.
    capacityAudience: ""
    # mode=cluster: existing Secret with evidence-storage.json and
    # history-storage.json (and profile-authorization.json with
    # profileAuthorization). mode=combined uses `<name>-s3-regional-write`
    # and `<name>-s3-regional-history` (key credentials.json).
    evidenceSecret: ""
    profileAuthorization: false
    # ADR-231: in-cluster Alertmanager base URL for alert policies.
    alertmanager: ""
    # ADR-245: identity mapping records (adds SubjectAccessReview create).
    identityMappings: []
    # ADR-285: administrator Go pprof endpoint templates and profiles.
    profileEndpoints: []
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  nodeSelector: {}
  tolerations: []

# ADR-246: the `asservat node` collector DaemonSet, with mode=cluster or
# mode=combined. Its namespace is the only one with the privileged Pod
# Security exception. Until the collector is qualified, every collector Pod
# mounts the host file /etc/asservat-disposable-host and checks it again.
collector:
  enabled: false
  namespace: asservat-collector
  # The exact product repository@sha256 digest of the collector image (built
  # with the gadget tag).
  image: ""
  registrySecret: ""
  installationID: ""
  clusterID: ""
  # The connector's node listener (port 8444), its server name and roots.
  connector:
    endpoint: ""
    serverName: ""
    rootsPEM: ""
  # Collector-wide ceilings per node (bytes).
  ceilings:
    maxActiveSources: 16
    inputBytesPerSecond: 16777216
    inputBurstBytes: 16777216
    ringBytes: 268435456
    frozenBytes: 268435456
    uploadBytesPerSecond: 33554432
    uploadBurstBytes: 67108864
  # Node live-projection processing ceilings; null disables the mechanism.
  live: null
  # Optional encrypted-disk ring medium (ADR-278).
  ringDisk:
    enabled: false
    bytes: 1073741824

# Hub workloads (mode hub or combined). Every hub component renders in the
# release namespace; replicas: 0 stops one.
hub:
  hub-api:
    replicas: 1
    connections: 4
    concurrency: 2
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
    nodeSelector: {}
    tolerations: []
    # Owner native/operation listener for connectors and download workers.
    # ClusterIP for single-cluster installs; NodePort or LoadBalancer for
    # remote regions.
    nativeService:
      type: ClusterIP
      annotations: {}
      nodePorts: {}
      # nodePorts: {native: 31447, operation: 31449}
    # Download-worker namespaces in the hub cluster; empty uses <name>-downloads.
    workerNamespaces: []
    retentionTopologies: []
    # Remote regions' connector peers: {clusterID, peerID, rootsPEM}.
    peers: []
    public:
      standby: 2
      captures: 1
      previewSeconds: 120
      operationConcurrency: 8
      mcpPerIdentity: 2
      downloadConcurrency: 4
      downloadsPerIdentity: 2
      downloadMaxSeconds: 3600
      # Retention comes from the capacity qualification.
      operationAudit:
        normalConcurrency: 8
        resolutionConcurrency: 2
        perPrincipalConcurrency: 2
        normalPerSecond: 50
        resolutionPerSecond: 10
      downloadPlan:
        outputLimit: 268435456
        readLimit: 311164928
        requestLimit: 4
        durationSeconds: 300
      # Read the capacity processing source <name>-processing-source.
      processing: false
  hub-worker:
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
    nodeSelector: {}
    tolerations: []
    # Audience of the projected cluster-observation token (with capacity).
    clusterObservationAudience: asservat-cluster-observation
    # Capture/operation audit cleanup; with capacity it runs unless
    # enabled is false.
    cleanup: {}
    # The permission child (AccessBindings, PermissionSources and the hub
    # retention source).
    permission:
      enabled: false
      # Accounts that may write PermissionSource/AccessBinding status.
      statusUsers: []
      # Writer envelopes (the former public.permissionDelegations shape).
      delegations: []
      # Administrator-created initial review ConfigMap, needed only when
      # bindings exist at the first acceptance.
      # review: ""
      # Runs the hub retention source; defaults to true when retention is set.
      # retention: true
      # Download worker configuration acceptance (ADR-204).
      # workerConfiguration: {namespace: asservat-downloads, source: asservat-worker-profile}
      # Expired context evidence deletion (ADR-205); the evidence store
      # defaults to the audit store.
      # contextDeletion: {evidenceStore: {endpoint: "", region: "", bucket: ""}}
      # browser: {settings: asservat-browser-settings}
      # identity: {settings: asservat-identity-settings, issuer: https://id.example/realms/org}
  federation:
    replicas: 1
    concurrency: 4
    resources: {}
    nodeSelector: {}
    tolerations: []
    # ClusterIP for single-cluster installs; NodePort or LoadBalancer when
    # remote regions dial the federation directly.
    service:
      type: ClusterIP
      nodePort: null
      annotations: {}
    tls:
      # Existing kubernetes.io/tls Secret with ca.crt; empty issues the
      # serving certificate from cert-manager (tls.issuerRef).
      existingSecret: ""
      # Extra serving names (the external endpoint regions dial).
      dnsNames: []
      issuerRef:
        name: ""
        kind: Issuer
        group: cert-manager.io
  key-service:
    replicas: 1
    concurrency: 8
    resources: {}
    nodeSelector: {}
    tolerations: []
    service:
      type: ClusterIP
      nodePort: null
      annotations: {}
    tls:
      existingSecret: ""
      dnsNames: []
      issuerRef:
        name: ""
        kind: Issuer
        group: cert-manager.io
    # Acquisition unwraps for native downloads (ADR-204).
    downloads:
      enabled: false
      # Retention topology ConfigMaps by target cluster; the cluster catalog
      # adds joined regions.
      retentionTopologies: []
  publisher:
    replicas: 1
    pollSeconds: 2
    batch: 8
    resources: {}
    nodeSelector: {}
    tolerations: []
    retentionTopologies: []
  # Download workers (ADR-069) run as Jobs that hub-api dispatches into the
  # dedicated `<name>-downloads` namespace; Helm renders the namespace,
  # account, PriorityClass, the worker configuration and the dispatch Roles.
  download-worker:
    enabled: true
    cpuMillis: 500
    memoryBytes: 402653184
    maxRuntimeSeconds: 3600

# Generated Secrets (created once by the `secrets` hook, never rotated, kept
# on uninstall). Override one with an existing Secret of the same keys:
#   secrets:
#     ids: { existingSecret: my-ids }
#     sql-hub-api: { existingSecret: my-hub-api-sql }
# Keys: ids, audit-mac, artifact-key, sql-<component>, s3-<principal>.
secrets: {}

# Independently selectable dependencies. External choices are never
# provisioned or adopted by this chart.
services:
  keyService:
    provider: external
    # Used with provider external.
    external:
      endpoint: ""
      rootsPEM: ""
    openbao:
      image: ghcr.io/openbao/openbao@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
      persistence:
        storageClass: ""
        size: 8Gi
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: "2", memory: 512Mi}
  postgres:
    provider: external
    # Used with provider external. adminSecret names an existing Secret with
    # a `credentials.json` administrator login for `asservat setup`.
    external:
      host: ""
      port: 5432
      database: asservat
      rootsPEM: ""
      adminSecret: ""
    bundled:
      image: ""
      storageClass: ""
      dataSize: 64Gi
      backupSize: 64Gi
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: "2", memory: 1Gi}
      backupResources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {cpu: "1", memory: 256Mi}
  objectStore:
    provider: external
    # Used with provider external; the operator creates the s3-* Secrets.
    # bucket holds audit records; evidenceBucket (default: bucket) evidence.
    external:
      endpoint: ""
      region: ""
      bucket: ""
      evidenceBucket: ""
      rootsPEM: ""
    seaweedfs:
      image: chrislusf/seaweedfs@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
      persistence:
        storageClass: ""
        size: 32Gi
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: "2", memory: 1Gi}
  identity:
    provider: external
    keycloak:
      image: quay.io/keycloak/keycloak@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41
      hostname: ""
      realm: asservat
      # Create an empty dedicated processing-operator group. A human gains no
      # such rights until an administrator deliberately assigns membership.
      processingOperators: false
      tlsSecretName: ""
      mcpRedirectURIs: []
      database:
        host: ""
        port: 5432
        name: keycloak
        user: keycloak
        credentialsSecretName: ""
        rootsSecretName: ""
        maxConnections: 5
      service:
        type: ClusterIP
        nodePort: 31451
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: "2", memory: 1Gi}
