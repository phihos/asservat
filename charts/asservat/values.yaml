# One hub release per installation; one cluster release per workload cluster.
# combined is the single-cluster evaluation topology.
mode: hub

# Runnable services are still being implemented. Enabling them is rejected,
# including when Helm's schema validation is explicitly skipped.
runtime:
  enabled: false

# Helm-native installation (docs/reviews/helm-native-install-plan.md).
installation:
  # Prefix of every object name; a DNS label of at most 30 characters.
  name: asservat

# The exact product image, referenced only by digest.
image:
  repository: ""
  # sha256:<64 hex>
  digest: ""
  pullPolicy: IfNotPresent
  # Existing dockerconfigjson Secrets in the release namespace.
  pullSecrets: []

# Hub workloads (mode hub or combined).
hub:
  hub-worker:
    # Off until the Helm-native hub replaces the installer path.
    enabled: false
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
    nodeSelector: {}
    tolerations: []
    # Audience of the projected cluster-observation token (with capacity).
    clusterObservationAudience: asservat-cluster-observation

# Initial capacity sources (the former bootstrap.continuation.public.capacity,
# same field names). Set to enable capacity; poolSpec and policySpec render
# the EvidenceStoragePool `pool` and EvidenceBudgetPolicy `policy`. The
# policy scope needs the clusterID of the `<name>-ids` Secret.
capacity: {}

# The hub's baseline retention policy (the former
# bootstrap.continuation.public.retentionBaseline: purposeRef, defaults,
# maxima, deletionBudgetSeconds). Set to render `<name>-baseline`.
retention: {}

# The hub-worker's capture/operation audit cleanup; with capacity it runs
# unless enabled is false.
cleanup: {}

# The hub-worker's permission child (AccessBindings, PermissionSources and
# the hub retention source).
permission:
  enabled: false
  # Accounts that may write PermissionSource/AccessBinding status.
  statusUsers: []
  # Writer envelopes (the former public.permissionDelegations shape).
  delegations: []
  # Administrator-created initial review ConfigMap, needed only when
  # bindings exist at the first acceptance.
  # review: ""
  # Runs the hub retention source; defaults to true when retention is set.
  # retention: true
  # Download worker configuration acceptance (ADR-204).
  # workerConfiguration: {namespace: asservat-downloads, source: asservat-worker-profile}
  # Expired context evidence deletion (ADR-205); the evidence store
  # defaults to the audit store.
  # contextDeletion: {evidenceStore: {endpoint: "", region: "", bucket: ""}}
  # browser: {settings: asservat-browser-settings}
  # identity: {settings: asservat-identity-settings, issuer: https://id.example/realms/org}

# Optional initial-installation checkpoint only; this starts no runtime service.
# The release namespace must already be a trusted Restricted bootstrap namespace.
bootstrap:
  enabled: false
  name: asservat
  targetNamespace: asservat-system
  # Keep this original verified image pin on later chart-only replays.
  image: ""
  registrySecret: ""
  probeAudience: ""
  # Optional explicit Kubernetes User/Group identities that may administer the
  # existing protected configuration after install. The exact runner is always
  # derived and added by the product. Omit for runner-only; this grants no
  # browser/evidence permissions. An explicit list must contain 1..31 actors.
  # administrators:
  #   - kind: User
  #     name: operator@example.org
  secrets:
    producer: ""
    schema: ""
    retirement: ""
  kubernetes:
    endpoint: https://kubernetes.default.svc
    rootsPEM: ""
  postgres:
    host: ""
    port: 5432
    database: asservat
    maxConnections: 2
    rootsPEM: ""
  auditStore:
    endpoint: ""
    region: ""
    bucket: ""
    rootsPEM: ""
  keyService:
    endpoint: ""
    auditMount: asservat-audit
    auditKey: audit
    rootsPEM: ""
  fleet:
    issuer: ""
    clients: []
    subjects: []
    groups: []
    deliveryProfiles: []
    maxActiveBootstraps: 1
    maxBootstrapHistory: 16
    maxClusters: 1
  # ADR-183: the in-cluster continuation after first activation. It runs as
  # the runner account, publishes provider recipes to a public outbox and
  # waits for `asservat installer-provider-apply` to write the inbox.
  continuation:
    enabled: false
    # Existing private TLS/OIDC material for automatic bundled-provider setup.
    # With bundled Keycloak its console secret is generated independently.
    materialSecretName: ""
    workerProvider:
      authMount: ""
      authMountAccessor: ""
    ownerProvider:
      authMount: ""
      authMountAccessor: ""
    ownerIssuerRootsPEM: ""
    ownerPKIMount: owner-pki
    ownerConnections: 4
    ownerConcurrency: 2
    # ADR-185 browser identity for the promoted hub-api; empty origin keeps an
    # observation-only owner. Clients, subjects and groups are stable IDs.
    public:
      origin: ""
      issuer: ""
      clientID: ""
      maxLifetimeSeconds: 28800
      maxLogins: 64
      maxSessions: 256
      maxLogoutEvents: 256
      clients: []
      eligibleSubjects: []
      eligibleGroups: []
      groupMaxAgeSeconds: 300
      # Optional operator-declared organizations for privacy inventory reports.
      # Omitted means undeclared; an explicit empty list declares none.
      # processors:
      #   - id: evidence-provider
      #     name: Example organization
      #     activities: ["Evidence storage"]
      #     regions: []
      # Public context execution also needs explicit capacity, processingOperators,
      # federation, promotion and retentionBaseline objects. They use the existing
      # installer DTO fields unchanged; omitted objects enable no additional role.
      # Capacity footprints and backend envelopes must describe the actual trial
      # services, not the synthetic installed-test profile. No credentials belong
      # in any of these public objects; private inputs use the operator inbox.
      # Optional protected manual-collection policy; without stepUp no
      # independent approval can be decided. ACR values are provider-specific.
      # approvals:
      #   stepUp: { acrValues: ["2"], maxAgeSeconds: 300 }
      #   requireRecordingApproval: true
      # Trusted initial AccessBinding writer envelopes and their browser
      # permission previewers (stable issuer subject/group IDs). These are
      # independent identities; preview access never grants Kubernetes writes.
      # Empty by default. Each envelope pins a cluster ID and namespace UID;
      # workloads: [] covers that namespace, otherwise pin each workload UID.
      # Changing a completed install's envelope needs a qualified guard revision,
      # not a chart-only replay; see docs/installation/helm.md.
      permissionDelegations: []
      # Optional lower history view/cache ceilings. Both values are required.
      # Omission retains 1,000 per selector and 100,000 per installation.
      # captureHistory:
      #   perSelector: 200
      #   perInstallation: 10000
  providers:
    issuerPolicy: asservat-install-issuer
    wrapRole: asservat-install-wrap
    wrapPolicy: asservat-install-encrypt
    unwrapRole: asservat-install-unwrap
    unwrapPolicy: asservat-install-decrypt

# ADR-193: with mode=cluster, a post-install/post-upgrade hook installs one
# regional connector through `asservat installer-cluster --in-cluster`. The
# external branch uses its release-scoped installer as trusted administrator.
# The selected bundled branch reuses the original hub bootstrap account.
cluster:
  enabled: false
  namespace: asservat-connector
  image: ""
  registrySecret: ""
  # Explicit same-API enrollment with the original bundled hub's trusted runner.
  # Use the exact bootstrapID issued through /fleet; this never issues one.
  # Manual offer/bootstrapSecret/evidenceSecret must stay empty in this mode.
  bundledHub: ""
  bootstrapID: ""
  offer: ""
  bootstrapSecret: ""
  # Existing operator Secret: evidence-storage.json is the write-only evidence
  # capability; history-storage.json is separately restricted to history metadata
  # read/write/inventory/delete. Both are required for a regional executor.
  evidenceSecret: ""
  # ADR-231: optional in-cluster Alertmanager base URL (http or https, no
  # credentials) that alert DebugPolicies on this cluster read, for example
  # http://alertmanager-operated.monitoring.svc:9093. Regional executor only.
  # It is a fixed regional input: changing it needs a connector reinstall.
  alertmanager: ""
  # ADR-245: identity mapping records for decision-time PermissionSources
  # (kubernetesExec, kubernetesAccessReview) whose identityMappingRef names
  # one. Each maps the hub's authenticated principal of `issuer` to this
  # cluster's Kubernetes identity: user = usernamePrefix + the OIDC subject,
  # groups = groupsPrefix + each current stable group ID (omit groupsPrefix to
  # send no groups), uid = the subject when uid is true. Match the cluster's
  # own OIDC authenticator; display names and e-mail are never used. With
  # records the connector account gains SubjectAccessReview create.
  # Regional executor only; changing them needs a connector reinstall.
  identityMappings: []
  # - name: company-oidc-to-cluster
  #   issuer: https://identity.example.invalid/realms/company
  #   usernamePrefix: "oidc:"
  #   groupsPrefix: "oidc:"
  # ADR-285: administrator Go pprof endpoint templates and profiles. A
  # template permits address modes and a port range; maintainers bind it to a
  # declared Pod port by name in a capture profile's endpointBindings (the
  # builtin go-cpu/v1 binds go-pprof-loopback to the port named diagnostics).
  # A profile fixes one address mode and port. Paths are the fixed
  # /debug/pprof allowlist; there is no URL, path, header or credential.
  # namespaces limits an entry to those namespace names (empty: all).
  # targetLoopback needs loopbackFamily. Previews resolve them without
  # dialing. Regional executor only; changing them needs a connector reinstall.
  # Optional tls: {serverName, rootsPEM} supplies explicit public certificate
  # roots (8 KiB per entry; existing 64 KiB aggregate JSON cap still applies).
  # Upgrade connectors before collectors; TLS needs a profileTLS-capable node.
  # TLS installed qualification is pending; authentication stays unsupported.
  # Optional credential: {audiences: [{clusterID, namespaceUID, workloadKind,
  # workloadUID}]} requires TLS. Private header values go in the existing
  # evidenceSecret's profile-authorization.json, never Helm values (ADR-302).
  profileEndpoints: []
  # - name: go-pprof-loopback
  #   kind: template
  #   addressModes: [targetLoopback]
  #   loopbackFamily: ipv4
  #   minPort: 6060
  #   maxPort: 6060

# ADR-246 (S-04 increment 3): the `asservat node` collector DaemonSet, with
# mode=cluster or mode=combined. Its namespace is the only one created with
# the privileged Pod Security exception; workload namespaces stay restricted.
# Off by default. Until the collector is qualified, every collector Pod mounts
# the host file /etc/asservat-disposable-host (hostPath type File) and the
# process checks it again, so the collector cannot start on a host without it.
# Only disposable CI runners and VM images create that file. In this version
# the collector probes its node and reports status; it records nothing.
collector:
  enabled: false
  namespace: asservat-collector
  # The exact product repository@sha256 digest of the collector image (built
  # with the gadget tag).
  image: ""
  registrySecret: ""
  installationID: ""
  clusterID: ""
  # The connector's node listener (port 8444), the name its server
  # certificate carries and the PEM roots that issued it. With cluster.enabled
  # leave all three empty: this release's cluster installer provisions the
  # listener and publishes them in the connector-nodes ConfigMap, read on the
  # next helm upgrade (the first install creates only namespace and account).
  connector:
    endpoint: ""
    serverName: ""
    rootsPEM: ""
  # The local administrator's collector-wide ceilings per node (bytes):
  # source rings, frozen snapshots awaiting upload, upload rate and burst. A
  # budget policy's node limits can only lower them. The container memory
  # limit is ringBytes + frozenBytes + 128 MiB.
  ceilings:
    # Development reference only; ongoing sources remain unqualified.
    maxActiveSources: 16
    inputBytesPerSecond: 16777216
    inputBurstBytes: 16777216
    ringBytes: 268435456
    frozenBytes: 268435456
    uploadBytesPerSecond: 33554432
    uploadBurstBytes: 67108864
  # Existing node live-projection processing ceilings; null disables the
  # mechanism. This is separate from hub delivery.liveRead viewer authority.
  live: null
  # Optional encrypted-disk ring medium (ADR-278). When enabled, the collector
  # gets a node-local emptyDir of exactly bytes; ring segments beyond the one
  # being written are sealed there with a per-ring in-memory key, so a restart
  # makes them unreadable. The collector admits disk rings only while they fit
  # in bytes, so the emptyDir limit (which would evict the Pod) is never hit.
  # Plans asking for ring.medium encryptedDisk get MediumUnavailable otherwise.
  ringDisk:
    enabled: false
    bytes: 1073741824

# Independently selectable dependencies. External choices use the existing
# bootstrap provider inputs and are never provisioned or adopted by this chart.
services:
  keyService:
    provider: external
    # Used with provider external.
    external:
      endpoint: ""
      rootsPEM: ""
    openbao:
      image: ghcr.io/openbao/openbao@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
      persistence:
        storageClass: ""
        size: 8Gi
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: "2", memory: 512Mi}
  postgres:
    provider: external
    # Used with provider external.
    external:
      host: ""
      port: 5432
      database: asservat
      rootsPEM: ""
    bundled:
      image: ""
      storageClass: ""
      dataSize: 64Gi
      backupSize: 64Gi
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: "2", memory: 1Gi}
      backupResources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {cpu: "1", memory: 256Mi}
  objectStore:
    provider: external
    # Used with provider external; the operator creates the s3-* Secrets.
    external:
      endpoint: ""
      region: ""
      bucket: ""
      rootsPEM: ""
    seaweedfs:
      image: chrislusf/seaweedfs@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
      persistence:
        storageClass: ""
        size: 32Gi
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: "2", memory: 1Gi}
  identity:
    provider: external
    keycloak:
      image: quay.io/keycloak/keycloak@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41
      hostname: ""
      realm: asservat
      # Create an empty dedicated processing-operator group. A human gains no
      # such rights until an administrator deliberately assigns membership.
      processingOperators: false
      tlsSecretName: ""
      mcpRedirectURIs: []
      database:
        host: ""
        port: 5432
        name: keycloak
        user: keycloak
        credentialsSecretName: ""
        rootsSecretName: ""
        maxConnections: 5
      service:
        type: ClusterIP
        nodePort: 31451
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: "2", memory: 1Gi}
