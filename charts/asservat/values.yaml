# One hub release per installation; one cluster release per workload cluster.
# combined is the single-cluster evaluation topology.
mode: hub

# Runnable services are still being implemented. Enabling them is rejected,
# including when Helm's schema validation is explicitly skipped.
runtime:
  enabled: false

# Optional initial-installation checkpoint only; this starts no runtime service.
# The release namespace must already be a trusted Restricted bootstrap namespace.
bootstrap:
  enabled: false
  name: asservat
  targetNamespace: asservat-system
  # Keep this original verified image pin on later chart-only replays.
  image: ""
  registrySecret: ""
  probeAudience: ""
  # Optional explicit Kubernetes User/Group identities that may administer the
  # existing protected configuration after install. The exact runner is always
  # derived and added by the product. Omit for runner-only; this grants no
  # browser/evidence permissions. An explicit list must contain 1..31 actors.
  # administrators:
  #   - kind: User
  #     name: operator@example.org
  secrets:
    producer: ""
    schema: ""
    retirement: ""
  kubernetes:
    endpoint: https://kubernetes.default.svc
    rootsPEM: ""
  postgres:
    host: ""
    port: 5432
    database: asservat
    maxConnections: 2
    rootsPEM: ""
  auditStore:
    endpoint: ""
    region: ""
    bucket: ""
    rootsPEM: ""
  keyService:
    endpoint: ""
    auditMount: asservat-audit
    auditKey: audit
    rootsPEM: ""
  fleet:
    issuer: ""
    clients: []
    subjects: []
    groups: []
    deliveryProfiles: []
    maxActiveBootstraps: 1
    maxBootstrapHistory: 16
    maxClusters: 1
  # ADR-183: the in-cluster continuation after first activation. It runs as
  # the runner account, publishes provider recipes to a public outbox and
  # waits for `asservat installer-provider-apply` to write the inbox.
  continuation:
    enabled: false
    # Existing private TLS/OIDC material for automatic bundled-provider setup.
    # With bundled Keycloak its console secret is generated independently.
    materialSecretName: ""
    workerProvider:
      authMount: ""
      authMountAccessor: ""
    ownerProvider:
      authMount: ""
      authMountAccessor: ""
    ownerIssuerRootsPEM: ""
    ownerPKIMount: owner-pki
    ownerConnections: 4
    ownerConcurrency: 2
    # ADR-185 browser identity for the promoted hub-api; empty origin keeps an
    # observation-only owner. Clients, subjects and groups are stable IDs.
    public:
      origin: ""
      issuer: ""
      clientID: ""
      maxLifetimeSeconds: 28800
      maxLogins: 64
      maxSessions: 256
      maxLogoutEvents: 256
      clients: []
      eligibleSubjects: []
      eligibleGroups: []
      groupMaxAgeSeconds: 300
      # Optional operator-declared organizations for privacy inventory reports.
      # Omitted means undeclared; an explicit empty list declares none.
      # processors:
      #   - id: evidence-provider
      #     name: Example organization
      #     activities: ["Evidence storage"]
      #     regions: []
      # Public context execution also needs explicit capacity, processingOperators,
      # federation, promotion and retentionBaseline objects. They use the existing
      # installer DTO fields unchanged; omitted objects enable no additional role.
      # Capacity footprints and backend envelopes must describe the actual trial
      # services, not the synthetic installed-test profile. No credentials belong
      # in any of these public objects; private inputs use the operator inbox.
      # Optional protected manual-collection policy; without stepUp no
      # independent approval can be decided. ACR values are provider-specific.
      # approvals:
      #   stepUp: { acrValues: ["2"], maxAgeSeconds: 300 }
      #   requireRecordingApproval: true
      # Trusted initial AccessBinding writer envelopes and their browser
      # permission previewers (stable issuer subject/group IDs). These are
      # independent identities; preview access never grants Kubernetes writes.
      # Empty by default. Each envelope pins a cluster ID and namespace UID;
      # workloads: [] covers that namespace, otherwise pin each workload UID.
      # Changing a completed install's envelope needs a qualified guard revision,
      # not a chart-only replay; see docs/installation/helm.md.
      permissionDelegations: []
      # Optional lower history view/cache ceilings. Both values are required.
      # Omission retains 1,000 per selector and 100,000 per installation.
      # captureHistory:
      #   perSelector: 200
      #   perInstallation: 10000
  providers:
    issuerPolicy: asservat-install-issuer
    wrapRole: asservat-install-wrap
    wrapPolicy: asservat-install-encrypt
    unwrapRole: asservat-install-unwrap
    unwrapPolicy: asservat-install-decrypt

# Object name prefix shared by every component (`<name>-<component>`).
installation:
  name: asservat

# The product image, pinned by digest (repository@digest).
image:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# Regional connector (mode=cluster or mode=combined). Issue a cluster
# bootstrap in the console (Fleet), then set clusterID and peerID from the
# receipt and store the bootstrap record as `bootstrap.json` in an existing
# Secret named by bootstrapSecret. The connector seeds its rotating cluster
# credential from that record once, within the record's five minutes; after
# enrollment the record Secret may be deleted.
region:
  enabled: false
  clusterID: ""
  peerID: ""
  bootstrapSecret: ""
  # mode=cluster only: the hub's public regional-offer.json
  # (`--set-file region.offer=regional-offer.json`).
  offer: ""
  # mode=combined only: the hub's offer ConfigMap in the release namespace
  # and the in-cluster addresses the connector dials. Empty values use the
  # chart's Service names.
  offerConfigMap: ""
  hub:
    federation: ""
    owners: ""
    keyService: ""
  # Regional context start (ADR-171), used when the offer names the
  # regional executor.
  executor:
    enabled: true
    concurrency: 4
    # Empty uses the API server's default token audience.
    capacityAudience: ""
    # mode=cluster: existing Secret with evidence-storage.json and
    # history-storage.json (and profile-authorization.json with
    # profileAuthorization). mode=combined uses `<name>-s3-regional-write`
    # and `<name>-s3-regional-history` (key credentials.json).
    evidenceSecret: ""
    profileAuthorization: false
    # ADR-231: in-cluster Alertmanager base URL for alert policies.
    alertmanager: ""
    # ADR-245: identity mapping records (adds SubjectAccessReview create).
    identityMappings: []
    # ADR-285: administrator Go pprof endpoint templates and profiles.
    profileEndpoints: []
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  nodeSelector: {}
  tolerations: []

# ADR-246: the `asservat node` collector DaemonSet, with mode=cluster or
# mode=combined and region.enabled. Its namespace is the only one created
# with the privileged Pod Security exception. Until the collector is
# qualified, every collector Pod mounts the host file
# /etc/asservat-disposable-host and the process checks it again.
collector:
  enabled: false
  namespace: asservat-collector
  # Collector-wide ceilings per node (bytes); a budget policy can only lower
  # them. The container memory limit is ringBytes + frozenBytes + 128 MiB.
  ceilings:
    maxActiveSources: 16
    inputBytesPerSecond: 16777216
    inputBurstBytes: 16777216
    ringBytes: 268435456
    frozenBytes: 268435456
    uploadBytesPerSecond: 33554432
    uploadBurstBytes: 67108864
  live: null
  ringDisk:
    enabled: false
    bytes: 1073741824

hub:
  # Download workers (ADR-069) run as Jobs that hub-api dispatches into the
  # dedicated `<name>-downloads` namespace; Helm renders the namespace,
  # account, PriorityClass, the worker configuration and the dispatch Roles.
  # Enable together with the Helm-rendered hub-api (it needs image.*).
  downloadWorker:
    enabled: false
    cpuMillis: 500
    memoryBytes: 402653184
    maxRuntimeSeconds: 3600

# Independently selectable dependencies. External choices use the existing
# bootstrap provider inputs and are never provisioned or adopted by this chart.
services:
  keyService:
    provider: external
    openbao:
      image: ghcr.io/openbao/openbao@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
      persistence:
        storageClass: ""
        size: 8Gi
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: "2", memory: 512Mi}
  postgres:
    provider: external
    bundled:
      image: ""
      storageClass: ""
      dataSize: 64Gi
      backupSize: 64Gi
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: "2", memory: 1Gi}
      backupResources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {cpu: "1", memory: 256Mi}
  objectStore:
    provider: external
    seaweedfs:
      image: chrislusf/seaweedfs@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
      persistence:
        storageClass: ""
        size: 32Gi
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: "2", memory: 1Gi}
  identity:
    provider: external
    keycloak:
      image: quay.io/keycloak/keycloak@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41
      hostname: ""
      realm: asservat
      # Create an empty dedicated processing-operator group. A human gains no
      # such rights until an administrator deliberately assigns membership.
      processingOperators: false
      tlsSecretName: ""
      mcpRedirectURIs: []
      database:
        host: ""
        port: 5432
        name: keycloak
        user: keycloak
        credentialsSecretName: ""
        rootsSecretName: ""
        maxConnections: 5
      service:
        type: ClusterIP
        nodePort: 31451
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: "2", memory: 1Gi}
