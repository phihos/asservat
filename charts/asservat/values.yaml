# One hub release per installation; one cluster release per workload cluster.
# combined is the single-cluster evaluation topology.
mode: hub

# Runnable services are still being implemented. Enabling them is rejected,
# including when Helm's schema validation is explicitly skipped.
runtime:
  enabled: false

# Optional initial-installation checkpoint only; this starts no runtime service.
# The release namespace must already be a trusted Restricted bootstrap namespace.
bootstrap:
  enabled: false
  name: asservat
  targetNamespace: asservat-system
  # Keep this original verified image pin on later chart-only replays.
  image: ""
  registrySecret: ""
  probeAudience: ""
  secrets:
    producer: ""
    schema: ""
    retirement: ""
  kubernetes:
    endpoint: https://kubernetes.default.svc
    rootsPEM: ""
  postgres:
    host: ""
    port: 5432
    database: asservat
    maxConnections: 2
    rootsPEM: ""
  auditStore:
    endpoint: ""
    region: ""
    bucket: ""
    rootsPEM: ""
  keyService:
    endpoint: ""
    auditMount: asservat-audit
    auditKey: audit
    rootsPEM: ""
  fleet:
    issuer: ""
    clients: []
    subjects: []
    groups: []
    deliveryProfiles: []
    maxActiveBootstraps: 1
    maxBootstrapHistory: 16
    maxClusters: 1
  # ADR-183: the in-cluster continuation after first activation. It runs as
  # the runner account, publishes provider recipes to a public outbox and
  # waits for `asservat installer-provider-apply` to write the inbox.
  continuation:
    enabled: false
    workerProvider:
      authMount: ""
      authMountAccessor: ""
    ownerProvider:
      authMount: ""
      authMountAccessor: ""
    ownerIssuerRootsPEM: ""
    ownerPKIMount: owner-pki
    ownerConnections: 4
    ownerConcurrency: 2
    # ADR-185 browser identity for the promoted hub-api; empty origin keeps an
    # observation-only owner. Clients, subjects and groups are stable IDs.
    public:
      origin: ""
      issuer: ""
      clientID: ""
      maxLifetimeSeconds: 28800
      maxLogins: 64
      maxSessions: 256
      maxLogoutEvents: 256
      clients: []
      eligibleSubjects: []
      eligibleGroups: []
      groupMaxAgeSeconds: 300
  providers:
    issuerPolicy: asservat-install-issuer
    wrapRole: asservat-install-wrap
    wrapPolicy: asservat-install-encrypt
    unwrapRole: asservat-install-unwrap
    unwrapPolicy: asservat-install-decrypt

# ADR-193: with mode=cluster, a post-install/post-upgrade hook installs one
# regional connector through `asservat installer-cluster --in-cluster`. The
# release-scoped installer account is the guards' trusted initial
# administrator. The bootstrap record stays in an operator-created Secret.
cluster:
  enabled: false
  namespace: asservat-connector
  image: ""
  registrySecret: ""
  offer: ""
  bootstrapSecret: ""
  # ADR-196: an existing operator Secret with evidence-storage.json, the
  # write-only regional evidence credential. Required exactly when the offer
  # names the regional executor.
  evidenceSecret: ""
  # ADR-231: optional in-cluster Alertmanager base URL (http or https, no
  # credentials) that alert DebugPolicies on this cluster read, for example
  # http://alertmanager-operated.monitoring.svc:9093. Regional executor only.
  # It is a fixed regional input: changing it needs a connector reinstall.
  alertmanager: ""

# ADR-246 (S-04 increment 3): the `asservat node` collector DaemonSet, with
# mode=cluster or mode=combined. Its namespace is the only one created with
# the privileged Pod Security exception; workload namespaces stay restricted.
# Off by default. Until the collector is qualified, every collector Pod mounts
# the host file /etc/asservat-disposable-host (hostPath type File) and the
# process checks it again, so the collector cannot start on a host without it.
# Only disposable CI runners and VM images create that file. In this version
# the collector probes its node and reports status; it records nothing.
collector:
  enabled: false
  namespace: asservat-collector
  # The exact product repository@sha256 digest of the collector image (built
  # with the gadget tag).
  image: ""
  registrySecret: ""
  installationID: ""
  clusterID: ""
  # The connector's node listener (port 8444), the name its server
  # certificate carries and the PEM roots that issued it.
  connector:
    endpoint: ""
    serverName: ""
    rootsPEM: ""
  # The local administrator's collector-wide ceilings per node (bytes):
  # source rings, frozen snapshots awaiting upload, upload rate and burst. A
  # budget policy's node limits can only lower them. The container memory
  # limit is ringBytes + frozenBytes + 128 MiB.
  ceilings:
    ringBytes: 268435456
    frozenBytes: 268435456
    uploadBytesPerSecond: 33554432
    uploadBurstBytes: 67108864
