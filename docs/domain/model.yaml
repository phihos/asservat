relations:
- source: ClusterRegistration
  target: WorkloadProjection
  cardinality: 1:N
  invariant: cluster identity; not ownership
- source: DebugPolicy
  target: PolicyActivation
  cardinality: 1:N
  invariant: successive immutable execution scopes
- source: PolicyActivation
  target: SourceSession
  cardinality: 1:N
  invariant: independently leased observed pod/action epochs
- source: Capture
  target: ActionAttempt
  cardinality: 1:N
  invariant: bounded action attempts
- source: Capture
  target: AcceptedScope
  cardinality: '1:1'
  invariant: protected immutable plan
- source: SourceSession
  target: SourceSnapshot
  cardinality: 1:N
  invariant: snapshot does not own recorder lifetime
- source: Capture
  target: SourceSnapshot
  cardinality: 1:N
  invariant: only ongoing actions or recording-save
- source: Case
  target: Occurrence
  cardinality: 1:N
  invariant: grouping does not grant access
- source: Occurrence
  target: Capture
  cardinality: '1:1'
  invariant: accepted event/manual operation
- source: Capture
  target: Artifact
  cardinality: 1:N
  invariant: zero artifacts permitted for failed capture
- source: Artifact
  target: ArtifactParent
  cardinality: 1:N
  invariant: acyclic lineage
- source: Artifact
  target: ArtifactCopy
  cardinality: 1:N
  invariant: every managed copy charged
- source: AnalysisRun
  target: Artifact
  cardinality: N:M
  invariant: authorize all input and output lineage
- source: SharingIntent
  target: SharingRegistration
  cardinality: 1:N
  invariant: bounded publication slots
