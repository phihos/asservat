  provided_ports:
  - SharingService
  - SharingFacet
  - PublicationTransaction
- id: C-18
  name: Analysis
  layer: application
  package_roots:
  - internal/application/analysis
  allowed_dependencies:
  - C-02
  - C-03
  - C-07
  - C-08
  - C-14
  - C-15
  - C-19
  - C-24
