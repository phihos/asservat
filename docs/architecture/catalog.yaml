  provided_ports:
  - SourceManager
  - SnapshotExecutor
  - SourceInventory
- id: C-13
  name: Live observation
  layer: application
  package_roots:
  - internal/application/live
  allowed_dependencies:
  - C-02
  - C-03
  - C-07
  - C-08
  - C-12
  - C-15
  - C-19
  - C-24
  responsibility: Finite view control, current-rights delivery, source projection, replay and loss.
  provided_ports:
  - LiveWatchService
  - LiveProjectionOwner
- id: C-14
  name: Evidence
  layer: application
  package_roots:
  - internal/application/evidence
  allowed_dependencies:
  - C-02
  - C-07
  - C-08
  - C-15
  - C-24
