components:
- id: C-01
  name: Configuration
  layer: application
  package_roots:
  - internal/application/configuration
  allowed_dependencies:
  - C-24
  responsibility: Kubernetes configuration projections from informers and mounted files, kept until replaced.
  provided_ports:
  - ConfigurationReader
  - PermissionReader
  - NamespaceReader
  - PermissionStore
  - RetentionSourceReader
  - RetentionListReader
  - RetentionWatcher
  - RetentionWatch
  - BindingWatcher
- id: C-02
  name: Identity
  layer: application
  package_roots:
  - internal/application/identity
  allowed_dependencies:
  - C-24
  responsibility: Validated actors, subject/group freshness and verified step-up context.
  provided_ports:
  - IdentityResolver
  - BrowserSessionStore
  - BrowserProvider
  - BrowserSettingsReader
  - CredentialCipher
  - LogoutVerifier
  - StepUpVerifier
- id: C-03
  name: Authorization
  layer: application
  package_roots:
  - internal/application/authorization
  allowed_dependencies:
  - C-01
  - C-02
  - C-24
  responsibility: One rights evaluator, retained audience, review grants and grant spend rules.
  provided_ports:
  - AuthorizationEvaluator
  - ContextDownloadAuthority
  - ContextDownloadCatalog
  - DownloadRetentionResolver
  - DownloadEnvironmentReader
  - ReviewService
  - GrantFacet
  - KeyOperationAuthorizer
  - KeyOperationBackend
  - KeyMaterialReader
  - KeyConfigurationLedger
  - KeyService
- id: C-04
  name: Fleet
  layer: application
  package_roots:
  - internal/application/fleet
  allowed_dependencies:
  - C-01
  - C-02
  - C-08
  - C-24
  responsibility: Per-cluster registration from Helm values, connector ServiceAccount-token authentication, connection routing, compatibility and reported capabilities.
  provided_ports:
  - ConnectionRegistry
  - ConnectorAuthenticator
  - PeerVerifier
  - CapabilityReader
  - PeerRegistry
  - PeerAuthenticator
  - CertificateIssuer
  - AdministrationReader
  - BootstrapCredentials
- id: C-05
  name: Targets
  layer: application
  package_roots:
  - internal/application/targets
  allowed_dependencies:
  - C-01
  - C-24
  responsibility: Resolve current whole-pod workloads, immutable runtime identity and dynamic peers.
  provided_ports:
  - TargetResolver
  - PodResolver
  - PeerResolver
- id: C-06
  name: Planning
  layer: application
  package_roots:
  - internal/application/planning
  allowed_dependencies:
  - C-01
  - C-05
  - C-24
  responsibility: Profile composition, typed plans, guidance, impact assessment and execution-mode split without acquisition.
  provided_ports:
  - PlanCompiler
  - AssessmentService
  - GuidanceService
- id: C-07
  name: Capacity
  layer: application
  package_roots:
  - internal/application/capacity
  allowed_dependencies:
  - C-01
  - C-24
  responsibility: Per-workload live-count quotas, rate limits, fair scheduling and idempotent charge release.
  provided_ports:
  - CapacityFacet
  - LocalAdmission
  - FairScheduler
  - ContextStorageBindings
  - CapacityPermissionReader
  - CapacityWorkloadReader
- id: C-08
  name: Audit
  layer: application
  package_roots:
  - internal/application/audit
  allowed_dependencies:
  - C-24
  responsibility: Append-only audit rows in the effect transaction, batched export and partition retention.
  provided_ports:
  - AuditWriter
  - AuditExporter
- id: C-09
  name: Capture
  layer: application
  package_roots:
  - internal/application/capture
  allowed_dependencies:
  - C-02
  - C-03
  - C-04
  - C-05
  - C-06
  - C-07
  - C-08
  - C-15
  - C-17
  - C-19
  - C-24
  responsibility: Authenticated preview/accept/cancel, immutable operation identity and per-action progress.
  provided_ports:
  - CaptureService
  - AdmissionTransaction
  - ContextAdmissionReplay
  - CaptureReader
  - PolicySourceWriter
  - PolicySourceReader
  - PolicyAcceptor
- id: C-10
  name: Monitoring
  layer: application
  package_roots:
  - internal/application/monitoring
  allowed_dependencies:
  - C-03
  - C-05
  - C-06
  - C-07
  - C-08
  - C-19
  - C-24
  responsibility: Policy activation, bounded sensors/trigger evaluation, correlation, rearm and suppression.
  provided_ports:
  - PolicyController
  - TriggerEvaluator
  - SignalSink
- id: C-11
  name: Execution
  layer: application
  package_roots:
  - internal/application/execution
  allowed_dependencies:
  - C-02
  - C-06
  - C-03
  - C-04
  - C-07
  - C-08
  - C-12
  - C-14
  - C-24
  responsibility: Start disposition by operation ID (`capture_start` row), bounded action DAG, target recheck and cancellation.
  provided_ports:
  - ExecutionDispatcher
  - StartJournal
  - ActionExecutor
  - ContextCollector
- id: C-12
  name: Recording
  layer: application
  package_roots:
  - internal/application/recording
  allowed_dependencies:
  - C-03
  - C-07
  - C-08
  - C-15
  - C-24
