  layer: application
  package_roots:
  - internal/application/privacy
  allowed_dependencies:
  - C-01
  - C-07
  - C-08
  - C-24
  responsibility: Retention resolution, managed-copy registration/lifecycle, restriction, cleanup verification and tombstones.
  provided_ports:
  - RetentionResolver
  - RetentionShortener
  - RetentionLedger
  - LifecyclePublisher
  - LifecycleWriter
  - RetentionReader
  - RetainedPolicyReader
  - PolicySnapshotReader
  - CopyLedger
