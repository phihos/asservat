components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: __Host-asservat-session
    DownloadOAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth access token; audience/client and evidence:download checked
  schemas:
    McpInput_activate_policy:
      type: object
      additionalProperties: false
      properties:
        grant_id:
          type: string
          format: uuid
          description: Explicit approved grant to attach as a current team manager after acceptance audit; never reissues authority or refills spend.
        policy_name:
          type: string
          minLength: 1
          maxLength: 253
          pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
        sharing_reviewed:
          type: boolean
          description: Accept the reviewed recurring sharing of a DebugPolicy with spec.sharing
            (ADR-239). Without it such a policy is not activated; the reply SharingReviewRequired
            states that repeated collections will be shared, with whom, how many captures
            and until when.
      required:
      - policy_name
      - idempotency_key
    McpOutput_activate_policy:
      allOf:
      - $ref: https://asservat.io/spec/v1/mcp-result.schema.json
      - oneOf:
        - type: object
          properties:
            status:
              const: ok
            data:
              type: object
              additionalProperties: false
              properties:
                policy_uid:
                  type: string
                  minLength: 1
                  maxLength: 64
                acceptance_id:
                  type: string
                  format: uuid
                state:
                  enum:
                  - active
                  - pendingAudit
                expires_at:
                  type: string
                  format: date-time
                max_executions:
                  type: integer
                  minimum: 1
                  maximum: 10000
                replay:
                  type: boolean
                sharing:
                  type: object
                  additionalProperties: false
                  description: 'Recurring sharing of this acceptance (ADR-239): repeated
                    collections will be shared with these recipients, at most max_captures
                    captures, until not_after.'
                  properties:
                    statement:
                      const: Repeated collections will be shared
                    recipients:
                      type: integer
                      minimum: 1
                      maximum: 8
                    max_captures:
                      type: integer
                      minimum: 1
                      maximum: 100
                    not_after:
                      type: string
                      format: date-time
                  required:
                  - statement
                  - recipients
                  - max_captures
                  - not_after
              required:
              - policy_uid
              - acceptance_id
              - state
              - expires_at
              - max_executions
              - replay
          required:
          - status
          - data
        - type: object
          properties:
            status:
              const: error
            data:
              type: object
              additionalProperties: false
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 64
                message:
                  type: string
                  minLength: 1
                  maxLength: 1024
                retryable:
                  type: boolean
                navigation_uri:
                  type: string
                  format: uri
                  maxLength: 2048
                responsible_role:
                  enum:
                  - maintainer
                  - approver
                  - administrator
                  - none
                retry_after_seconds:
                  type: integer
                  minimum: 1
                  maximum: 60
              required:
              - code
              - message
              - retryable
          required:
          - status
          - data
    McpInput_deactivate_policy:
      type: object
      additionalProperties: false
      properties:
        policy_name:
          type: string
          minLength: 1
          maxLength: 253
          pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - policy_name
      - idempotency_key
    McpOutput_deactivate_policy:
      allOf:
      - $ref: https://asservat.io/spec/v1/mcp-result.schema.json
      - oneOf:
        - type: object
          properties:
            status:
              const: ok
            data:
              type: object
              additionalProperties: false
              properties:
                policy_uid:
                  type: string
                  minLength: 1
                  maxLength: 64
                acceptance_id:
                  type: string
                  format: uuid
                state:
                  const: deactivated
                replay:
                  type: boolean
              required:
              - policy_uid
              - acceptance_id
              - state
              - replay
          required:
          - status
          - data
        - type: object
          properties:
            status:
              const: error
            data:
              type: object
              additionalProperties: false
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 64
                message:
                  type: string
                  minLength: 1
                  maxLength: 1024
                retryable:
                  type: boolean
                navigation_uri:
                  type: string
                  format: uri
                  maxLength: 2048
                responsible_role:
                  enum:
                  - maintainer
                  - approver
                  - administrator
                  - none
                retry_after_seconds:
                  type: integer
                  minimum: 1
                  maximum: 60
              required:
              - code
              - message
              - retryable
          required:
          - status
          - data
    McpInput_get_policy_status:
      type: object
      additionalProperties: false
      properties:
        policy_name:
          type: string
          minLength: 1
          maxLength: 253
          pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
      required:
      - policy_name
    McpOutput_get_policy_status:
      allOf:
      - $ref: https://asservat.io/spec/v1/mcp-result.schema.json
      - oneOf:
        - type: object
          properties:
            status:
              const: ok
            data:
              type: object
              additionalProperties: false
              properties:
                attached_grant_id:
                  type: string
                  format: uuid
                  description: Grant named by the current attachment pointer; does not assert that its authority, budget or recorder readiness currently permits collection.
                collection_kind:
                  enum:
                  - podStatus
                  - packetCapture
                  description: Accepted collection action; controls available approval commands, not acquisition authority.
                policy_uid:
                  type: string
                  minLength: 1
                  maxLength: 64
                acceptance_id:
                  type: string
                  format: uuid
                state:
                  enum:
                  - active
                  - deactivated
                  - suspended
                  - changed
                  - expired
                  - deleted
                generation:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                expires_at:
                  type: string
                  format: date-time
                executor:
                  type: object
                  additionalProperties: false
                  properties:
                    kind:
                      const: policy
                    policy_uid:
                      type: string
                      minLength: 1
                      maxLength: 64
                  required:
                  - kind
                  - policy_uid
                collected_bytes_spent:
                  type: integer
                  minimum: 0
                  maximum: 1099511627776
                  description: Conservative native-output reservations shared by this acceptance; uncertain spend remains charged. Not measured bytes.
                max_collected_bytes:
                  type: integer
                  minimum: 0
                  maximum: 1099511627776
                  description: Original accepted cumulative native-output ceiling, shared across grant replacements and controls.
