      operationId: cancel_capture
      summary: Cancel remaining work under current requester/maintainer authority.
        Does not erase evidence or revoke shares, and cannot undo started application
        work.
      tags:
      - Shared browser and MCP
      x-domain-contract: cancel_capture
      x-effect: command
      requestBody:
        required: true
        content:
          application/json:
            schema:
