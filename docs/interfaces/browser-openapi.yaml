      - anyOf:
        - type: object
          properties:
            status:
              const: ok
            data:
              type: object
              additionalProperties: false
              properties:
                capture_mode:
                  enum:
                  - networkHeaders
                  - rawPackets
                fields:
                  type: array
                  items:
                    type: string
                    enum:
                    - packet_index
                    - packet_time
                    - captured_length
                    - wire_length
                    - source_address
                    - destination_address
                    - source_port
                    - destination_port
                    - protocol
                    - tcp_flags
                    - tcp_seq
                    - tcp_ack
                    - tcp_window
                    - icmp_type
                    - icmp_code
                    - frame_prefix_hex
                  minItems: 1
                  uniqueItems: true
                rows:
                  type: array
                  items:
                    type: array
                    minItems: 1
                    items:
                      type:
                      - string
                      - integer
                      - 'null'
                      minimum: 0
                      maximum: 9007199254740991
                  description: Exactly one cell per selected field. Fixed field types, canonical values and null availability are independently validated; zero is not null.
                scanned_bytes:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                  description: Captured bytes of saved records visited by this call, including nonmatches.
                scanned_packets:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                row_limit_reached:
                  type: boolean
                scan_limit_reached:
                  type: boolean
                output_limit_reached:
                  type: boolean
                query_observed_at:
                  type: string
                  format: date-time
                  description: Server time of this prepared query snapshot. This observation does not renew query or request authority. Together with query_expires_at it bounds managed-view lifetime independently of the client wall clock.
                query_expires_at:
                  type: string
                  format: date-time
                  description: Original total query cutoff, irreversibly shortened by effective evidence access. A status read never extends it. Managed views clear by this cutoff or earlier on scope loss or closure; this cannot recall external copies. Distinct from the current request disclosure deadline.
              required:
              - capture_mode
              - fields
              - rows
              - scanned_bytes
              - scanned_packets
              - row_limit_reached
              - scan_limit_reached
              - output_limit_reached
              - query_observed_at
              - query_expires_at
              allOf:
              - if:
                  properties:
                    capture_mode:
                      const: networkHeaders
                  required:
                  - capture_mode
                then:
                  properties:
                    fields:
                      not:
                        contains:
