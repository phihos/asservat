  /api/v1/events:
    get:
      operationId: stream_status_events
      summary: One Server-Sent Events stream per page. Pushes each change of the listed
        captures, grants and downloads and of the caller's own pending queries as
        soon as it commits (PostgreSQL NOTIFY), and the current state of each once
        on connect and reconnect. The console sends no status polls. Every event is
        authorized under the decision reused for at most 30 s (ADR-311); a revoked
        reader receives a final accessLost event and the stream closes. Status events
        are never charged.
      tags:
      - Human console
      x-required-role: signed-in
      x-effect: read
      parameters:
      - name: capture_id
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
      - name: grant_id
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
      - name: download_id
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
      responses:
        '200':
          description: 'text/event-stream. Each message has `event: <type>` and one
            StatusEvent JSON document as `data`. A reconnect resynchronizes current
            state once; no history is replayed.'
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StatusEvent'
        default:
          description: Transport or application failure, nondisclosing before access
            is established.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/live/watches/{watch_id}/events:
    get:
      operationId: stream_live_watch
      summary: One Server-Sent Events stream per live watch delivering rows, gaps
        and state changes (pause, filter change, expiry, revocation, termination).
        Bounded by the watch deadline and output budget; closing the stream does not
        close the watch. A reconnect sends Last-Event-ID and resumes after that event
        within the replay buffer, otherwise from the current head with a gap. Never
        renews the watch deadline.
      tags:
      - Shared browser and MCP
      x-required-role: signed-in
      x-effect: read
      parameters:
      - name: watch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: 'text/event-stream. Each message has `id: <event_id>`, `event:
            row|gap|state` and one live-watch event JSON document as `data`.'
          content:
            text/event-stream:
              schema:
