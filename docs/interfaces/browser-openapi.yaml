  /api/v1/operations/stop_future_sharing:
    post:
      operationId: stop_future_sharing
      summary: Stop the future sharing of a recurring policy sharing (sharing_intent_id
        = the policy's acceptance_id from get_policy_status, expected_revision 1).
        No further capture is shared; captures already selected for sharing still
        publish their shares before the end, and existing shares stay until they expire
        or are revoked (revoke_share with the same sharing_intent_id revokes them).
        For its creator, a current member of a managing owner team or an installation
        administrator; it changes no collection authority.
      tags:
      - Shared browser and MCP
      x-domain-contract: stop_future_sharing
      x-effect: command
      requestBody:
