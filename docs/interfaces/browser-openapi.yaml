              - if:
                  properties:
                    row_limit_reached:
                      const: true
                  required:
                  - row_limit_reached
                then:
                  properties:
                    scan_limit_reached:
                      const: false
                    output_limit_reached:
                      const: false
              - if:
                  properties:
                    scan_limit_reached:
                      const: true
                  required:
                  - scan_limit_reached
                then:
                  properties:
                    row_limit_reached:
                      const: false
                    output_limit_reached:
                      const: false
              - if:
                  properties:
                    output_limit_reached:
                      const: true
                  required:
                  - output_limit_reached
                then:
                  properties:
                    row_limit_reached:
                      const: false
                    scan_limit_reached:
                      const: false
          required:
          - status
          - data
          allOf:
          - if:
              properties:
                data:
                  properties:
                    capture_mode:
                      const: rawPackets
                  required:
                  - capture_mode
              required:
              - data
            then:
              properties:
                data_class:
                  const: raw
            else:
              properties:
