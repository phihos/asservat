    McpInput_query_artifact:
      type: object
      additionalProperties: false
      properties:
        operation:
          enum:
          - packets
          - syscalls
          - memory
          - debugger
          description: Selects the operation; each value has its own strict argument set.
        case_id:
          type: string
          format: uuid
        artifact_id:
          type: string
          format: uuid
        grant_id:
          type: string
          format: uuid
          description: Optional. Current covering grants are reused automatically; the equivalent Kubernetes right on the workload (pods/exec) also suffices (ADR-335 D5). Name a grant only to select among several.
        idempotency_key:
          type: string
          minLength: 1
        fields:
          type: array
          items:
            type: string
            enum:
            - packet_index
            - packet_time
            - captured_length
            - wire_length
            - source_address
            - destination_address
            - source_port
            - destination_port
            - protocol
            - tcp_flags
            - tcp_seq
            - tcp_ack
            - tcp_window
            - icmp_type
            - icmp_code
            - frame_prefix_hex
          minItems: 1
          uniqueItems: true
        packet_filter:
          type: string
          description: 'tcpdump/libpcap packet filter under the acquisition rules (specs/packets.md REQ-NET-001): no name resolution; header-bound offsets need ordinary rights, payload offsets only match bytes a raw original saved. Omitted means no restriction. Not Wireshark display-filter syntax.'
        start_time:
          type: string
          format: date-time
          description: Inclusive saved-packet timestamp bound; normalized to UTC. It does not establish clock accuracy.
        end_time:
          type: string
          format: date-time
          description: Exclusive saved-packet timestamp bound. Must be later than start_time when both are present.
        tcp_flags:
          type: object
          additionalProperties: false
          properties:
            mask:
              type: integer
              minimum: 1
              maximum: 511
            value:
              type: integer
              minimum: 0
              maximum: 511
          required:
          - mask
          - value
          description: Only fully decoded TCP headers match (flags & mask) == value; value cannot contain bits outside mask.
        frame_prefix:
          type: object
          additionalProperties: false
          properties:
            offset:
              type: integer
              minimum: 0
              maximum: 65534
            length:
              type: integer
              minimum: 1
              maximum: 65535
          required:
          - offset
          - length
          description: Raw-only actual saved-frame byte window. Offset plus length must not exceed 1500. Missing bytes remain unavailable; no padding or inferred payload start.
        cursor:
          type: string
          minLength: 1
        limit:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        syscall_names:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          uniqueItems: true
        errors_only:
          type: boolean
        address:
          type: string
          pattern: ^0x[0-9a-fA-F]{1,16}$
        length:
          type: integer
          minimum: 1
          maximum: 32768
          default: 8192
          description: Bytes to read; at most 32 KiB per call (hex output fits the 96 KiB MCP result bound), default 8 KiB (fits the 24 KiB default target). Continue at the next address.
        command:
          type: string
          enum:
          - backtrace
          - threads
          - registers
          - frame_variables
          - managed_stack
          - heap_statistics
        thread_id:
          type: string
          minLength: 1
        frame:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
      - operation
      allOf:
      - if:
          properties:
            operation:
              const: packets
          required:
          - operation
        then:
          type: object
          additionalProperties: false
          properties:
            operation:
              const: packets
            case_id:
              type: string
              format: uuid
            artifact_id:
              type: string
              format: uuid
            grant_id:
