  /api/v1/operations/request_capture:
    post:
      operationId: request_capture
      summary: Disabled by default. Request a recipe-bound capture, optionally sharing
        its selected results; capture and sharing approvals are independent. Submit
        either the explicit shape or the reviewed preview request with its expected_plan_digest;
        a changed plan returns ReviewChanged. A recordingSave preview dispatches only
        its pinned existing-source snapshots under reviewed policy scope, never the
        full recipe. A retry with the same idempotency key returns the original capture
        and never recollects; a different request under that key is Conflict.
      tags:
      - Shared browser and MCP
      x-domain-contract: request_capture
      x-effect: command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpInput_request_capture'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: Required on session-authenticated POST; validate origin and session-bound
          token.
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        description: Must equal body.idempotency_key exactly. Use the original key
          when retrying this request.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Existing bounded MCP domain-result envelope; domain errors
            remain status=error.
          content:
