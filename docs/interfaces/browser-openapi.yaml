components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: __Host-asservat-session
    DownloadOAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth access token; audience/client and evidence:download checked
  schemas:
    ProcessingInventory:
      $ref: https://asservat.io/spec/v1/processing.schema.json#/$defs/Inventory
    ProcessingChange:
      $ref: https://asservat.io/spec/v1/processing.schema.json#/$defs/Change
    ProcessingReceipt:
      $ref: https://asservat.io/spec/v1/processing.schema.json#/$defs/Receipt
    McpInput_cancel_capture:
      type: object
      additionalProperties: false
      properties:
        capture_id:
          type: string
          format: uuid
        expected_revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        idempotency_key:
          type: string
          minLength: 1
      required:
      - capture_id
      - expected_revision
      - idempotency_key
    McpInput_compare_profiles:
      type: object
      additionalProperties: false
      properties:
        case_id:
          type: string
          format: uuid
        artifact_id:
          type: string
          format: uuid
        baseline_case_id:
          type: string
          format: uuid
        baseline_artifact_id:
          type: string
          format: uuid
        sample_type:
          type: string
          minLength: 1
        normalization:
          type: string
          enum:
          - none
          - perSecond
        limit:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
      - case_id
      - artifact_id
      - baseline_case_id
      - baseline_artifact_id
      - sample_type
      - normalization
    McpInput_create_share:
      type: object
      additionalProperties: false
      properties:
        case_id:
          type: string
          format: uuid
        artifacts:
          type: array
          items:
            $ref: https://asservat.io/spec/v1/common.schema.json#/$defs/artifactRef
          minItems: 1
        recipients:
          type: array
          items:
            anyOf:
            - type: object
              additionalProperties: false
              properties:
                kind:
                  enum:
                  - User
                  - Group
                name:
                  type: string
                  minLength: 1
                  description: User name, e-mail address or group name known to the
                    installation.
              required:
              - kind
              - name
            - $ref: https://asservat.io/spec/v1/common.schema.json#/$defs/recipient
          minItems: 1
          description: No count limit; bounded only by the request body byte limit
            (memory).
        data_classes:
          type: array
          items:
            type: string
            enum:
            - metadata
            - extract
            - raw
          minItems: 1
        operations:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        expires_at:
          type: string
          format: date-time
          description: Optional earlier end; a share otherwise lasts until the evidence's
            access end.
        reason:
          type: string
          minLength: 1
        idempotency_key:
          type: string
          minLength: 1
        management:
          $ref: https://asservat.io/spec/v1/management.schema.json#/$defs/request
      required:
      - case_id
      - artifacts
      - recipients
      - data_classes
      - operations
      - idempotency_key
    McpInput_deactivate_policy:
      type: object
      additionalProperties: false
      properties:
        cluster:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          description: Cluster name as configured in the hub (ADR-335 D4).
        namespace:
          type: string
          minLength: 1
          maxLength: 63
        policy_name:
          type: string
          minLength: 1
          maxLength: 253
          pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
        idempotency_key:
          type: string
          minLength: 1
      required:
      - cluster
      - namespace
      - policy_name
      - idempotency_key
    McpInput_decide_review:
      type: object
      additionalProperties: false
      properties:
        grant_id:
          type: string
          format: uuid
        decision:
          enum:
          - approve
          - deny
        reason:
          type: string
          minLength: 1
        idempotency_key:
          type: string
          minLength: 1
      required:
      - grant_id
      - decision
      - idempotency_key
    McpInput_download_artifact:
      type: object
      additionalProperties: false
      properties:
        action:
          enum:
          - prepare
          - status
          - cancel
          description: Selects the action; each value has its own strict argument
            set.
        artifact_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          minLength: 1
        representation:
          enum:
          - bundle
          - file
          default: bundle
          description: 'Core artifacts only: bundle (default) is the debugger-ready
            tar with executable, libraries, debug files and gdb.cmd/dlv.sh; file is
            the bare core. Ignored for other kinds.'
        download_id:
          type: string
          format: uuid
        after_revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Wait server-side until the state revision differs from this
            value or 30 seconds pass, then return the current state. Omit for an immediate
            read. Status reads are never charged.
      required:
      - action
      allOf:
      - if:
          properties:
            action:
              const: prepare
          required:
          - action
        then:
          type: object
          additionalProperties: false
          properties:
            action:
              const: prepare
            artifact_id:
              type: string
              format: uuid
            idempotency_key:
              type: string
              minLength: 1
            representation:
              enum:
              - bundle
              - file
              default: bundle
              description: 'Core artifacts only: bundle (default) is the debugger-ready
                tar with executable, libraries, debug files and gdb.cmd/dlv.sh; file
                is the bare core. Ignored for other kinds.'
          required:
          - action
          - artifact_id
          - idempotency_key
      - if:
          properties:
            action:
              const: status
          required:
          - action
        then:
          type: object
          additionalProperties: false
          properties:
            action:
              const: status
            download_id:
              type: string
              format: uuid
            after_revision:
              type: integer
              minimum: 1
              maximum: 9007199254740991
              description: Wait server-side until the state revision differs from
                this value or 30 seconds pass, then return the current state. Omit
                for an immediate read. Status reads are never charged.
          required:
          - action
          - download_id
      - if:
          properties:
            action:
              const: cancel
          required:
          - action
        then:
          type: object
          additionalProperties: false
          properties:
            action:
              const: cancel
            download_id:
              type: string
              format: uuid
            idempotency_key:
              type: string
              minLength: 1
          required:
          - action
          - download_id
          - idempotency_key
    McpInput_explain_access:
      type: object
      additionalProperties: false
      properties:
        target_ref:
          type: object
          additionalProperties: false
          properties:
            cluster:
              type: string
              minLength: 1
              maxLength: 63
              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
              description: Cluster name as configured in the hub (ADR-335 D4).
            namespace:
              type: string
              minLength: 1
              maxLength: 63
            kind:
              enum:
              - Deployment
              - StatefulSet
              - Pod
            name:
              type: string
              minLength: 1
              maxLength: 253
          required:
          - cluster
          - namespace
          - kind
          - name
        operation:
          enum:
          - capture
          - read
          - download
