  /api/v1/operations/get_capture:
    post:
      operationId: get_capture
      summary: Read authorized capture progress and per-action approval/partial outcomes.
        Case and approval links require authentication and contain no bearer authority.
        Recording saves explicitly return operation=recordingSave. Result-access status
        distinguishes saved evidence awaiting grant publication from collection failure.
        With after_revision the call waits server-side (at most 30 s) for the next change.
        view=settings returns the retained parameter snapshot for review or repeat instead;
        its strings are untrusted.
      tags:
      - Shared browser and MCP
      x-domain-contract: get_capture
      x-effect: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpInput_get_capture'
      parameters:
      - name: X-CSRF-Token
