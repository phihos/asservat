          - if:
              properties:
                fields:
                  contains:
                    const: frame_prefix_hex
              required:
              - fields
            then:
              required:
              - frame_prefix
              - grant_id
            else:
              properties:
                frame_prefix: false
      - if:
          properties:
            operation:
              const: syscalls
          required:
          - operation
        then:
          type: object
          additionalProperties: false
          properties:
            operation:
              const: syscalls
            case_id:
