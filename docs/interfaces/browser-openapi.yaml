    McpOutput_get_policy_status:
      allOf:
      - $ref: https://asservat.io/spec/v1/mcp-result.schema.json
      - oneOf:
        - type: object
          properties:
            status:
              const: ok
            data:
              type: object
              additionalProperties: false
              properties:
                policy_name:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                namespace:
                  type: string
                  minLength: 1
                  maxLength: 63
                policy_uid:
                  type: string
                  minLength: 1
                  description: Provenance only.
                acceptance_id:
                  type: string
                  format: uuid
                state:
                  enum:
                  - active
                  - deactivated
                  - suspended
                  - renewalDue
                  - expired
                  - deleted
                generation:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
                expires_at:
                  type: string
                  format: date-time
                  description: Policy grant end; present only for policies with automatic
                    intrusive actions.
                executor:
                  type: object
                  additionalProperties: false
                  properties:
                    kind:
                      const: policy
                    policy_uid:
                      type: string
                      minLength: 1
                  required:
                  - kind
                  - policy_uid
                executions_spent:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                watched_pods:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                occurrences:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                captured:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                recent:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      occurrence_id:
                        type: string
                        format: uuid
                      capture_id:
                        type: string
                        format: uuid
                      outcome:
                        enum:
                        - captured
                        - refused
                        - pending
                      restarts:
                        type: integer
                        minimum: 1
                        maximum: 9007199254740991
                      created_at:
                        type: string
                        format: date-time
                      detector:
                        enum:
                        - exit
                        - probe
                        - alert
                        - log
                        - resource
                      failed_at:
                        type: string
                        format: date-time
                    required:
                    - occurrence_id
                    - outcome
                    - detector
                    - created_at
                    if:
                      properties:
                        detector:
                          enum:
                          - probe
                          - alert
                          - log
                          - resource
                    then:
                      required:
                      - failed_at
                      not:
                        required:
                        - restarts
                    else:
                      required:
                      - restarts
                      not:
                        required:
                        - failed_at
                suppressions:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      reason:
                        enum:
                        - cooldown
                        - budget
                        - coalesced
                        - capacity
                        - authority
                        - unavailable
                        - overlong
                      count:
                        type: integer
                        minimum: 1
                        maximum: 9007199254740991
                      first_at:
                        type: string
                        format: date-time
                      last_at:
                        type: string
                        format: date-time
                    required:
                    - reason
                    - count
                    - first_at
                    - last_at
                detector:
                  type: object
                  additionalProperties: false
                  description: The current DebugPolicy's detector configuration (no
                    observed content).
                  properties:
                    kind:
                      enum:
                      - exit
                      - probe
                      - alert
                      - log
                      - resource
                    reasons:
                      type: array
                      items:
                        enum:
                        - CrashLoopBackOff
                        - Error
                        - OOMKilled
                    exit_codes:
                      type: array
                      items:
                        type: integer
                        minimum: 0
                        maximum: 255
                    probe_type:
                      enum:
                      - Liveness
                      - Readiness
                      - Startup
                    minimum_failures:
                      type: integer
                      minimum: 1
                      maximum: 9007199254740991
                    window_seconds:
                      type: integer
                      minimum: 30
                      maximum: 9007199254740991
                    match:
                      enum:
                      - literal
                      - regexp
                    json_field:
                      type: boolean
                    metric:
                      enum:
                      - cpuCores
                      - cpuQuotaRatio
                      - memoryBytes
                      - memoryLimitRatio
                    operator:
                      enum:
                      - gt
                      - gte
                      - lt
                      - lte
                    threshold:
                      type: number
                      minimum: 0
                    sample_interval_seconds:
                      type: integer
                      minimum: 30
                      maximum: 9007199254740991
                  required:
                  - kind
                sharing:
                  type: object
                  additionalProperties: false
                  description: 'Recurring sharing of the acceptance (ADR-239). stopped:
                    a manager stopped future sharing (stop_future_sharing; already
                    claimed captures still publish); policyChanged: the DebugPolicy
                    changed after acceptance, applying the changed policy shares again
                    under its new revision. Existing shares stay until they expire
                    or are revoked (revoke_share with sharing_intent_id = acceptance_id
                    and expected_revision = revision).'
                  properties:
                    state:
                      enum:
                      - active
                      - limitReached
                      - expired
                      - stopped
                      - policyChanged
                      - revoked
                    recipients:
                      type: integer
                      minimum: 1
                      maximum: 9007199254740991
                    shared_captures:
                      type: integer
                      minimum: 0
                      maximum: 9007199254740991
                    max_captures:
                      type: integer
                      minimum: 1
                      maximum: 9007199254740991
                      description: Optional bound; recurring sharing otherwise lasts
                        as long as the policy grant.
                    not_after:
                      type: string
                      format: date-time
                    revoked_at:
                      type: string
                      format: date-time
                    revision:
                      type: integer
                      minimum: 1
                      maximum: 9007199254740991
                    stopped_at:
                      type: string
                      format: date-time
                  required:
                  - state
                  - recipients
                  - shared_captures
                  - not_after
                  - revision
                collected_bytes_spent:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                  description: Native-output charges shared by this acceptance; a
                    reservation is released when its outcome is known. Not measured
                    bytes.
                max_collected_bytes:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                  description: Original accepted cumulative native-output ceiling,
                    shared across grant replacements and controls.
                collection_kind:
                  enum:
                  - podStatus
                  - packetCapture
                  - syscallTrace
                  - profile
                  - logs
                  description: Accepted collection action; controls available approval
                    commands, not acquisition authority.
                attached_grant_id:
                  type: string
                  format: uuid
                  description: Grant named by the current attachment pointer; does
                    not assert that its authority, budget or recorder readiness currently
                    permits collection.
                renewal_due:
                  type: boolean
                  description: 'RenewalDue: the policy grant ends within the administrator''s
                    renewal notice; renew it in place.'
              required:
              - policy_name
              - namespace
              - acceptance_id
              - state
              - generation
              - executor
              - watched_pods
              - occurrences
              - captured
              - recent
              - suppressions
              - collection_kind
          required:
          - status
          - data
        - type: object
          properties:
            status:
              const: error
            data:
              type: object
              additionalProperties: false
              properties:
                code:
                  type: string
                  minLength: 1
                message:
                  type: string
                  minLength: 1
                retryable:
                  type: boolean
                navigation_uri:
                  type: string
                  format: uri
                responsible_role:
                  enum:
                  - maintainer
                  - approver
                  - administrator
                  - none
                retry_after_seconds:
                  type: integer
                  minimum: 1
              required:
              - code
              - message
              - retryable
          required:
          - status
          - data
