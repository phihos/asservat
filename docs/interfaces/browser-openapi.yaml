openapi: 3.1.1
info:
  title: Asservat browser boundary design
  version: 0.1.0-design
  description: Reviewable interface design, not an implemented endpoint. Shared operation
    schemas mirror the canonical MCP catalog; console operations never add permission-configuration
    CRUD.
servers:
- url: https://asservat.example.invalid
security:
- BrowserSession: []
paths:
  /api/v1/operations/list_cases:
    post:
      operationId: list_cases
      summary: List only cases currently visible to the caller.
      tags:
      - Shared browser and MCP
      x-domain-contract: list_cases
      x-effect: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpInput_list_cases'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: Required on session-authenticated POST; validate origin and session-bound
          token.
        schema: &id001
          type: string
          maxLength: 256
      responses:
        '200':
          description: Existing bounded MCP domain-result envelope; domain errors
            remain status=error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpOutput_list_cases'
        default:
          description: Transport/session/validation failure; no evidence in error
            details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/operations/get_case:
