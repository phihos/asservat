  /api/v1/downloads/{download_id}/content:
    get:
      operationId: download_artifact_content
      description: >-
        Requires current exact artifact rights and a completed finite encrypted
        HTTP preflight audit before representation metadata or conditional headers.
        Conditional selection precedes response/window reservation. Browser GET
        reads its original session without credential refresh or worker dispatch;
        bearer authentication uses the separately pinned download resource audience.
        The acquisition worker performs authorized native decoding; the hub has no
        unwrap authority. Failure after headers aborts the stream after joined cleanup.
      summary: Stream exact authorized native file bytes; not a bearer link or object-store
        redirect
      x-effect: read
      security:
      - BrowserSession: []
      - DownloadOAuth: []
      parameters:
      - name: download_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Range
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
        description: One bytes range only; reject multiple byte ranges. Unknown range
          units are ignored and require a freshly authorized/accounted full response.
      - name: If-Match
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
        description: Exact strong opaque ETag from prepared metadata or a prior response.
          Asservat clients use this with Range; mismatch returns 412 without file
          bytes.
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
        description: Standard weak comparison after If-Match and current access checks;
          a match returns 304 without file bytes. Managed responses remain no-store.
      - name: If-Range
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
        description: Optional standard HTTP fallback; a mismatch requests the whole
          unchanged session artifact, subject to fresh full-response authorization
          and byte accounting. Use If-Match to require failure instead.
      responses:
        '200':
          description: Full native file; attachment, no-store/private, nosniff, bounded
            current authorization and transfer accounting.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
                minimum: 0
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                const: no-store, private
        '206':
          description: Exact authorized single range; attachment, no-store/private,
            nosniff, bounded current authorization and transfer accounting.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Range:
              description: Exact inclusive native byte offsets and total representation
                size
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
                minimum: 0
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                const: no-store, private
        '304':
          description: Authorized immutable representation matches If-None-Match;
            no response body and no file transfer spend. Metadata authorization/read
            work still applies.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                const: no-store, private
        '400':
          description: Malformed or oversized conditional headers
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Authenticate with the correct session/OAuth client
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Current authority missing or denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Unavailable without hidden-artifact disclosure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Not ready or transfer already active
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Expired or cancelled transfer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: If-Match version precondition failed; no file bytes emitted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '416':
          description: Invalid, unsatisfiable or unsupported byte range
          headers:
            Content-Range:
              description: Unsatisfied byte range with current native length (bytes
                */length)
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Transfer budget or concurrency exhausted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dependent authority/storage unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/operations/activate_policy:
    post:
      operationId: activate_policy
      summary: 'Activate the current revision of a hub-held restart-trigger DebugPolicy for your team (ADR-228). Requires whole-pod collection rights and membership in a sponsoring group of the workload''s automation AccessBinding. The policy then captures pod status automatically on Pod restarts within the team''s finite envelope. Retry an uncertain result with the same idempotency key. A DebugPolicy with spec.sharing (ADR-239) also shares each of its next maxCaptures captures until notAfter with the named recipients: this needs the evidence:share scope and an evidence-owner group of the automation AccessBinding: the first call returns SharingReviewRequired with the review (repeated collections will be shared, recipients, maximum captures, end); activate again with sharing_reviewed true to accept it.'
