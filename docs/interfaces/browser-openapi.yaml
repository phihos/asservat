openapi: 3.1.1
info:
  title: Asservat browser boundary design
  version: 0.1.0-design
  description: Reviewable interface design, not an implemented endpoint. Shared operation
    schemas mirror the canonical MCP catalog; console operations never add permission-configuration
    CRUD.
servers:
- url: https://asservat.example.invalid
security:
- BrowserSession: []
paths:
  /api/v1/processing/rules:
    get:
      operationId: listProcessingRules
      x-effect: read
      summary: Read the privacy operator's bounded durable restriction inventory.
      parameters:
      - name: after
        in: query
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          default: 50
      responses:
        '200':
          description: Current content-minimized processing rules; each page authorizes
            independently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingInventory'
        default:
          description: Session, authority, validation or availability refusal.
  /api/v1/processing/changes:
    post:
      operationId: changeProcessing
      x-effect: command
      summary: Initialize, restrict or release processing, or request early erasure
        under current privacy authority.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 43
          maxLength: 43
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessingChange'
      responses:
        '200':
          description: Acknowledged processing change. An early-erasure receipt records
            cutoff acceptance; deletion has separate status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingReceipt'
        '403':
          description: Current privacy-operator authority is denied or browser request
            protection refused the change.
        '409':
          description: Exact revision or idempotency conflict. Refresh inventory before
            another rule change.
        default:
          description: Refusal or uncertain result; retry an uncertain change with
            the same key and input.
  /api/v1/operations/list_cases:
    post:
      operationId: list_cases
      summary: List only cases currently visible to the caller.
      tags:
      - Shared browser and MCP
      x-domain-contract: list_cases
      x-effect: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpInput_list_cases'
      parameters:
      - &id002
        name: X-CSRF-Token
        in: header
        required: true
        description: Required on session-authenticated POST; validate origin and session-bound
          token.
        schema: &id001
          type: string
      responses:
        '200':
          description: Existing bounded MCP domain-result envelope; domain errors
            remain status=error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpOutput_list_cases'
        default:
          description: Transport/session/validation failure; no evidence in error
            details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/operations/get_case:
    post:
      operationId: get_case
      summary: Read an authorized case projection, including evidence gaps.
      tags:
      - Shared browser and MCP
      x-domain-contract: get_case
