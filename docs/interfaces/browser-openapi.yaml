      security:
      - BrowserSession: []
      - DownloadOAuth: []
      parameters:
      - name: download_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Range
        in: header
        required: false
        schema:
          type: string
        description: One bytes range only; reject multiple byte ranges. Unknown range
          units are ignored and require a freshly authorized/accounted full response.
      - name: If-Match
        in: header
        required: false
        schema:
          type: string
        description: Exact strong opaque ETag from prepared metadata or a prior response.
          Asservat clients use this with Range; mismatch returns 412 without file
          bytes.
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
        description: Standard weak comparison after If-Match and current access checks;
          a match returns 304 without file bytes. Managed responses remain no-store.
      - name: If-Range
        in: header
        required: false
        schema:
          type: string
        description: Optional standard HTTP fallback; a mismatch requests the whole
          unchanged session artifact, subject to fresh full-response authorization
          and byte accounting. Use If-Match to require failure instead.
      responses:
        '200':
          description: Full native file; attachment, no-store/private, nosniff, bounded
            current authorization and transfer accounting.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
                minimum: 0
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                const: no-store, private
        '206':
          description: Exact authorized single range; attachment, no-store/private,
            nosniff, bounded current authorization and transfer accounting.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Range:
              description: Exact inclusive native byte offsets and total representation
                size
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
                minimum: 0
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                const: no-store, private
        '304':
          description: Authorized immutable representation matches If-None-Match;
            no response body and no file transfer spend. Metadata authorization/read
            work still applies.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                const: no-store, private
        '400':
          description: Malformed or oversized conditional headers
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Authenticate with the correct session/OAuth client
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Current authority missing or denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Unavailable without hidden-artifact disclosure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Not ready or transfer already active
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Expired or cancelled transfer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: If-Match version precondition failed; no file bytes emitted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '416':
          description: Invalid, unsatisfiable or unsupported byte range
          headers:
            Content-Range:
              description: Unsatisfied byte range with current native length (bytes
                */length)
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Transfer budget or concurrency exhausted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dependent authority/storage unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/operations/deactivate_policy:
    post:
      operationId: deactivate_policy
      summary: Deactivate an accepted hub-held restart-trigger DebugPolicy (ADR-229).
        Requires whole-pod collection rights and membership in a workload-maintainer
        group of the policy's delegating AccessBinding. No further occurrence is admitted
        once the deactivation commits; charges already made are kept and existing
        captures and evidence are kept. Repeating it is harmless. A deactivated revision
        cannot be activated again; change the DebugPolicy to activate a new revision.
      tags:
      - Shared browser and MCP
      x-domain-contract: deactivate_policy
      x-effect: command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpInput_deactivate_policy'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: Required on session-authenticated POST; validate origin and session-bound
          token.
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        description: Must equal body.idempotency_key exactly. Use the original key
          when retrying this deactivation.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Existing bounded MCP domain-result envelope; domain errors
            remain status=error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpOutput_deactivate_policy'
        default:
          description: Transport/session/validation failure; no evidence in error
            details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
